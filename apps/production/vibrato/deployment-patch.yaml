apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:9634a44c3f6671812efb5ccc2670c1ac6b82d8d4
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
