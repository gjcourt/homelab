# LAN-only front door: https://chat.burntbytes.com via the Cilium gateway.
# NOT published through the Cloudflare tunnel (see
# apps/production/cloudflare-tunnel/config.yaml) — LAN reachable only.
# Authelia ext_authz on the gateway gates every route; the one_factor rule for
# this host lives in apps/production/authelia/configuration.yaml. See
# docs/architecture/gateway-auth.md.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: openwebui-http
  namespace: openwebui-prod
spec:
  hostnames:
    - chat.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: openwebui-https
  namespace: openwebui-prod
spec:
  hostnames:
    - chat.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - name: openwebui
          port: 8080
