apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llmux-stage
resources:
  - ../../base/llmux/

labels:
  - pairs:
      env: staging
      app.kubernetes.io/instance: staging
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: llmux
    patch: |
      - op: replace
        path: /metadata/name
        value: llmux-stage
  # Pair llmux-stage with openwebui-stage only; never cross environments.
  - target:
      kind: CiliumNetworkPolicy
      name: llmux
    patch: |
      - op: test
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: openwebui
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: openwebui-stage
