crds:
  # This option decides if the CRDs should be installed
  # as part of the Helm installation.
  enabled: true

# Cluster-critical: cert-manager issues TLS for every Gateway listener and
# webhook in the cluster.
global:
  priorityClassName: system-cluster-critical

config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  # Enables gateway api to manage certs
  enableGatewayAPI: true

# DNS-01 self-check MUST bypass cluster DNS.
#
# Before validating with Let's Encrypt, cert-manager checks that the challenge
# TXT record has propagated. By default it asks the cluster resolver, which
# chains CoreDNS -> the node's resolv.conf -> AdGuard (10.42.2.43). AdGuard runs
# a split-horizon view of burntbytes.com and answers NOERROR/ANSWER:0 for
# _acme-challenge.burntbytes.com, so the self-check can never pass — even though
# Cloudflare has published the record and public resolvers serve it fine.
#
# That silently stalled the *.burntbytes.com renewal for 30 days (Order pending
# since 2026-07-06) until the certificate expired on 2026-08-05, taking every
# production host down with an expired-cert browser error. The Certificate
# reported Ready=True throughout, because the OLD cert was still valid; the real
# signal was Issuing=True/Renewing sitting unchanged for a month.
#
# Pointing the self-check at public recursive resolvers is the documented remedy
# for split-horizon DNS. `-only` stops it falling back to the cluster resolver.
extraArgs:
  - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
  - --dns01-recursive-nameservers-only

# Enable the default approver
# This automatically approves certificate requests from cert-manager
approveSignerNames:
  - "issuers.cert-manager.io/*"
  - "clusterissuers.cert-manager.io/*"

# Metrics scraping. Why this exists: the *.burntbytes.com wildcard expired
# 2026-08-05 after a renewal stalled for 30 days, and nothing noticed because
# certmanager_certificate_expiration_timestamp_seconds was never scraped. The
# alerts this feeds live in infra/configs/alerts/cert-manager-rules.yaml.
#
# Two settings below are load-bearing; without either, this is monitoring that
# doesn't monitor:
#
#   labels.release — the chart labels its ServiceMonitor `prometheus: default`
#     only. This cluster's Prometheus selects on `release:
#     kube-prometheus-stack` (serviceMonitorSelectorNilUsesHelmValues=true), so
#     without this the ServiceMonitor is created and then silently ignored.
#
#   honorLabels — prometheus-operator sets `namespace` on every scraped series
#     from the TARGET's namespace (always `security` here). With the default
#     honorLabels=false the target wins and the certificate's own namespace is
#     renamed `exported_namespace`, so every alert annotation would report
#     `security` regardless of where the cert lives — and the runbook line
#     would print the wrong `kubectl -n`. honorLabels=true keeps the metric's
#     own namespace/name, which IS the subject of these alerts. Same pattern
#     kube-prometheus-stack uses for kube-state-metrics.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    honorLabels: true
    labels:
      release: kube-prometheus-stack

webhook:
  hostNetwork: false
  # Use the host's DNS
  securePort: 10250