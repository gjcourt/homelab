apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:945661bdb0b63447d1e4822846e58a32007c8305
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
