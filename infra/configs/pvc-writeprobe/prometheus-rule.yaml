apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pvc-writeprobe
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: pvc-writeprobe
      rules:
        - alert: PvcNotWritable
          expr: homelab_pvc_writable == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'PVC {{ $labels.namespace }}/{{ $labels.pvc }} is not writable'
            description: >-
              A real write to {{ $labels.mountpath }} in pod {{ $labels.pod }}
              failed. The pod may still report Running and Ready — status does
              not reflect this failure. Most likely an iSCSI read-only remount.
              Runbook: AGENTS.md "Recovering read-only iSCSI volumes".

        # A sustained "unknown" is not the same as a failure, but it IS a
        # blind spot: we are not currently able to tell whether that volume
        # works. Warning, not critical -- it does not mean data is at risk, it
        # means we cannot see. Long window so a rolling restart stays quiet.
        - alert: PvcWriteProbeUnknown
          expr: homelab_pvc_probe_unknown == 1
          for: 45m
          labels:
            severity: warning
          annotations:
            summary: 'Cannot determine writability of {{ $labels.namespace }}/{{ $labels.pvc }}'
            description: >-
              The probe could not classify a write to {{ $labels.mountpath }} in
              pod {{ $labels.pod }} -- exec failed, or the error was not a
              recognised filesystem refusal. This volume is unmonitored, not
              known-bad. Check the pvc-writeprobe logs for the raw error.

        # The probe going silent looks identical to everything being fine, so
        # the absence of data is itself an alert. Both halves are needed: the
        # first catches a wedged probe still serving stale metrics, the second
        # catches the pod being gone entirely.
        - alert: PvcWriteProbeStale
          expr: time() - homelab_pvc_writeprobe_last_run_seconds > 1800
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'pvc-writeprobe has not completed a sweep in 30m'
            description: 'PVC writability is currently unmonitored.'

        - alert: PvcWriteProbeAbsent
          expr: absent(homelab_pvc_writeprobe_last_run_seconds)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'pvc-writeprobe is not reporting at all'
            description: 'PVC writability is currently unmonitored.'
