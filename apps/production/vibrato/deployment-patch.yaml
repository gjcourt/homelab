apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:39bdbee1e727357cf3a8a20ec8a45602974d632c
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
