# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  # Vendored custom cards loaded as ES modules. mushroom.js is mounted to
  # /config/www (served at /local/) from the homeassistant-www ConfigMap.
  # This is the git-managed equivalent of a HACS resource registration and
  # works in storage-mode lovelace (unlike `lovelace: resources:`).
  extra_module_url:
    # card-mod first so it's registered before cards that use card_mod render.
    - /local/card-mod.js
    - /local/mushroom.js
    - /local/clock-weather-card.js

# Lovelace dashboards. Default + Map / Floor Plan / Switchboard stay
# UI-managed (storage mode). Only the Control dashboard is migrated to
# YAML mode here — its source-of-truth lives at files/dashboards/control.yaml
# and is bundled into the homeassistant-config ConfigMap by the
# configMapGenerator. Edits go through PRs.
#
# Note: HA's lovelace.dashboards schema rejects single-word slug keys
# (must contain a hyphen). We use `home-control` as the slug — the
# dashboard renders with the configured `title:` ("Control") regardless
# of the slug, only the URL path (/home-control) reflects the slug.
# Storage is the default mode (the other dashboards stay UI-managed); the
# `mode:` key is deprecated, so it isn't set.
lovelace:
  dashboards:
    home-control:
      mode: yaml
      filename: dashboards/control.yaml
      title: Control
      icon: mdi:view-dashboard
      show_in_sidebar: true

# Auto-off helpers. Each has:
#   timer.<name>_timer       — counts down once triggered
#   input_number.<name>_minutes — operator-configurable timeout
#
# Bathroom fans (via Lutron Caseta switches):
#   timer.hall_bathroom_fan_timer / input_number.hall_bathroom_fan_minutes
#   timer.master_bathroom_fan_timer / input_number.master_bathroom_fan_minutes
#   timer.powder_bathroom_fan_timer / input_number.powder_bathroom_fan_minutes
#
# Laundry room lights (via Lutron Caseta):
#   timer.laundry_room_light_timer / input_number.laundry_room_light_minutes
#
# The auto-off automations in automations.yaml tie them to the corresponding
# Lutron Caseta switch/light entities.
input_number:
  hall_bathroom_fan_minutes:
    name: Hall Bathroom Fan Timer
    min: 4
    max: 45
    step: 1
    initial: 30
    unit_of_measurement: min
    mode: slider
  master_bathroom_fan_minutes:
    name: Master Bathroom Fan Timer
    min: 4
    max: 45
    step: 1
    initial: 30
    unit_of_measurement: min
    mode: slider
  powder_bathroom_fan_minutes:
    name: Powder Bathroom Fan Timer
    min: 4
    max: 45
    step: 1
    initial: 30
    unit_of_measurement: min
    mode: slider
  nightlight_brightness:
    name: Nightlight Brightness
    min: 1
    max: 100
    step: 1
    initial: 6
    unit_of_measurement: "%"
    mode: slider
  nightlight_random_offset:
    # Max jitter (in minutes) applied to the configured turn-off time.
    # The actual jitter for today is picked at midnight and stored in
    # `nightlight_offset_today` below — this entry is just the user-facing
    # cap. See the "Nightlight" automations in automations.yaml.
    name: Nightlight Random Offset (max)
    min: 0
    max: 60
    step: 5
    initial: 30
    unit_of_measurement: min
    mode: slider
  nightlight_offset_today:
    # Today's actual jitter, in minutes. Written at midnight by the
    # "Nightlight — pick today's random offset" automation; read by the
    # `sensor.nightlight_turnoff_time` template. Defaults to 0 on cold
    # start; the homeassistant-start priming automation re-rolls it.
    name: Nightlight Offset (today)
    min: 0
    max: 120
    step: 1
    initial: 0
    unit_of_measurement: min
    mode: box
  laundry_room_light_minutes:
    name: Laundry Room Light Timer
    min: 4
    max: 45
    step: 1
    initial: 30
    unit_of_measurement: min
    mode: slider

timer:
  hall_bathroom_fan_timer:
    name: Hall Bathroom Fan Timer
  master_bathroom_fan_timer:
    name: Master Bathroom Fan Timer
  powder_bathroom_fan_timer:
    name: Powder Bathroom Fan Timer
  laundry_room_light_timer:
    name: Laundry Room Light Timer

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
binary_sensor: !include binary_sensors.yaml

# Room-level BLE presence via ESPresense nodes (MQTT broker mosquitto-lb).
# Each mqtt_room sensor reports which room the tracked device is closest to.
# Device identity is enrolled on the ESPresense node itself (IRK-based, so it
# survives iOS BLE MAC rotation). On enroll, ESPresense assigns a device id of
# the form `phone:<slug>` (the enroll name slugified, prefixed by category) and
# publishes it in `espresense/settings/irk:<key>/config` as the `id` field.
# That id is BOTH the device_id and the final-but-one segment of the device
# topic: ESPresense publishes per-room to `espresense/devices/<id>/<room>`;
# mqtt_room subscribes to `<state_topic>/+` and matches the payload `id`
# against device_id, reporting the closest room.
#
# To add a device: enroll it on a node (http://<node>/ui/ -> Name -> Enroll ->
# accept the iOS Bluetooth pairing), read the assigned id from
# `espresense/settings/irk:<key>/config`, then add an entry below using it.
sensor:
  - platform: mqtt_room
    name: "George iPhone Room"
    device_id: "phone:george-iphone"
    state_topic: "espresense/devices/phone:george-iphone"
    timeout: 5
    away_timeout: 180

# Since 2026.8, HA imports this block into .storage/http on first boot and
# ignores the YAML after that: change proxies in Settings → System → Network.
# Kept so a fresh /config (restore drill, new PVC) imports the right values.
# 2026.7.1 and earlier stored these without their masks; 2026.10 restores them
# on import (http/config.py, _stable_differs_only_by_lost_proxy_masks).
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.244.0.0/16  # Trust Cluster Pod CIDR
    - 10.42.2.0/24 # Trust Node Network (Envoy HostNetwork)
    - 127.0.0.1

input_datetime:
  nightlight_turnoff_time:
    name: Nightlight Turn Off Time
    has_date: false
    has_time: true
    initial: "23:00"

# Nightlight template sensor — turn-off time = base time + today's offset.
# Today's offset is held in input_number.nightlight_offset_today (single
# source of truth; written at midnight by the priming automation). The
# previous design had a template `sensor.nightlight_random_offset` that
# read input_number.nightlight_random_offset.max (the *schema* max, always
# 120) and produced a non-random `day_of_year % 121` value — and the
# midnight automation simultaneously corrupted the user's max setting by
# writing a random into the state. Both have been retired.
template:
  - sensor:
      - name: "Nightlight Turn Off Time"
        unique_id: nightlight_turnoff_time
        state: >
          {% set ts = state_attr('input_datetime.nightlight_turnoff_time', 'timestamp') %}
          {% if ts is none %}
            {% set base_minutes = 23 * 60 %}
          {% elif ts is string %}
            {% set base_time = strptime(ts, '%H:%M') %}
            {% set base_minutes = base_time.hour * 60 + base_time.minute %}
          {% else %}
            {# timestamp is SECONDS since midnight (verified live: 23:00 → 82800) #}
            {% set base_minutes = (ts | int) // 60 %}
          {% endif %}
          {% set offset = states('input_number.nightlight_offset_today') | int(0) %}
          {% set total_minutes = (base_minutes + offset) % 1440 %}
          {{ '%02d:%02d' | format(total_minutes // 60, total_minutes % 60) }}
      # Summary counters for the Overview landing page (Controls-first layout).
      - name: "Lights On"
        unique_id: lights_on_count
        unit_of_measurement: "on"
        icon: mdi:lightbulb-group
        state: "{{ states.light | selectattr('state', 'eq', 'on') | list | count }}"
      - name: "Media Playing"
        unique_id: media_playing_count
        unit_of_measurement: "playing"
        icon: mdi:play-circle
        state: "{{ states.media_player | selectattr('state', 'eq', 'playing') | list | count }}"
      # Maintenance tasks needing attention: due, overdue, or never recorded
      # (anything not "ok"). Finds tasks by name like the automations do.
      - name: "Maintenance to do"
        unique_id: maintenance_to_do_count
        default_entity_id: sensor.maintenance_to_do
        unit_of_measurement: "to do"
        icon: mdi:wrench-clock
        state: >
          {{ states.sensor
             | selectattr('entity_id', 'match', 'sensor\.maintenance_')
             | selectattr('attributes.default_interval_days', 'defined')
             | rejectattr('state', 'eq', 'ok')
             | list | count }}
      # Changes whenever any maintenance last-done date or interval changes:
      # the sum of all last-done timestamps plus all intervals. It exists only
      # to trigger "Maintenance — save state right after a change"
      # (automations.yaml), and finds tasks by name, so new tasks need nothing.
      - name: "Maintenance change marker"
        unique_id: maintenance_change_marker
        default_entity_id: sensor.maintenance_change_marker
        icon: mdi:content-save-cog
        state: >
          {% set done = states.sensor
             | selectattr('entity_id', 'match', 'sensor\.maintenance_.*_last_done$')
             | map(attribute='state') | map('as_timestamp', 0) | sum %}
          {% set intervals = states.input_number
             | selectattr('entity_id', 'match', 'input_number\.maintenance_.*_interval_days$')
             | map(attribute='state') | map('float', 0) | sum %}
          {{ (done + intervals) | int }}

# ============================================================================
# Maintenance reminders (HASS-2): tasks whose timer restarts when they're done
# ============================================================================
# Each task is one package below. Pressing its Done button (dashboard card, or
# the "Done" action on the phone notification) records "now" as the last-done
# time, and the next due date becomes last done + interval. A task is "due" on
# its due date, "overdue" after it, and reminders go out at 09:00 each day it
# is due or overdue (automations.yaml, "Maintenance" section).
#
# Per task <key> (e.g. maintenance_cat_pee_pad), the package creates:
#   input_button.<key>_done            — press = done now
#   input_number.<key>_interval_days   — interval, editable on the dashboard
#   sensor.<key>_last_done             — when it was last done (timestamp).
#                                        Trigger-based, so it restores across
#                                        restarts and starts `unknown` (never
#                                        recorded) on a fresh install.
#   sensor.<key>                       — ok / due / overdue (unknown until a
#                                        last-done date exists), with
#                                        last_done, next_due, days_left and
#                                        interval_days attributes.
#
# Why a trigger-based sensor and not input_datetime for last-done: a fresh
# input_datetime defaults to today 00:00 (input_datetime/__init__.py,
# 2026.10.2), which would read as "done today" when it never was.
#
# Intervals: input_number has no `initial:` so a dashboard edit survives a
# restart. A fresh input_number would start at its min, so min is 0 and 0
# means "not set": sensor.<key> then uses default_interval_days, and the
# "Maintenance — seed default intervals" automation writes the default into
# the input_number on start. An interval of 0 is meaningless, so nothing real
# is lost.
#
# To add a task:
#   1. Copy one package below (not the first: it holds the shared anchors),
#      rename the key everywhere (find/replace maintenance_<old> →
#      maintenance_<new>), and set name, icon and default_interval_days.
#   2. Add a row to the Maintenance view in dashboards/control.yaml (two task
#      cards and one interval tile; see the comment there).
#   Automations, notifications and the "correct a date" script find tasks by
#   the sensor.maintenance_* naming, so they need no change.
homeassistant:
  packages:
    maintenance_cat_pee_pad:
      input_button:
        maintenance_cat_pee_pad_done:
          name: Cat pee pad done
          icon: mdi:paw
      input_number:
        maintenance_cat_pee_pad_interval_days:
          # Shared anchors hold only the keys every task has in common, so a
          # task's own keys never override a merged one (HA warns on that).
          <<: &maintenance_interval
            min: 0
            max: 3650
            step: 1
            unit_of_measurement: days
            mode: box
            icon: mdi:calendar-refresh
          name: Cat pee pad interval
      template:
        - triggers:
            - trigger: state
              entity_id: input_button.maintenance_cat_pee_pad_done
              not_to:
                - unavailable
                - unknown
              id: done
            # Fired by script.maintenance_correct_last_done.
            - trigger: event
              event_type: maintenance_correct_last_done
              event_data:
                entity_id: sensor.maintenance_cat_pee_pad_last_done
              id: correct
          sensor:
            - <<: &maintenance_last_done
                device_class: timestamp
                icon: mdi:calendar-check
                state: >
                  {% if trigger.id == 'done' %}
                    {{ now().isoformat() }}
                  {% else %}
                    {% set d = as_datetime(trigger.event.data.when | default(''), none) %}
                    {% if d is none %}
                      {# Bad date in the event: keep what we had. #}
                      {{ this.state if this.state not in ['unknown', 'unavailable'] else none }}
                    {% else %}
                      {{ (d if d.tzinfo else d.replace(tzinfo=now().tzinfo)).isoformat() }}
                    {% endif %}
                  {% endif %}
                attributes:
                  # The value this press replaced, so a mis-tap loses nothing:
                  # restore it with script.maintenance_correct_last_done.
                  previous: "{{ this.state if this.state not in ['unknown', 'unavailable'] else none }}"
              name: Cat pee pad last done
              unique_id: maintenance_cat_pee_pad_last_done
              default_entity_id: sensor.maintenance_cat_pee_pad_last_done
        - sensor:
            - <<: &maintenance_status
                # States: ok / due / overdue, or `unknown` (the template renders
                # none) when never recorded. Plain text, not device_class: enum:
                # 2026.10 template sensors reject `options:`, and an enum
                # without its option list is a half-declared sensor.
                # Due-date math is in local calendar dates (last-done date +
                # N days), so a DST change or a just-after-midnight time can't
                # shift the due date by a day.
                state: >
                  {% set last = states('sensor.' ~ key ~ '_last_done') | as_datetime(none) %}
                  {% set iv = states('input_number.' ~ key ~ '_interval_days') | int(0) %}
                  {% set iv = iv if iv > 0 else default_interval_days %}
                  {% if last is none %}
                    {{ none }}
                  {% else %}
                    {% set left = (as_local(last).date() + timedelta(days=iv) - now().date()).days %}
                    {{ 'overdue' if left < 0 else ('due' if left == 0 else 'ok') }}
                  {% endif %}
                attributes:
                  default_interval_days: "{{ default_interval_days }}"
                  interval_days: >
                    {% set iv = states('input_number.' ~ key ~ '_interval_days') | int(0) %}
                    {{ iv if iv > 0 else default_interval_days }}
                  # The interval in words for the card and notifications:
                  # whole years, else months when within 3 days of a whole
                  # number of months (182 → "every 6 months"), else days.
                  interval_text: >
                    {% set iv = states('input_number.' ~ key ~ '_interval_days') | int(0) %}
                    {% set iv = iv if iv > 0 else default_interval_days %}
                    {% set months = (iv / 30.44) | round(0) | int %}
                    {% if iv == 1 %}every day
                    {% elif iv % 365 == 0 %}every {{ 'year' if iv == 365 else (iv // 365) ~ ' years' }}
                    {% elif iv >= 28 and (months * 30.44 - iv) | abs <= 3 %}every {{ 'month' if months == 1 else months ~ ' months' }}
                    {% else %}every {{ iv }} days
                    {% endif %}
                  last_done: >
                    {% set last = states('sensor.' ~ key ~ '_last_done') | as_datetime(none) %}
                    {{ last.isoformat() if last is not none else none }}
                  # A date (YYYY-MM-DD), not a time: tasks are due on a day.
                  next_due: >
                    {% set last = states('sensor.' ~ key ~ '_last_done') | as_datetime(none) %}
                    {% set iv = states('input_number.' ~ key ~ '_interval_days') | int(0) %}
                    {% set iv = iv if iv > 0 else default_interval_days %}
                    {{ (as_local(last).date() + timedelta(days=iv)).isoformat() if last is not none else none }}
                  # Calendar days until the due date: 0 = due today, negative =
                  # days overdue. None (not 0) when never recorded.
                  days_left: >
                    {% set last = states('sensor.' ~ key ~ '_last_done') | as_datetime(none) %}
                    {% set iv = states('input_number.' ~ key ~ '_interval_days') | int(0) %}
                    {% set iv = iv if iv > 0 else default_interval_days %}
                    {{ (as_local(last).date() + timedelta(days=iv) - now().date()).days if last is not none else none }}
              name: Cat pee pad
              unique_id: maintenance_cat_pee_pad
              default_entity_id: sensor.maintenance_cat_pee_pad
              icon: mdi:paw
              variables:
                key: maintenance_cat_pee_pad
                default_interval_days: 3

    maintenance_under_sink_filter:
      input_button:
        maintenance_under_sink_filter_done:
          name: Under-sink water filter done
          icon: mdi:water-pump
      input_number:
