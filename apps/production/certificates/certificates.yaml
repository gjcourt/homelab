apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: burntbytes-prod-wildcard-tls
  namespace: security
spec:
  secretName: burntbytes-prod-wildcard-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  dnsNames:
    - "*.burntbytes.com"
    - "burntbytes.com"
---
# Leaf for the bare `go` intranet hostname, signed by the private, name-
# constrained intranet CA (infra/configs/cert-manager-issuers/intranet-ca.yaml).
# Served by the gateway's https-go listener.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: go-intranet-tls
  namespace: security
spec:
  secretName: go-intranet-tls
  issuerRef:
    name: intranet-ca
    kind: ClusterIssuer
  dnsNames:
    - go
  duration: 2160h # 90 days, like the public certs
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  usages:
    - server auth
    - digital signature
