# The Plane half of agent-desk's network, for staging: webhook deliveries in
# from plane-stage's worker, REST calls out to plane-stage's api. Plane's own
# policy (apps/staging/plane/networkpolicy.yaml) has the matching rules.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-desk-plane
  namespace: agent-desk
  labels:
    app.kubernetes.io/part-of: network-policies
spec:
  description: "agent-desk-stage <-> plane-stage: worker webhooks in on 8080, api out on 8000."
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: plane-stage
            app.name: plane-stage-plane-worker
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: plane-stage
            app.name: plane-stage-plane-api
      toPorts:
        - ports:
            - {port: "8000", protocol: TCP}
