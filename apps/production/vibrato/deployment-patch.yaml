apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:3ec282813d6d67bddb0be845c01ddecb9ca8fc8a
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
