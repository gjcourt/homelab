# Daily base backup at 02:30 UTC, plus one at creation so the first-install
# checklist can confirm a base backup before real data goes in.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: plane-db-production-cnpg-v1-backup
  namespace: plane-prod
spec:
  cluster:
    name: plane-db-production-cnpg-v1
  # 6-field cron: seconds minutes hours dom month dow
  schedule: "0 30 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
