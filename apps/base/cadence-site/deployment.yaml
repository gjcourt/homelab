apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence-site
  namespace: cadence-site
  labels:
    app: cadence-site
spec:
  # One replica while this is staging-only; raise to 2 (spread across nodes, like
  # burntbytes) when it serves the public cadence.burntbytes.com.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cadence-site
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cadence-site
    spec:
      serviceAccountName: cadence-site
      automountServiceAccountToken: false
      # ghcr.io/gjcourt/cadence-site is a public package (a public page, nothing
      # private in it), so no pull secret.
      # Spread replicas across nodes where possible (matters once there are two); ScheduleAnyway
      # so a single-schedulable-node window doesn't block rollout.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cadence-site
      securityContext:
        # nginx-unprivileged runs as uid 101 by default; match it here so the
        # container's /tmp + cache emptyDirs are owned correctly.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cadence-site
          image: ghcr.io/gjcourt/cadence-site:2026-10-01-842a5e2@sha256:062c02bcd8fea2115efeee900e220006230a4a89c50ece02b31306585bc75877
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # Probe pattern per docs/operations/2026-05-02-adding-an-app.md:
          # readiness HTTP-tight, liveness tcpSocket-loose so the two can't
          # co-restart the pod off a single flap.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          # nginx-unprivileged writes its pid + temp paths under /tmp and
          # caches under /var/cache/nginx; mount emptyDirs so
          # readOnlyRootFilesystem doesn't break startup.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
