# Bench fleet dashboard (HOMELAB-94 / BENCH-DASH-3;
# docs/plans/2026-11-07-bench-fleet-dashboard-plan.md, Phase 1c).
# Queries use the bench:* recording rules in infra/configs/alerts/bench-fleet-rules.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-fleet-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bench-fleet.json: |
    {
      "title": "Bench fleet",
      "uid": "bench-fleet",
      "tags": [
        "homelab",
        "bench-cloud",
        "agents"
      ],
      "schemaVersion": 38,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "timepicker": {},
      "description": "agent-desk / bench-cloud fleet: throughput, utilization vs cap, outcome and duration (HOMELAB-94 Phase 1). Built from kube-state-metrics Job series, so history is bounded by Job TTL and Prometheus retention. Cost and tokens come in Phase 2.",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "refresh": 1,
            "options": []
          },
          {
            "name": "playbook",
            "label": "Playbook",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(bench:job:info, playbook)",
            "query": {
              "query": "label_values(bench:job:info, playbook)",
              "refId": "playbook"
            },
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          },
          {
            "name": "project",
            "label": "Project",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "definition": "label_values(bench:job:info, project)",
            "query": {
              "query": "label_values(bench:job:info, project)",
              "refId": "project"
            },
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Fleet overview",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Running now",
          "description": "Bench Jobs active right now (all projects; the playbook filter applies).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(bench:jobs_active:sum_by_playbook{playbook=~\"$playbook\"}) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Started, last 24h",
          "description": "Jobs created in the last 24 h that Kubernetes still knows about.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 4,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count((bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - 86400)) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Succeeded, last 24h",
          "description": "Jobs created in the last 24 h that completed.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 9,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_outcome:info{outcome=\"succeeded\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - 86400)) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Success rate, last 24h",
          "description": "Succeeded / finished, among Jobs created in the last 24 h. n/a when nothing has finished \u2014 never shown as 0.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 14,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_outcome:info{outcome=\"succeeded\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - 86400)) / count(bench:job_outcome:info{outcome!=\"running\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - 86400))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "noValue": "n/a"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Failed, last 24h",
          "description": "Jobs created in the last 24 h that failed. BackoffLimitExceeded is usually the shared subscription's session limit (see the Outcome row).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 19,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_outcome:info{outcome!~\"succeeded|running\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - 86400)) or vector(0)",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Jobs started / completed / failed (rolling 1 h)",
          "description": "Each point counts Jobs in the hour before it. Failed Jobs have no completion time, so they are counted by when they started.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 24,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - 3600) or vector(0)",
              "legendFormat": "started",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_completion_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - 3600) or vector(0)",
              "legendFormat": "completed",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_outcome:info{outcome!~\"succeeded|running\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time > time() - 3600)) or vector(0)",
              "legendFormat": "failed (by start time)",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "lineWidth": 2,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Utilization vs cap",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Concurrent running Jobs by playbook",
          "description": "Stacked running Jobs per playbook, with each playbook's maxConcurrent as a dashed line. Caps are copied from apps/production/agent-desk/config.yaml (2026-11-07); update both together.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 16,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "bench:jobs_active:sum_by_playbook{playbook=~\"$playbook\"}",
              "legendFormat": "{{playbook}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "vector(8)",
              "legendFormat": "feature cap (8)",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "vector(6)",
              "legendFormat": "docs-fix cap (6)",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "vector(2)",
              "legendFormat": "design cap (2)",
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "vector(1)",
              "legendFormat": "review cap (1)",
              "refId": "E"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "fillOpacity": 30,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 2,
                "spanNulls": false
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": ".* cap .*"
                },
                "properties": [
                  {
                    "id": "custom.stacking",
                    "value": {
                      "mode": "none"
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        6
                      ]
                    }
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "% of slots used, now",
          "description": "Running Jobs / maxConcurrent per playbook. A playbook with no running Jobs shows 0 %, which is a real zero.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 13,
            "w": 8,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(bench:jobs_active:sum_by_playbook{playbook=\"feature\"}) or vector(0)) / 8",
              "legendFormat": "feature",
              "refId": "A",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(bench:jobs_active:sum_by_playbook{playbook=\"docs-fix\"}) or vector(0)) / 6",
              "legendFormat": "docs-fix",
              "refId": "B",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(bench:jobs_active:sum_by_playbook{playbook=\"design\"}) or vector(0)) / 2",
              "legendFormat": "design",
              "refId": "C",
              "instant": true,
              "range": false
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(bench:jobs_active:sum_by_playbook{playbook=\"review\"}) or vector(0)) / 1",
              "legendFormat": "review",
              "refId": "D",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.75
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Outcome",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "table",
          "title": "Outcomes by playbook",
          "description": "Every Job Kubernetes still knows about, by playbook and outcome. BackoffLimitExceeded runs that all end in the same minute are the shared-subscription session limit, not a code fault.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 23,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count by (playbook, outcome) (bench:job_outcome:info{playbook=~\"$playbook\", project=~\"$project\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Outcomes by project",
          "description": "Every Job Kubernetes still knows about, by project and outcome.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 23,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count by (project, outcome) (bench:job_outcome:info{playbook=~\"$playbook\", project=~\"$project\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "row",
          "title": "Duration",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Job runtime p50 / p95 by playbook (finished Jobs)",
          "description": "Runtime of completed Jobs (completion \u2212 start). Failed Jobs have no completion time and are excluded. Playbook deadlines for reference: 90 m / 2 h / 3 h (see agent-desk config).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 24,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "quantile by (playbook) (0.5, bench:job_duration_seconds{playbook=~\"$playbook\", project=~\"$project\"})",
              "legendFormat": "p50 {{playbook}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "quantile by (playbook) (0.95, bench:job_duration_seconds{playbook=~\"$playbook\", project=~\"$project\"})",
              "legendFormat": "p95 {{playbook}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 0,
                "stacking": {
                  "mode": "none"
                },
                "lineWidth": 2,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 16,
          "type": "row",
          "title": "Throughput by project",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Completed Jobs per project (rolling 24 h)",
          "description": "Each point counts Jobs that completed in the 24 h before it. No line for a project means it completed nothing in that window.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 41,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count by (project) (bench:job_completion_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - 86400)",
              "legendFormat": "{{project}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "fillOpacity": 30,
                "stacking": {
                  "mode": "normal"
                },
                "lineWidth": 2,
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 18,
          "type": "table",
          "title": "Jobs per project",
          "description": "All Jobs Kubernetes still knows about, per project.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 41,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count by (project) (bench:job:info{playbook=~\"$playbook\", project=~\"$project\"})",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
