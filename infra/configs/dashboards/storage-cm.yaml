apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  storage.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Will anything run out of space, and is the storage backend actually being monitored? Merges Storage & CSI and TrueNAS iSCSI Monitor.",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Modem",
          "tooltip": "",
          "type": "link",
          "url": "/d/modemscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Cluster net",
          "tooltip": "",
          "type": "link",
          "url": "/d/netscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Thermals",
          "tooltip": "",
          "type": "link",
          "url": "/d/34ae4f48-4436-408b-9721-bb5fd18c1a78"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Bench fleet",
          "tooltip": "",
          "type": "link",
          "url": "/d/bench-fleet"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Jobs",
          "tooltip": "",
          "type": "link",
          "url": "/d/homelabscope"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Distinct PVC names above 80% (same-named stage/prod twins counted once; the old tile said 14 because NFS volumes that mirror one dataset were counted per namespace). Amber = look; the fullest are listed below.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(max by (persistentvolumeclaim) (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) > 0.8) or (count(kubelet_volume_stats_used_bytes)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Volumes over 80% full",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Highest PVC usage. Amber 80%, red 90%.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": -1000000000
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 5,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(1, 100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes)",
              "instant": true,
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Fullest volume",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Linear extrapolation of the last 6 h of free space reaches zero within 7 days. A projection, not a measurement; noisy for caches that fill and purge. Names are in the table below.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 10,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(predict_linear(kubelet_volume_stats_available_bytes[6h], 7*86400) < 0) or (count(kubelet_volume_stats_available_bytes)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Predicted full within 7 d",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Talos node system disk (/var). Pseudo-mounts such as /etc/extensions.yaml are excluded.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": -1000000000
                  },
                  {
                    "color": "orange",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 15,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(1, 100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/var\", fstype!~\"tmpfs|overlay|squashfs\"} / node_filesystem_size_bytes{mountpoint=\"/var\", fstype!~\"tmpfs|overlay|squashfs\"}))",
              "instant": true,
              "legendFormat": "{{instance}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Fullest node disk (/var)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Whether truenas-iscsi-exporter has read TrueNAS in the last 5 minutes. NOT SCRAPING means every iSCSI figure on the old TrueNAS dashboard (0 targets, 0 extents, no sizes) was meaningless.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                },
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "NOT SCRAPING"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "Scraping OK"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(time() - truenas_iscsi_last_scrape_success_timestamp_seconds < bool 300) * (truenas_iscsi_last_scrape_success_timestamp_seconds > bool 0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "iSCSI exporter",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Shows No data (not 0) while the exporter is not scraping.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 5,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "truenas_iscsi_target_count and on() ((time() - truenas_iscsi_last_scrape_success_timestamp_seconds < bool 300) * (truenas_iscsi_last_scrape_success_timestamp_seconds > bool 0) == 1)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "iSCSI targets",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Shows No data (not 0) while the exporter is not scraping.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 5,
            "x": 5,
            "y": 5
          },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "truenas_iscsi_extent_count and on() ((time() - truenas_iscsi_last_scrape_success_timestamp_seconds < bool 300) * (truenas_iscsi_last_scrape_success_timestamp_seconds > bool 0) == 1)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "iSCSI extents (LUNs)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Failed scrape attempts of TrueNAS in the last hour.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 5,
            "x": 10,
            "y": 5
          },
          "id": 8,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(truenas_iscsi_scrape_errors_total[1h])",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "iSCSI scrape errors, 1 h",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Informational.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 5,
            "x": 15,
            "y": 5
          },
          "id": 9,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(kube_persistentvolumeclaim_status_phase{phase=\"Bound\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Bound PVCs",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "PVCs stuck Pending or Lost.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 4,
            "x": 20,
            "y": 5
          },
          "id": 10,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(kube_persistentvolumeclaim_status_phase{phase=~\"Pending|Lost\"} == 1) or (count(kube_persistentvolumeclaim_status_phase)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Unbound PVCs",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Fullest PVCs. A negative 'Free in 7 d (projected)' (red) means the volume is on course to fill within a week. NFS volumes on hestia report the whole dataset's usage, so several rows share one figure.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Used %"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percent"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#6c7480",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": -1000000000
                        },
                        {
                          "color": "orange",
                          "value": 80
                        },
                        {
                          "color": "red",
                          "value": 90
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Used"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Size"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Free in 7 d (projected)"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "bytes"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
