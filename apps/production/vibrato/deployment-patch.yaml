apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:3a7213b2f8c5960eed8023844a9ed64c4dee2601
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
