apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: flashcards-db-production-cnpg-v1-backup
  namespace: flashcards-prod
spec:
  cluster:
    name: flashcards-db-production-cnpg-v1
  # Daily at 02:00 UTC, offset a few minutes so concurrent CNPG backups
  # do not collide if two clusters land on the same node.
  schedule: "0 5 2 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
