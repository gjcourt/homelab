apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: snapcast-prod
resources:
  - ../../base/snapcast/
  - httproute.yaml
  - networkpolicy-music-assistant.yaml
  - storage-music-assistant.yaml

labels:
  - pairs:
      env: production
      app.kubernetes.io/instance: production
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: snapcast
    patch: |
      - op: replace
        path: /metadata/name
        value: snapcast-prod
      - op: add
        path: /metadata/labels/http-ingress
        value: "true"
  - path: music-assistant-patch.yaml
  - path: service-patch.yaml
    target:
      kind: Service
      name: snapcast
