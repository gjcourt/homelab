apiVersion: v1
kind: Namespace
metadata:
  name: excalidraw
  labels:
    http-ingress: "true"
    # Opt this namespace into the cluster-wide default-deny in
    # infra/configs/network-policies/. The default-deny CCNP only matches
    # pods whose namespace carries this label (and, during its staged
    # rollout, `env: staging`); the per-app CiliumNetworkPolicy
    # (networkpolicy.yaml) ships the allow rules.
    network-policies: enforced
