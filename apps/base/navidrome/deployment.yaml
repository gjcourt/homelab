apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: navidrome
  labels:
    app: navidrome
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: navidrome
  # Single-replica Deployment with PVC-backed state/media mounts.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      serviceAccountName: navidrome
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # UID 1028 is the owner of /volume1/family/audio/music on the Synology NAS
        # (mode 700). The NFS export passes UIDs verbatim (no all_squash), so the
        # pod must run as the directory owner to gain read access to the music library.
        # runAsGroup and fsGroup remain 1000 so the app retains write access to
        # /data (the iSCSI-backed data volume, owned by 0:1000 with mode rwxrwsr-x).
        runAsUser: 1028
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          # navidrome 0.61.2
          image: ghcr.io/navidrome/navidrome:0.61.2@sha256:9fa40b3d8dec43ceb2213d1fa551da3dcfef6ac6d19c2e534efb92527c2bafd2
          ports:
            - containerPort: 4533
              name: http
          env:
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_LOGLEVEL
              value: info
            - name: ND_SCANSCHEDULE
              value: 1h
            # Delete media_file rows whose files are gone, instead of keeping them
            # forever (upstream default is "never").
            #
            # Why this is needed: after the 2026-07-22 bulk folder rename and the
            # 2026-08-30 mojibake repair, 408 rows pointed at paths that no longer
            # exist. Navidrome MARKS them missing but never removes them, and album
            # aggregation COUNTS missing tracks — so "Sublime" showed as two albums
            # of 17 and 18 tracks when only 17 files exist, and "40 Oz. To Freedom"
            # showed alongside the real "40 Oz to Freedom".
            #
            # ⚠️ "full" only purges after a FULL scan. The hourly schedule runs a
            # QUICK scan, where this setting is a silent no-op. Trigger a full scan
            # explicitly after changing it.
            #
            # ⚠️ Do NOT verify from the scan log. Navidrome reports
            # "tracksMissing=0, errors: 0" while stale rows persist (upstream #5514,
            # open against 0.61.2 — this library was living proof: a 17-track phantom
            # album survived five weeks of "clean" scans). Verify with SQL:
            #   SELECT missing, count(*) FROM media_file GROUP BY missing;
            #
            # Trade-off: with purging on, a file that MOVES is deleted and re-added
            # rather than re-linked, losing its play counts and ratings. That matters
            # here because this library gets bulk-renamed. Revert to the default once
            # the backlog is cleared.
            - name: ND_SCANNER_PURGEMISSING
              value: "full"
            - name: ND_SESSIONTIMEOUT
              value: 24h
            - name: ND_EXTAUTH_TRUSTEDSOURCES
              value: "10.0.0.0/8,192.168.0.0/16,172.16.0.0/12"
            - name: ND_EXTAUTH_USERHEADER
              value: "Remote-User"
          # Last.fm credentials are injected from the navidrome-lastfm Secret
          # (defined per-environment overlay). They enable album cover art and
          # artist biography/image fetching, and allow per-user scrobbling.
          # Deezer is also enabled by default (no key required).
          envFrom:
            - secretRef:
                name: navidrome-lastfm
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: navidrome-data
              mountPath: /data
            - name: navidrome-music
              mountPath: /music
      volumes:
        - name: navidrome-data
          persistentVolumeClaim:
            claimName: navidrome-data-pvc
        - name: navidrome-music
          persistentVolumeClaim:
            claimName: navidrome-music-pvc
