apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
  labels:
    app: openwebui
spec:
  # Re-enabled 2026-09-16: backend repointed from the (removed) llama.cpp on
  # hestia to the Anthropic API via its OpenAI-compat layer.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: openwebui
  # RWO PVC requires Recreate — only one pod can mount at a time
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      serviceAccountName: openwebui
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openwebui
          # NOTE: this MUST be the multi-arch index digest, not a platform-specific
          # one. The cluster is amd64; resolving a digest via `podman inspect` on an
          # arm64 Mac yields the arm64 manifest and the pod dies with
          # `exec /usr/bin/bash: exec format error`. Get it with:
          #   podman manifest inspect ghcr.io/open-webui/open-webui:<tag>
          # or the registry's docker-content-digest header.
          image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: openwebui-env
            # Operator-managed, NOT in git (see secret-anthropic.yaml.example).
            # optional: production has the funded key; staging deliberately does not,
            # so the preview environment starts without reaching a paid API.
            - secretRef:
                name: openwebui-anthropic
                optional: true
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          # startupProbe gates liveness/readiness while Open WebUI initializes.
          # Allows up to 5 minutes for first-run model loading.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openwebui-data-pvc
