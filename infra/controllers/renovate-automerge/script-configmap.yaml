apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-automerge-script
  namespace: renovate
data:
  automerge.py: |
    #!/usr/bin/env python3
    """
    Renovate automerge: merges digest/pin/patch/minor Renovate PRs with passing
    CI. Major updates and PRs with mixed update types stay open for review.
    Covers all repos listed in GITHUB_REPOS (comma-separated).
    Non-safe PRs are reported by email to EMAIL_TO.
    """
    import json
    import os
    import re
    import smtplib
    import sys
    import urllib.request
    import urllib.error
    from datetime import datetime, timezone
    from email.mime.multipart import MIMEMultipart
    from email.mime.text import MIMEText

    GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
    EMAIL_TO     = os.environ.get("EMAIL_TO", "gjcourt@gmail.com")
    SMTP_HOST    = os.environ.get("SMTP_HOST", "smtp.gmail.com")
    SMTP_PORT    = int(os.environ.get("SMTP_PORT", "587"))
    SMTP_USER    = os.environ["SMTP_USER"]
    SMTP_PASS    = os.environ["SMTP_PASS"]

    _repos_env = os.environ.get("GITHUB_REPOS") or os.environ.get("GITHUB_REPO", "gjcourt/homelab")
    REPOS = [r.strip() for r in _repos_env.split(",") if r.strip()]


    def gh(path, method="GET", body=None):
        url = "https://api.github.com" + path
        data = json.dumps(body).encode() if body else None
        req = urllib.request.Request(url, data=data, method=method)
        req.add_header("Authorization", f"token {GITHUB_TOKEN}")
        req.add_header("Accept", "application/vnd.github.v3+json")
        req.add_header("Content-Type", "application/json")
        with urllib.request.urlopen(req) as resp:
            return json.loads(resp.read())


    RENOVATE_BRANCH_PREFIX = "renovate/"

    # Update types Renovate may report, and the subset we auto-merge.
    UPDATE_TYPES = ("major", "minor", "patch", "digest", "pin", "pinDigest", "rollback")
    SAFE_TYPES = {"patch", "digest", "pin", "pindigest", "minor"}

    # Renovate renders the arrow as a literal, an entity, or '->' depending
    # on the platform and on whether the cell is inside a link.
    _ARROW = r"(?:->|-&gt;|\u2192|&#8594;|&rarr;)"
    # Every "`old` -> `new`" cell in the Change column, whatever it holds:
    # versions, suffixed tags, digests, junk. cell_kind() then decides per
    # cell, and anything it cannot decide fails the whole PR closed.
    CHANGE_CELL_RE = re.compile(
        r"`([^`\n]{1,60})`\s*" + _ARROW + r"\s*`([^`\n]{1,60})`"
    )
    VERSION_ONLY_RE = re.compile(r"^v?(\d+(?:\.\d+)*)$")
    DIGEST_RE = re.compile(r"^(?:sha256:)?[0-9a-f]{7,}$", re.IGNORECASE)
    # Renovate's digest titles always end "... digest to <short sha>".
    DIGEST_TITLE_RE = re.compile(r"\bdigest to [0-9a-f]{7,}\s*$")


    def updates_table(body):
        """Return just Renovate's summary table.

        Everything below the release-notes separator is upstream changelog
        prose, which can contain its own tables and version strings. Parsing
        the whole body risks classifying a PR off someone else's changelog."""
        for marker in ("### Release Notes", "### Configuration", "\n---\n"):
            idx = body.find(marker)
            if idx != -1:
                body = body[:idx]
        return body


    def bump_kind(a_str, b_str):
        """Classify a version pair as major / minor / patch."""
        a = [int(x) for x in a_str.split(".")]
        b = [int(x) for x in b_str.split(".")]
        while len(a) < 3:
            a.append(0)
        while len(b) < 3:
            b.append(0)
        if a[0] != b[0]:
            return "major"
        if a[1] != b[1]:
            return "minor"
        return "patch"


    def cell_kind(a_raw, b_raw):
        """Classify one "`a` -> `b`" Change cell.

        Returns major / minor / patch / digest, or None when the cell
        cannot be compared. None is deliberately not "safe": an unparsed
        cell must never be silently dropped from a multi-row table, or a
        major bump hiding behind a suffix ("1.26-alpine" -> "2.0-alpine")
        would automerge on the strength of its well-formed neighbours."""
        a, b = a_raw.strip(), b_raw.strip()
        # Shared non-numeric suffix ("1.26-alpine" -> "1.27-alpine",
        # "1.2.3-rc1" -> "2.0.0-rc1"): compare the numeric heads. A
        # differing suffix stays uncomparable and falls through to None.
        for sep in ("-", "+"):
            if sep in a and sep in b:
                a_head, _, a_tail = a.partition(sep)
                b_head, _, b_tail = b.partition(sep)
                if a_tail == b_tail:
                    a, b = a_head, b_head
                    break
        ma, mb = VERSION_ONLY_RE.match(a), VERSION_ONLY_RE.match(b)
        if ma and mb:
            return bump_kind(ma.group(1), mb.group(1))
        if DIGEST_RE.match(a) and DIGEST_RE.match(b):
            return "digest"
        return None


    def is_renovate_pr(pr):
        """Renovate PRs are identified by branch prefix.

        Title and author are both unreliable here: self-hosted Renovate
        authenticates with a PAT, so it authors PRs as the token owner
        (gjcourt) rather than renovate[bot], and not every Renovate preset
        emits the 'chore(deps):' title prefix. The branch name is the one
        signal Renovate always controls -- every branch it opens is created
        under branchPrefix, which defaults to 'renovate/'.

        Title and author are kept as fallbacks so a rebranded branchPrefix
        or a genuine renovate[bot] PR still matches."""
        head = (pr.get("head") or {}).get("ref") or ""
        return (
            head.startswith(RENOVATE_BRANCH_PREFIX)
            or pr["title"].startswith("chore(deps):")
            or "renovate" in pr["user"]["login"].lower()
        )


    def classify_pr(pr):
        """Return (safe: bool, reason: str) based on title and PR body."""
        title = pr["title"].lower()

        # Renovate's summary table. Parse only the table, never the
        # release notes below it.
        table = updates_table(pr.get("body") or "")

        # Preferred signal: the explicit Update column. The closing pipe is
        # matched by lookahead rather than consumed, so two type words that
        # share a pipe ("| minor | major |") both register -- consuming it
        # would hide the second and let a major bump read as safe.
        types = re.findall(
            r"\|\s*(" + "|".join(UPDATE_TYPES) + r")\s*(?=\|)",
            table,
            re.IGNORECASE,
        )
        if types:
            kinds = {t.lower() for t in types}
            if kinds <= SAFE_TYPES:
                return True, "update type: " + ", ".join(sorted(kinds))
            return False, "update type: " + ", ".join(sorted(kinds))

        # Not every table has an Update column -- with the merge-confidence
        # columns enabled Renovate renders
        # | Package | Change | Age | Confidence |. The Change column still
        # carries both versions ("`2.55.16` -> `2.55.19`"), so derive the
        # bump from there before falling back to the title, which usually
        # names only the target version.
        cells = CHANGE_CELL_RE.findall(table)
        if cells:
            kinds = {cell_kind(a, b) for a, b in cells}
            detail = ", ".join(f"{a} -> {b}" for a, b in cells[:3])
            if len(cells) > 3:
                detail += f", +{len(cells) - 3} more"
            if None in kinds:
                # At least one row is uncomparable. Classifying off the
                # rows we *could* parse would let a major bump ride along
                # with its patch-bump neighbours, so hold the whole PR.
                return False, f"unparseable change cell ({detail})"
            label = "/".join(sorted(kinds)) + " bump"
            if kinds <= SAFE_TYPES:
                return True, f"{label} ({detail})"
            return False, f"{label} ({detail})"

        # Digest pins are content-addressed -- same logical version -- but
        # trust the title only once the table has said nothing, and only for
        # Renovate's own "... digest to <sha>" phrasing. A bare "digest"
        # substring also matches package names like "node-digest", which
        # would wave a major bump of that package straight through.
        if DIGEST_TITLE_RE.search(title):
            return True, "digest pin"

        # Last resort: two version strings in the title.
        versions = re.findall(r"\d+\.\d+(?:\.\d+)*", pr["title"])
        if len(versions) >= 2:
            kind = bump_kind(versions[0], versions[-1])
            detail = f"{kind} bump ({versions[0]} -> {versions[-1]})"
            return kind in SAFE_TYPES, detail

        return False, "cannot determine update type"


    def ci_passing(repo, pr):
        """True only when every completed check has succeeded."""
        sha = pr["head"]["sha"]
        try:
            result = gh(f"/repos/{repo}/commits/{sha}/check-runs")
            runs = result.get("check_runs", [])
            if not runs:
                combined = gh(f"/repos/{repo}/commits/{sha}/status")
                state = combined.get("state", "")
                return state in ("success", "pending")
            completed = [r for r in runs if r["status"] == "completed"]
            return all(r["conclusion"] == "success" for r in completed)
        except Exception as exc:
            print(f"    CI check error: {exc}", flush=True)
            return False


    def update_branch(repo, pr):
        """Tell GitHub to merge master into the PR branch, clearing BEHIND
        state. CI re-runs on the new head; next cron tick picks the PR up."""
        number = pr["number"]
        try:
            gh(f"/repos/{repo}/pulls/{number}/update-branch", method="PUT", body={})
            return True
        except urllib.error.HTTPError as exc:
            print(f"    update-branch failed: {exc.code} {exc.reason}", flush=True)
            return False


    def merge_pr(repo, pr):
        """Returns (merged, rebased).

        405 Method Not Allowed has two common causes that share the same
        status code:
          1. The repo's branch protection forbids the merge method we chose
             (e.g. required_linear_history rejects 'merge' commits).
          2. The PR is BEHIND and protection requires up-to-date branches.

        So we try the merge methods in safest-first order — squash, rebase,
        merge — and only after all three give 405 do we treat it as case 2
        and trigger update-branch. CI re-runs on the new head; next cron
        tick retries the merge.

        Non-405 errors (409 conflict, 422 mergeability, etc.) won't be
        helped by a different method, so we bail immediately."""
        number = pr["number"]
        last_405 = False
        for method in ("squash", "rebase", "merge"):
            body = {"merge_method": method}
            if method in ("squash", "merge"):
                body["commit_title"] = pr["title"]
            try:
                gh(f"/repos/{repo}/pulls/{number}/merge", method="PUT", body=body)
                print(f"    -> merged via {method}", flush=True)
                return True, False
            except urllib.error.HTTPError as exc:
                print(f"    merge_method={method} failed: {exc.code} {exc.reason}", flush=True)
                last_405 = exc.code == 405
                if not last_405:
                    return False, False

        # All three methods returned 405 — likely BEHIND master + branch
        # protection requires up-to-date branches. Rebase and let the next
        # cron run retry.
        if last_405 and update_branch(repo, pr):
            print(f"    -> rebased onto master; will retry next run", flush=True)
            return False, True
        return False, False


    def process_repo(repo):
        prs = gh(f"/repos/{repo}/pulls?state=open&per_page=100")
        renovate = [pr for pr in prs if is_renovate_pr(pr)]
        print(f"  Open PRs: {len(prs)} total, {len(renovate)} from Renovate", flush=True)

        merged, held = [], []
        for pr in renovate:
            print(f"\n  PR #{pr['number']}: {pr['title']}", flush=True)
            safe, reason = classify_pr(pr)
            if not safe:
                print(f"    -> hold: {reason}", flush=True)
                held.append({"pr": pr, "reason": reason})
                continue

            print(f"    -> {reason}, checking CI ...", flush=True)
            if not ci_passing(repo, pr):
                reason += " (CI not passing)"
                print(f"    -> hold: {reason}", flush=True)
                held.append({"pr": pr, "reason": reason})
                continue

            ok, rebased = merge_pr(repo, pr)
            if ok:
                print(f"    -> merged", flush=True)
                merged.append({"pr": pr, "reason": reason})
            elif rebased:
                held.append({"pr": pr, "reason": reason + " (behind master — rebased; will merge next run)"})
            else:
                held.append({"pr": pr, "reason": reason + " (merge failed)"})

        return merged, held


    def send_report(results):
        total_merged = sum(len(r["merged"]) for r in results)
        total_held = sum(len(r["held"]) for r in results)

        lines = [
            f"Renovate automerge -- {datetime.now(timezone.utc).strftime('%Y-%m-%d')}",
            "",
        ]
        for r in results:
            if not r["merged"] and not r["held"]:
                continue
            lines.append(f"── {r['repo']} ──")
            if r["merged"]:
                lines.append(f"  Merged ({len(r['merged'])}):")
                for item in r["merged"]:
                    pr = item["pr"]
                    lines.append(f"    #{pr['number']}: {pr['title']}")
                    lines.append(f"      ({item['reason']})")
            if r["held"]:
                lines.append(f"  Needs review ({len(r['held'])}):")
                for item in r["held"]:
                    pr = item["pr"]
                    lines.append(f"    #{pr['number']}: {pr['title']}")
                    lines.append(f"      https://github.com/{r['repo']}/pull/{pr['number']}")
                    lines.append(f"      ({item['reason']})")
            lines.append("")

        body = "\n".join(lines)
        subject = f"[renovate] {total_merged} merged, {total_held} pending review"
        msg = MIMEMultipart("alternative")
        msg["Subject"] = subject
        msg["From"] = SMTP_USER
        msg["To"] = EMAIL_TO
        msg.attach(MIMEText(body, "plain"))

        with smtplib.SMTP(SMTP_HOST, SMTP_PORT) as server:
            server.ehlo()
            server.starttls()
            server.login(SMTP_USER, SMTP_PASS)
            server.sendmail(SMTP_USER, EMAIL_TO, msg.as_string())
        print("Email sent.", flush=True)


    def main():
        run_at = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
        print(f"renovate-automerge {run_at}  repos={','.join(REPOS)}", flush=True)

        results = []
        for repo in REPOS:
            print(f"\n=== {repo} ===", flush=True)
            merged, held = process_repo(repo)
            results.append({"repo": repo, "merged": merged, "held": held})
            print(f"  -> {len(merged)} merged, {len(held)} held", flush=True)

        total_merged = sum(len(r["merged"]) for r in results)
        total_held = sum(len(r["held"]) for r in results)
        print(f"\nTotal: {total_merged} merged, {total_held} held.", flush=True)

        if total_merged or total_held:
            try:
                send_report(results)
            except Exception as exc:
                # Email is best-effort notification; don't fail the job over it.
                # The merge/hold decisions above already completed successfully.
                print(f"Email failed (non-fatal): {exc}", file=sys.stderr, flush=True)


    if __name__ == "__main__":
        main()
