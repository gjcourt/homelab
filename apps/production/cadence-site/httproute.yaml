# cadence.burntbytes.com — the Cadence marketing page. Served on the
# *.burntbytes.com wildcard listeners (shared burntbytes-prod-wildcard-tls).
# Public via the Cloudflare tunnel entry for this hostname.
#
# When the Cadence Shopify app deploys (homelab#1262), its /pay, /app, /auth
# and /webhooks paths should route to the app on this same host; this route
# then keeps "/" for the page.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cadence-site-http
  namespace: cadence-site-prod
spec:
  hostnames:
    - cadence.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cadence-site-https
  namespace: cadence-site-prod
spec:
  hostnames:
    - cadence.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - name: cadence-site
          port: 8080
