---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: homelab-bgp
spec:
  # Every node peers. Until 2026-11-15 this selected workers only (control-plane
  # nodes were assumed idle), which left one worker (.25) as the only BGP next
  # hop: one node down and the UCGF lost every LB route. The control-plane nodes
  # run workloads and already hold most L2 announcement leases, so BGP follows
  # suit. No nodeSelector = all nodes. The UCGF side needs no change: it listens
  # on 10.42.2.0/24 for AS 65010 with maximum-paths 8.
  bgpInstances:
    - name: homelab
      localASN: 65010
      peers:
        - name: ucgf
          peerASN: 65100
          peerAddress: 10.42.2.1
          peerConfigRef:
            name: ucgf-peer
