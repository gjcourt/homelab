apiVersion: v1
kind: ConfigMap
metadata:
  name: homelabscope-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  homelabscope.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Did every scheduled job run recently enough, and is anything on hestia crash-looping?",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Modem",
          "tooltip": "",
          "type": "link",
          "url": "/d/modemscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Cluster net",
          "tooltip": "",
          "type": "link",
          "url": "/d/netscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Thermals",
          "tooltip": "",
          "type": "link",
          "url": "/d/34ae4f48-4436-408b-9721-bb5fd18c1a78"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Storage",
          "tooltip": "",
          "type": "link",
          "url": "/d/storage"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Bench fleet",
          "tooltip": "",
          "type": "link",
          "url": "/d/bench-fleet"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Scheduled jobs whose last success is older than their max-age budget. Only jobs that HAVE a budget are judged (see 'no budget' tile).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count((time() - homelabscope_job_last_success_seconds) > on(job) homelabscope_job_max_age_seconds) or (count(homelabscope_job_max_age_seconds)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Jobs stale (over their budget)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Jobs reporting a non-zero last status. Assumes 0 = success (all 5 reporting jobs are 0 today). Only jobs that report a status are counted.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(homelabscope_job_last_status != 0) or (count(homelabscope_job_last_status)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Jobs whose last run failed",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Tracked jobs with no max-age budget: they can never go 'stale', so the stale tile is blind to them. Amber = a monitoring gap, not an outage. Today: alcatraz-photos-pull, immich-photos-backup, zfs-snapshot-main-family, zfs-snapshot-main-homes.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(homelabscope_job_last_success_seconds unless on(job) homelabscope_job_max_age_seconds) or (count(homelabscope_job_last_success_seconds)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Jobs with no freshness budget",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "hestia containers failing their healthcheck or restarting 3+ times in 24 h. Exited one-shot containers are not counted. Names in the Containers row below.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count((homelabscope_container_health == 0) or (increase(homelabscope_container_restarts_total[24h]) >= 3)) or (count(homelabscope_container_running)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Containers failing",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "One row per job. 'no budget' = no freshness limit defined (cannot go stale); 'not reported' = the job does not publish that metric.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Age as % of budget"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "noValue",
                    "value": "no budget"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#6c7480",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": -1000000000
                        },
                        {
                          "color": "orange",
                          "value": 0.8
                        },
                        {
                          "color": "red",
                          "value": 1
                        }
                      ]
                    }
                  },
                  {
                    "id": "mappings",
                    "value": []
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last success"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Budget"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "noValue",
                    "value": "none"
                  },
                  {
                    "id": "mappings",
                    "value": []
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last duration"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "noValue",
                    "value": "not reported"
                  },
                  {
                    "id": "mappings",
                    "value": []
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Last run"
                },
                "properties": [
                  {
                    "id": "noValue",
                    "value": "not reported"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "green",
                            "index": 0,
                            "text": "ok"
                          }
                        },
                        "type": "value"
                      },
                      {
                        "options": {
                          "from": 1,
                          "result": {
                            "color": "red",
                            "index": 1,
                            "text": "FAILED"
                          },
                          "to": 1000
                        },
                        "type": "range"
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#6c7480",
                          "value": null
                        },
                        {
                          "color": "#6c7480",
                          "value": -1000000000
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 16,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 5,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Age as % of budget"
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(time() - homelabscope_job_last_success_seconds)",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "homelabscope_job_max_age_seconds",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "((time() - homelabscope_job_last_success_seconds) / on(job) group_left homelabscope_job_max_age_seconds)",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "homelabscope_job_last_status",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "homelabscope_job_last_duration_seconds",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "E"
            }
          ],
          "title": "Scheduled jobs, most overdue first",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "job",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "instance": true,
                  "instance 1": true,
                  "instance 2": true,
                  "instance 3": true,
                  "instance 4": true,
                  "instance 5": true
                },
                "indexByName": {
                  "Value #A": 2,
                  "Value #B": 3,
                  "Value #C": 1,
                  "Value #D": 4,
                  "Value #E": 5,
                  "job": 0
                },
                "renameByName": {
                  "Value #A": "Last success",
                  "Value #B": "Budget",
                  "Value #C": "Age as % of budget",
                  "Value #D": "Last run",
                  "Value #E": "Last duration",
                  "job": "Job"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 21
          },
          "id": 100,
          "panels": [],
          "title": "Containers on hestia (worst first)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Exited = one-shot containers that ran and stopped; normal unless you expect them up.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Restarts, 24 h"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 0
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#6c7480",
                          "value": null
                        },
                        {
                          "color": "text",
                          "value": -1000000000
                        },
                        {
                          "color": "orange",
                          "value": 1
                        },
                        {
                          "color": "red",
                          "value": 3
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Up for"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Running"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "#6c7480",
                            "index": 0,
                            "text": "exited"
                          },
                          "1": {
                            "color": "text",
                            "index": 1,
                            "text": "running"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#6c7480",
                          "value": null
                        },
                        {
                          "color": "#6c7480",
                          "value": -1000000000
                        }
                      ]
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Health"
                },
                "properties": [
                  {
                    "id": "noValue",
                    "value": "no healthcheck"
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "options": {
                          "0": {
                            "color": "red",
                            "index": 0,
                            "text": "UNHEALTHY"
                          },
                          "1": {
                            "color": "green",
                            "index": 1,
                            "text": "healthy"
                          }
                        },
                        "type": "value"
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "#6c7480",
                          "value": null
                        },
                        {
                          "color": "#6c7480",
                          "value": -1000000000
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "id": 11,
          "options": {
            "cellHeight": "sm",
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Restarts, 24 h"
              }
            ]
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "homelabscope_container_running",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "homelabscope_container_health",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(homelabscope_container_restarts_total[24h])",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - homelabscope_container_started_seconds",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "D"
            }
          ],
          "title": "Containers on hestia",
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "name",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "job 1": true,
                  "job 2": true,
                  "job 3": true,
                  "job 4": true
                },
                "indexByName": {
                  "Value #A": 1,
                  "Value #B": 2,
                  "Value #C": 3,
                  "Value #D": 4,
                  "name": 0
                },
                "renameByName": {
                  "Value #A": "Running",
                  "Value #B": "Health",
                  "Value #C": "Restarts, 24 h",
                  "Value #D": "Up for",
                  "name": "Container"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": true,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 30
