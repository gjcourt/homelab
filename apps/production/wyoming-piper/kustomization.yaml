apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wyoming-piper-prod
resources:
  - ../../base/wyoming-piper/

labels:
  - pairs:
      env: production
      app.kubernetes.io/instance: production
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: wyoming-piper
    patch: |
      - op: replace
        path: /metadata/name
        value: wyoming-piper-prod
  # Admit only this environment's Home Assistant.
  - target:
      kind: CiliumNetworkPolicy
      name: wyoming-piper
    patch: |
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: homeassistant-prod
