apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmux
  namespace: llmux
  labels:
    app: llmux
spec:
  # Stateless proxy; one replica is enough for household chat traffic.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: llmux
  template:
    metadata:
      labels:
        app: llmux
    spec:
      serviceAccountName: llmux
      automountServiceAccountToken: false
      # No imagePullSecrets: gjcourt/llmux is a public repo, so the GHCR
      # package is expected to be public. Add a ghcr-secret (see golinks) if
      # the first published package turns out private.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llmux
          # PLACEHOLDER — no image has been published yet. Replace with the
          # first date-sha tag (YYYY-MM-DD-<sha7>) printed by llmux's build
          # workflow before this PR leaves draft.
          image: ghcr.io/gjcourt/llmux:PLACEHOLDER-set-after-first-build
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: llmux-env
            # SOPS-encrypted in the production overlay only
            # (apps/production/llmux/secret-anthropic.yaml). optional: staging
            # has no key yet — whether it gets a low-spend one is an open
            # decision — and must still start. With no key, llmux disables the
            # Anthropic port rather than failing.
            - secretRef:
                name: llmux-anthropic
                optional: true
          # Readiness only. /healthz is the one health signal llmux exposes;
          # a livenessProbe on the same endpoint would carry no distinct
          # signal (docs/operations/2026-05-02-adding-an-app.md#health-probes).
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Writable scratch in case the Go runtime or a dependency needs
            # os.TempDir(); the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
