apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:01a348256d205bf94750479c0183428b2d859b58
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
