              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(unpoller_device_outlet_ac_power_consumption{name=\"USP PDU Pro\"}) * 24 * 30 / 1000 * $cost_per_kwh",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Wall power cost, per month (estimate)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Lines at 75 C (warm) and 85 C (hot). Axis starts at 40 C.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {
                  "mode": "line"
                }
              },
              "min": 40,
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
