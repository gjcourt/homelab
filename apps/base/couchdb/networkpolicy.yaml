---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: couchdb
  namespace: couchdb
  labels:
    app.kubernetes.io/name: couchdb
    app.kubernetes.io/part-of: network-policies
spec:
  description: Gateway ingress on 5984 (LAN-only HTTPS route); egress DNS only.
  endpointSelector:
    matchLabels:
      app: couchdb
  ingress:
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "5984"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
