apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config-pvc
  namespace: homeassistant
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 1Gi filled on 2026-11-04 (98%), and HA then failed every recorder
      # commit and every .storage write (restore_state) with ENOSPC. Cause:
      # staging Vibrato's simulator was publishing into prod MQTT, ~170k state
      # rows a day from two sensors (shot timer + temperature). Fixed in the
      # vibrato staging overlay; 5Gi stays as headroom.
      # truenas-iscsi expands online (democratic-csi v1.9.5), so a size bump
      # here is applied in place; no PVC deletion needed.
      storage: 5Gi
