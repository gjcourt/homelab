# Bench fleet dashboard (HOMELAB-94 / BENCH-DASH-3;
# docs/plans/2026-11-07-bench-fleet-dashboard-plan.md, Phase 1c).
# Queries use the bench:* recording rules in infra/configs/alerts/bench-fleet-rules.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bench-fleet-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  bench-fleet.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Is the agent fleet working, and is it failing? Right now first, then this range.",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Modem",
          "tooltip": "",
          "type": "link",
          "url": "/d/modemscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Cluster net",
          "tooltip": "",
          "type": "link",
          "url": "/d/netscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Thermals",
          "tooltip": "",
          "type": "link",
          "url": "/d/34ae4f48-4436-408b-9721-bb5fd18c1a78"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Storage",
          "tooltip": "",
          "type": "link",
          "url": "/d/storage"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Jobs",
          "tooltip": "",
          "type": "link",
          "url": "/d/homelabscope"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "Right now",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Jobs running right now. 0 is real (the fleet's series exist and none are active); No data means the fleet's metrics are missing.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(bench:jobs_active:sum_by_playbook{playbook=~\"$playbook\"}) or (count(bench:job:info)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Running now",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Time since the most recent Job completed. If the fleet is meant to be busy and this keeps growing, it has stalled.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - max(bench:job_completion_time{playbook=~\"$playbook\", project=~\"$project\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Last job finished",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Time since the most recent failed Job started (failed Jobs have no completion time; within Job-TTL history). No data = no failure in retained history.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "time() - max(bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) bench:job_outcome:info{outcome!~\"succeeded|running\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Last failure (age of its start)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Running Jobs per playbook with its cap. Replaces '% of slots used, now', which read 0% whenever nothing was running at the instant you looked.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "text": {
              "titleSize": 14,
              "valueSize": 40
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(bench:jobs_active:sum_by_playbook{playbook=\"feature\"}) or (count(bench:job:info)*0)",
              "legendFormat": "feature (cap 8) ",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(bench:jobs_active:sum_by_playbook{playbook=\"docs-fix\"}) or (count(bench:job:info)*0)",
              "legendFormat": "docs-fix (cap 6) ",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(bench:jobs_active:sum_by_playbook{playbook=\"design\"}) or (count(bench:job:info)*0)",
              "legendFormat": "design (cap 2) ",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(bench:jobs_active:sum_by_playbook{playbook=\"review\"}) or (count(bench:job:info)*0)",
              "legendFormat": "review (cap 1) ",
              "refId": "D"
            }
          ],
          "title": "Slots in use now",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "panels": [],
          "title": "In this range (dashboard time range)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Jobs created in the selected range.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 6
          },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - ${__range_s}) or (count(bench:job:info)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Started",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 6
          },
          "id": 8,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_outcome:info{outcome=\"succeeded\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - ${__range_s})) or (count(bench:job:info)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Succeeded",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Succeeded / finished in range. Green 95%+, amber 80-95%, red below (PROPOSED). No data when nothing finished.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "green",
                    "value": 0.95
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 6
          },
          "id": 9,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_outcome:info{outcome=\"succeeded\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - ${__range_s})) / count(bench:job_outcome:info{outcome!=\"running\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - ${__range_s}))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Success rate",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Jobs that ended in any non-success outcome in range. Red whenever > 0; the list is below.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 6
          },
          "id": 10,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(bench:job_outcome:info{outcome!~\"succeeded|running\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - ${__range_s})) or (count(bench:job:info)*0)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Failed",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Empty table with 'No data' = no failures in the range.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 6,
            "w": 14,
            "x": 0,
            "y": 10
          },
          "id": 11,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "bench:job_outcome:info{outcome!~\"succeeded|running\", playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - ${__range_s})",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Failed jobs in range",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "pod": true,
                  "service": true
                },
                "renameByName": {
                  "job_name": "Job",
                  "outcome": "Outcome",
                  "playbook": "Playbook",
                  "project": "Project"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Rows: playbook. Columns: each outcome. One table; the old version showed one row per frame and hid failures behind a frame selector.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "inspect": false
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
