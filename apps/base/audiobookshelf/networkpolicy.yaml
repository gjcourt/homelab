---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: network-policies
spec:
  description: Gateway ingress on pod port 13378 (service maps 3005→13378); egress DNS + Gateway VIP:443 + Authelia pods:9091 (OIDC via the Gateway).
  endpointSelector:
    matchLabels:
      app: audiobookshelf
  ingress:
    # Gateway API. Cilium's Envoy proxy source IP is identity 8 ("ingress").
    # Same-node: "host", cross-node VXLAN: "remote-node". All three required.
    # toPorts uses the pod port (13378), not the service port (3005).
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "13378"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # OIDC back-channel: ABS calls the auth host for discovery, token and
    # userinfo. The overlays' hostAliases pin that hostname to a Gateway VIP
    # (prod 10.42.2.40, staging 10.42.2.42). With egress limited to DNS, the
    # browser login completed at Authelia and then failed in ABS with
    # "OPError: expected 200 OK, got: 403 Forbidden".
    # The 403 is Cilium, not Authelia: the Gateway's Envoy enforces this pod's
    # egress policy (cilium/proxy#1172, CVE-2025-30162 fix) and Hubble logs
    # `(ingress) -> cilium-gateway-...:443 http-request DROPPED`.
    # Allowing only the VIP (#1549) was NOT enough: still 403 on 2026-10-06,
    # and homepage (egress `world`:443) gets the same 403. Envoy also checks
    # this egress policy against the BACKEND it routes to, so Authelia's pods
    # on their container port (9091) must be allowed too (cilium#47768,
    # cilium#40538). Keep both rules. Keep the CIDRs in sync with the
    # overlays' deployment-patch.yaml.
    - toCIDRSet:
        - cidr: 10.42.2.40/32
        - cidr: 10.42.2.42/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: authelia
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values: [authelia-prod, authelia-stage]
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
