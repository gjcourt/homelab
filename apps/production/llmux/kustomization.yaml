apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llmux-prod
resources:
  - ../../base/llmux/
  # SOPS-encrypted; operator-created from secret-anthropic.yaml.example.
  # NOT in this commit on purpose — agents do not run sops in this repo, so
  # `kustomize build apps/production` fails until the operator encrypts it.
  # Production ONLY: staging gets no key (the deployment's secretRef is
  # optional).
  - secret-anthropic.yaml

labels:
  - pairs:
      env: production
      app.kubernetes.io/instance: production
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: llmux
    patch: |
      - op: replace
        path: /metadata/name
        value: llmux-prod
  # Pair llmux-prod with openwebui-prod only; never cross environments.
  - target:
      kind: CiliumNetworkPolicy
      name: llmux
    patch: |
      - op: test
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: openwebui
      - op: replace
        path: /spec/ingress/0/fromEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: openwebui-prod
