apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadence
  namespace: cadence
  labels:
    app.kubernetes.io/name: cadence
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # RWO iSCSI data volume on a single replica: terminate the old pod before starting
  # the new one so a rollout can't Multi-Attach it. maxSurge:0 gives the Recreate
  # effect while staying type RollingUpdate (Recreate forbids the API-defaulted
  # rollingUpdate block — dry-run rejects it).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadence
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cadence
          # Public ghcr package; the production overlay pins a sha (deployment-patch).
          # First deploy tracks :latest until the sha pin lands (see kustomization).
          image: ghcr.io/gjcourt/cadence:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: SHOPIFY_APP_URL
              value: "https://cadence.burntbytes.com"
            - name: SCOPES
              value: "write_orders,read_products" # keep in sync with shopify.app.toml
            - name: DATABASE_URL
              value: "file:/data/cadence.sqlite" # persistent (see pvc.yaml)
            # Sensitive values come from the cadence-secrets Secret (SOPS; operator-created
            # — see secret.sops.yaml.example in the production overlay). The pod won't start
            # until that Secret exists — the intended gate.
            - name: SHOPIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cadence-secrets
                  key: SHOPIFY_API_KEY
            - name: SHOPIFY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: cadence-secrets
                  key: SHOPIFY_API_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cadence-secrets
                  key: STRIPE_SECRET_KEY
            - name: CADENCE_ACCEPTANCE_PRIV_PEM
              valueFrom:
                secretKeyRef:
                  name: cadence-secrets
                  key: CADENCE_ACCEPTANCE_PRIV_PEM
            - name: CADENCE_ACCEPTANCE_PUB_HEX
              valueFrom:
                secretKeyRef:
                  name: cadence-secrets
                  key: CADENCE_ACCEPTANCE_PUB_HEX
          # TCP readiness (the app has no dedicated health route). No livenessProbe: it
          # would share the same TCP signal, and the quality gate wants a distinct one.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # SQLite session + decision/order store (DATABASE_URL=file:/data/cadence.sqlite).
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cadence-data
