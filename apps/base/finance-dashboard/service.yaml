apiVersion: v1
kind: Service
metadata:
  name: finance-dashboard
  namespace: finance-dashboard
  labels:
    app: finance-dashboard
spec:
  # ClusterIP. The HTTPRoute is not deployed while HOMELAB-90 is open, so the
  # only way in is a port-forward:
  #   kubectl -n finance-dashboard port-forward svc/finance-dashboard 8080:8080
  type: ClusterIP
  selector:
    app: finance-dashboard
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
