# Production routing for Mealie.
# Primary hostname is food.burntbytes.com; the legacy mealie.burntbytes.com
# 301-redirects to it (hostname migration 2026-07-28).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: mealie-http
  namespace: mealie-prod
spec:
  hostnames:
    - food.burntbytes.com
    - mealie.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: mealie-https
  namespace: mealie-prod
spec:
  hostnames:
    - food.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - name: mealie
          port: 9000
---
# Legacy hostname -> new hostname: permanent redirect, preserves path.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: mealie-redirect
  namespace: mealie-prod
spec:
  hostnames:
    - mealie.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: https
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: food.burntbytes.com
            statusCode: 301
