apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# agent-desk: the dispatcher that turns ready Plane tickets into bench-cloud
# Jobs (lab 03-042). Plan: docs/plans/2026-10-22-agent-desk-loop.md.
# Its right to create Jobs is a RoleBinding in bench-cloud, kept in
# apps/base/bench-cloud/rbac.yaml so an overlay's namespace can't move it.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
