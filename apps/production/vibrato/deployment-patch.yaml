apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:860974309807f48df3816adce399e1c5ff3f7559
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
