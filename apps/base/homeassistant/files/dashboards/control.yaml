- title: Lights
  theme: Tinted
  path: lights
  icon: mdi:lightbulb-group
  type: sections
  max_columns: 3
  sections:
  # One section per room. Every light is a mushroom-light-card with a
  # brightness slider (tap = toggle, hold = full more-info dialog). The
  # room heading's badge is a group toggle for all lights in that room.
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Kitchen
      heading_style: title
      icon: mdi:silverware-fork-knife
    - type: custom:mushroom-template-card
      primary: All Kitchen Lights
      secondary: "{{ ['light.kitchen_main_lights', 'light.kitchen_under_cabinet', 'light.kitchen_island_pendants'] | select('is_state', 'on') | list | count }} on"
      icon: mdi:lightbulb-group
      icon_color: "{{ 'amber' if ['light.kitchen_main_lights', 'light.kitchen_under_cabinet', 'light.kitchen_island_pendants'] | select('is_state', 'on') | list | count > 0 else 'disabled' }}"
      tap_action:
        action: perform-action
        perform_action: script.smart_light_toggle
        data:
          entities:
          - light.kitchen_main_lights
          - light.kitchen_under_cabinet
          - light.kitchen_island_pendants
    - type: custom:mushroom-light-card
      entity: light.kitchen_main_lights
      name: Main
      show_brightness_control: true
      use_light_color: true
      collapsible_controls: false
      card_mod:
        style: |
          ha-card {
            max-width: 520px;
            margin: 0 auto;
            border-radius: 22px;
            border: none;
            box-shadow: 0 1px 2px rgba(30, 50, 90, 0.06);
            background: {% if is_state(config.entity, 'on') %}linear-gradient(150deg, rgba(255, 184, 56, 0.22), rgba(255, 150, 40, 0.12)), var(--card-background-color){% else %}var(--card-background-color){% endif %};
            transition: background 0.3s ease;
          }
    - type: custom:mushroom-light-card
      entity: light.kitchen_under_cabinet
      name: Under Cabinet
      show_brightness_control: true
      use_light_color: true
      collapsible_controls: false
      card_mod:
        style: |
          ha-card {
            max-width: 520px;
            margin: 0 auto;
            border-radius: 22px;
            border: none;
            box-shadow: 0 1px 2px rgba(30, 50, 90, 0.06);
            background: {% if is_state(config.entity, 'on') %}linear-gradient(150deg, rgba(255, 184, 56, 0.22), rgba(255, 150, 40, 0.12)), var(--card-background-color){% else %}var(--card-background-color){% endif %};
            transition: background 0.3s ease;
          }
    - type: custom:mushroom-light-card
      entity: light.kitchen_island_pendants
      name: Island Pendants
      show_brightness_control: true
      use_light_color: true
      collapsible_controls: false
      card_mod:
        style: |
          ha-card {
            max-width: 520px;
            margin: 0 auto;
            border-radius: 22px;
            border: none;
