- title: Light schedules
  theme: Tinted
  path: light-schedules
  icon: mdi:lightbulb-auto
  type: sections
  max_columns: 3
  # HASS-7. George, 2026-10-31: "the nightlight is separate, and ultimately
  # we'll have our christmas tree light there too". One section per
  # scheduled light: to add one (e.g. the Christmas tree), add a section
  # here with its cards and a matching section on "Light schedules
  # settings", in the same pattern as Nightlight.
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Nightlight
      heading_style: title
    - type: custom:mushroom-template-card
      entity: switch.dining_room_chandelier
      primary: Master Switch
      secondary: &switch_status >-
        {%- if expand(entity) | count == 0 -%}Not found
        {%- elif states(entity) in ['unavailable', 'unknown'] -%}{{ states(entity) | capitalize }}
        {%- else -%}{{ 'On' if is_state(entity, 'on') else 'Off' }}
        {%- endif -%}
      icon: mdi:light-switch
      icon_color: *onoff_color
      tap_action:
        action: toggle
      icon_tap_action:
        action: more-info
      hold_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: light.0xa4c138b55dac7973
      primary: Central
      secondary: &light_status >-
        {%- if expand(entity) | count == 0 -%}Not found
        {%- elif states(entity) in ['unavailable', 'unknown'] -%}{{ states(entity) | capitalize }}
        {%- elif is_state(entity, 'on') -%}On
        {%- set b = state_attr(entity, 'brightness') -%}
        {%- if b is number %} · {{ (b / 2.55) | round(0) | int }}%{% endif -%}
        {%- else -%}Off
        {%- endif -%}
      icon: mdi:chandelier
      icon_color: *onoff_color
      tap_action:
        action: toggle
      icon_tap_action:
        action: more-info
      hold_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: light.0xa4c138a9f6011cac
      primary: Flowers
      secondary: *light_status
      icon: mdi:flower
      icon_color: *onoff_color
      tap_action:
        action: toggle
      icon_tap_action:
        action: more-info
      hold_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: sensor.nightlight_turn_off_time
      primary: Off tonight
      secondary: >-
        {{ 'Not found' if expand(entity) | count == 0 else ('At ' ~ states(entity) if states(entity) not in ['unavailable', 'unknown'] else states(entity) | capitalize) }}
      icon: mdi:weather-night
      icon_color: blue
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: input_number.nightlight_offset_today
      primary: Jitter (today)
      secondary: &number_status >-
        {%- set v = states(entity) | float(none) -%}
        {%- set u = state_attr(entity, 'unit_of_measurement') or '' -%}
        {%- if expand(entity) | count == 0 -%}Not found
        {%- elif v is none -%}{{ states(entity) | capitalize }}
        {%- else -%}{{ v | int }}{{ u if u == '%' else ' ' ~ u }}
        {%- endif -%}
      icon: mdi:dice-multiple
      icon_color: blue
      tap_action:
        action: more-info
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Settings
      heading_style: title
    - type: custom:mushroom-template-card
      primary: Light schedules settings
      secondary: Nightlight brightness, turn-off time, jitter
      icon: mdi:cog-outline
      icon_color: blue
      grid_options:
        columns: full
      tap_action:
