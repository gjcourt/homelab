name: Build immich-photos-pull

on:
  push:
    branches: [master]
    paths:
      - 'images/immich-photos-pull/**'
      - '.github/workflows/build-immich-photos-pull.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gjcourt/immich-photos-pull

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Immutable per-commit tag (date + short SHA) — avoids the same-day tag
      # collision that a bare YYYY-MM-DD hits when code is rebuilt twice in a day.
      - name: Generate date-sha tag
        id: tag
        run: echo "tag=$(date -u +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # NOTE: platforms is linux/amd64 (matches images/immich-photos-backup). If
      # alcatraz turns out to be aarch64 (plan prerequisite P3), add linux/arm64
      # here so the pulled image has a matching arch — otherwise the alcatraz
      # runner's `docker compose pull` fails clearly on arch mismatch.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/immich-photos-pull
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### immich-photos-pull published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pin the digest in \`hosts/alcatraz/immich-photos-pull/docker-compose.yml\` and flip \`x-deploy.archived\` to false in a follow-up PR." >> $GITHUB_STEP_SUMMARY
