apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openwebui
  namespace: openwebui
  labels:
    app: openwebui
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/part-of: network-policies
spec:
  description: "Gateway ingress + kubelet probes; egress to DNS, llmux, and HTTPS."
  endpointSelector:
    matchLabels:
      app: openwebui
  ingress:
    # Cilium Envoy (Gateway API) binds upstream sockets to a dedicated proxy IP
    # (e.g. 10.244.x.15) that Cilium marks as reserved identity 8 ("ingress").
    # Same-node connections arrive as "host"; cross-node VXLAN connections arrive
    # as "remote-node". All three are required. Kubelet probes are auto-exempted.
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Chat backend: llmux in the paired namespace (llmux-prod / llmux-stage).
    # The base names the plain `llmux` namespace; each overlay patches it so
    # prod and stage never cross. Overlays patch /spec/egress/0 — keep this
    # rule first.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llmux
            app: llmux
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # DNS resolution via CoreDNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Outbound HTTPS: Hugging Face sentence-transformer downloads on first
    # boot (chat goes through llmux since 2026-09). `toEntities: world` is the
    # convention every other app here uses (authelia, adguard, immich,
    # homeassistant, jellyfin, mealie). The previous `toCIDR: 0.0.0.0/0` was
    # the sole outlier and was never exercised — the only backend at the time
    # was llama.cpp on the LAN.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
