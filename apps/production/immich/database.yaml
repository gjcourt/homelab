apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db-prod-cnpg-v3
  namespace: immich-prod
spec:
  description: Postgres cluster for Immich — pgvecto.rs → VectorChord migration window
  # VectorChord-only image. The one-way pgvecto.rs → VectorChord migration that
  # Immich v3 requires was completed 2026-07-03 — procedure and ordering are kept in
  # docs/operations/2026-07-02-immich-v3-upgrade.md. Immich's supported VectorChord
  # range is checked on every upgrade (>=0.3 <2 as of v3.2.4).
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-0.4.2@sha256:649da2df5f079dd1f214e3a877cafd0208eff3779e9c60d14d243fbca5e11c97
  instances: 3
  enableSuperuserAccess: true
  inheritedMetadata:
    labels:
      app: immich-database
      env: production
      policy-type: "database"
  monitoring:
    enablePodMonitor: true
  storage:
    # Bumped 2Gi → 10Gi (2026-07-03): replica -4 hit 99% (0 bytes free), firing
    # KubePersistentVolumeFillingUp (critical). 2Gi left no WAL/temp headroom over the
    # ~1.1Gi dataset (WAL on -4 had grown to ~2Gi). CNPG expands in place online here
    # (resizeInUseVolumes=true + truenas-iscsi allowVolumeExpansion + democratic-csi
    # v1.9.5 online resize, PR #1019). NOTE: shrinking still needs cluster recreation.
    size: 10Gi
    storageClass: truenas-iscsi
  postgresql:
    # VectorChord-only end state (migration to VectorChord complete 2026-07-03;
    # pgvecto.rs `vectors` extension dropped). Only vchord.so is preloaded now.
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      search_path: '"$user", public'
      # Safety valve against WAL-pinning slots filling the 10Gi volume.
      # Incident 2026-07-10: a dead replica slot (v3-4) + an orphan slot (v3-6)
      # pinned ~13Gi of WAL, filled the replica PVC → CrashLoopBackOff AND the
      # disk-space guard blocked the operator's reconcile, creeping the primary
      # to 81%. Past this cap CNPG invalidates the lagging/dead slot instead of
      # retaining WAL unbounded. Reloadable GUC (SIGHUP, no restart).
      max_slot_wal_keep_size: "4GB"
  # WAL archiving and base backups via the Barman Cloud Plugin (v0.11.0).
  # S3 configuration is defined in objectstore.yaml (ObjectStore CRD).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-db-prod-cnpg-v3-backup
        serverName: immich-db-prod-cnpg-v3
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-db-credentials
      # Fresh-bootstrap only (does NOT re-run on the existing cluster). VectorChord
      # end state: create vchord (CASCADEs pgvector) — NOT the removed `vectors`.
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
  # externalClusters references the ObjectStore via the plugin for PITR/restore.
  externalClusters:
    - name: immich-db-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: immich-db-prod-cnpg-v3-backup
          serverName: immich-db-prod-cnpg-v3
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  # Prefer high-airflow worker nodes (cpu-tier=high) to co-locate the
  # postgres replicas with the immich-server pods and keep heat off the
  # warmer control-plane nodes. Soft preference — falls back to other
  # nodes when needed (drain, NotReady, replica count > labeled nodes).
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: homelab.gjcourt.dev/cpu-tier
                operator: In
                values:
                  - high
  # Cross-cluster spread: see apps/production/golinks/database.yaml for
  # full rationale. Soft (ScheduleAnyway) balance of CNPG postgres pods
  # across nodes via topologySpreadConstraints.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          policy-type: database
