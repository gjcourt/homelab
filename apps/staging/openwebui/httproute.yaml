# Staging front door: https://chat.stage.burntbytes.com via the Cilium gateway.
# NOT gated by Authelia at the gateway: this route has no ExternalAuth filter,
# so the one_factor rule in apps/staging/authelia/configuration.yaml is dormant
# and the app's own login is the only layer. See docs/architecture/gateway-auth.md.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: openwebui-http
  namespace: openwebui-stage
spec:
  hostnames:
    - chat.stage.burntbytes.com
  parentRefs:
    - name: app-gateway-staging
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: openwebui-https
  namespace: openwebui-stage
spec:
  hostnames:
    - chat.stage.burntbytes.com
  parentRefs:
    - name: app-gateway-staging
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - name: openwebui
          port: 8080
