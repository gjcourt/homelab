apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plane-prod
# Listed in apps/production/kustomization.yaml. The three Secrets
# below are operator-created (SOPS is operator-only). Activation steps are in
# docs/operations/apps/plane.md ("Production first install").
resources:
  - ../../base/plane/
  - database.yaml
  - objectstore.yaml
  - scheduledbackup.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - secret-app-keys.yaml
  - secret-doc-store.yaml
  - secret-aws-creds.yaml

labels:
  - pairs:
      env: production
      app.kubernetes.io/instance: production
    includeSelectors: false

configMapGenerator:
  - name: plane-helm-values-production
    files:
      - values.yaml

configurations:
  - kustomizeconfig.yaml

patches:
  - target:
      kind: Namespace
      name: plane
    patch: |
      - op: replace
        path: /metadata/name
        value: plane-prod
  # Production values merge over the base values.
  - target:
      kind: HelmRelease
      name: plane
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: plane-helm-values-production
  - target:
      kind: HelmRelease
      name: plane
    path: release-patch.yaml
