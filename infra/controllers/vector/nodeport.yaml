# Expose Vector's TCP socket source on a fixed NodePort so that Talos, which
# runs on the host network, can send it logs: service logs via
# machine.logging.destinations and kernel logs via a KmsgLogConfig document.
#
# Each node must send to its OWN IP: tcp://<that-node-ip>:30600.
# externalTrafficPolicy: Local delivers a connection only to the Vector pod on
# the node that received it, so pointing every node at one IP would funnel all
# logs to one pod and lose them whenever that node is down.
# Patch and node list: docs/reference/kernel-log-shipping.md §3.
apiVersion: v1
kind: Service
metadata:
  name: vector-talos-logs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/part-of: vector
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    # Matches the podLabels.talos-log-receiver label set in values.yaml
    talos-log-receiver: "true"
  ports:
    - name: talos-logs
      port: 6000
      targetPort: 6000
      protocol: TCP
      nodePort: 30600
