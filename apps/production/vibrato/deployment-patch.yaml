apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:13889c7110bd3eb24560a4fc6044ac7978a69ae5
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
