# Loki ruler alerting rules for Talos kernel log events.
#
# These rules are evaluated by Loki's built-in ruler component using LogQL.
# Alerts are forwarded to kube-prometheus-stack's Alertmanager.
#
# Rule file must live at /var/loki/rules/<tenant_id>/<file>.yaml.
# With auth_enabled: false, the tenant_id is "fake".
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: loki
data:
  rules.yaml: |
    groups:
      - name: talos-btrfs
        rules:
          # BTRFS "parent transid verify failed" indicates that the iSCSI volume
          # is serving stale data from a reconnect. The filesystem remains mounted
          # rw in error state EA and does NOT trigger node_filesystem_readonly,
          # so kernel log scraping is the only observable signal.
          - alert: BTRFSCorruptionDetected
            expr: |
              sum(count_over_time({job="talos-kernel"} |= "parent transid verify failed" [5m])) > 0
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "BTRFS corruption detected on a Talos node"
              description: >
                Talos kernel logs report "parent transid verify failed" on a BTRFS
                device. An iSCSI volume is likely serving stale data after a
                session reconnect. Find the affected PVC via `talosctl dmesg` and
                recycle it. The NodeFilesystemReadOnly alert will NOT fire for
                this failure mode.

      - name: talos-iscsi
        rules:
          # iSCSI transport or login errors in kernel logs indicate a storage
          # session has been dropped or failed to reconnect cleanly.
          - alert: ISCSIKernelError
            expr: |
              sum(count_over_time({job="talos-kernel"} |~ "(?i)(iscsid|iscsi).*(error|failed|timeout|lost)" [5m])) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "iSCSI error in Talos kernel logs"
              description: >
                Talos kernel logs contain iSCSI-related error messages. A PVC
                may have lost its backing storage connection. Check
                `talosctl dmesg` and verify the iSCSI session against hestia
                (10.42.2.10) via the TrueNAS shares UI.

      - name: talos-log-shipping
        rules:
          # Every rule above matches on {job="talos-kernel"}. If that stream is
          # absent, they evaluate to nothing and look exactly like "no
          # corruption, no iSCSI errors". That is how shipping stayed broken from
          # install (2026-03-05) until the vector `role: Agent` fix: the
          # DaemonSet never rendered, Talos was never pointed at it, and both
          # alerts above were inactive for eight months with no data behind them.
          #
          # A healthy node sends kubelet/etcd/machined service logs all the time,
          # so an hour with no line at all from any node is a broken pipeline,
          # not a quiet cluster. Checked live 2026-11-14: this returns 1 for
          # {job="talos-kernel"} (absent) and nothing for a present stream such
          # as {job="monitoring/grafana"}.
          #
          # Cluster-wide, not per node: the stream carries no node label yet, so
          # one node that is not shipping is not caught here.
          - alert: TalosLogsAbsent
            expr: |
              absent_over_time({job="talos-kernel"}[1h])
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "No Talos kernel/service logs in Loki for 1h"
              description: >
                Loki has received no {job="talos-kernel"} line in the last hour,
                so BTRFSCorruptionDetected and ISCSIKernelError cannot fire.
                Check the vector DaemonSet (kubectl -n monitoring get pods -l
                talos-log-receiver=true), then each node's logging config
                (talosctl -n <node-ip> get machineconfig -o yaml | grep -A4
                logging). See docs/reference/kernel-log-shipping.md.

          # TalosLogsAbsent is satisfied by service logs alone. Kernel messages
          # arrive by a separate Talos setting (KmsgLogConfig), and they are
          # what BTRFSCorruptionDetected and ISCSIKernelError match. If only
          # the machine.logging half is applied, or the KmsgLogConfig is lost,
          # those two alerts are blind while TalosLogsAbsent stays quiet.
          #
          # The 24h window is NOT calibrated. There was no kernel stream to
          # measure when this was written. Talos writes its own "[talos] ..."
          # lines to kmsg, but how often a settled node does so is unknown.
          # Warning tier until a few days of real data show the quiet-node
          # rate. Then tighten the window or raise the severity.
          - alert: TalosKernelLogsAbsent
            expr: |
              absent_over_time({job="talos-kernel", talos_service="kernel"}[24h])
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "No Talos kernel (kmsg) logs in Loki for 24h"
              description: >
                Loki has received no kernel line ({job="talos-kernel",
                talos_service="kernel"}) in 24h, so BTRFSCorruptionDetected and
                ISCSIKernelError cannot fire. Service logs may still be arriving.
                Check each node's KmsgLogConfig: talosctl -n <node-ip> get
                kmsglogconfigs. See docs/reference/kernel-log-shipping.md §3.
