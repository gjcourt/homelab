apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: jellyfin
  # Jellyfin mounts several single-writer PVCs; RollingUpdate can leave the new
  # pod stuck in ContainerCreating until the old pod fully exits.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      serviceAccountName: jellyfin
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
          ports:
            - containerPort: 8096
              name: http

          env:
            - name: JELLYFIN_FFmpeg__probesize
              value: "50000000"
            - name: JELLYFIN_FFmpeg__analyzeduration
              value: "50000000"
          envFrom:
            - configMapRef:
                name: jellyfin-container-env

          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: jellyfin-cache
              mountPath: /cache
            - name: dri
              mountPath: /dev/dri
            - name: movies
              mountPath: /media/movies
              readOnly: true
            - name: tvshows
              mountPath: /media/tvshows
              readOnly: true
            - name: tvanime
              mountPath: /media/tv-anime
              readOnly: true

          securityContext:
            privileged: true # Required for GPU access

          # startupProbe gates liveness/readiness until Jellyfin is up.
          # Allows up to 5 minutes for first-run library scans.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          # Resource limits - generous for transcoding bursts.
          #
          # cpu raised 4000m -> 8000m (2026-09-02). Nodes are 12-core, and the
          # 4-core ceiling was the binding constraint on transcode start-up
          # latency: PGS (bitmap) subtitles cannot be passed through to a
          # client, so Jellyfin burns them into the picture, and burn-in forces
          # a full re-encode regardless of what the client can direct-play.
          # Even with VAAPI enabled the subtitle overlay, scaling and format
          # conversion run on CPU, so the cgroup cap throttled exactly the work
          # that makes playback slow to start.
          #
          # requests stay at 100m deliberately: this is a burst ceiling, not a
          # reservation, so scheduling and staging co-tenancy are unaffected.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 4Gi
              cpu: 8000m

        # Sidecar: periodically sweep orphaned transcode files. Jellyfin only
        # removes transcodes on a clean session-stop or at startup; abnormally
        # ended sessions (client/network drops) orphan them, and over long
        # uptime they accumulate until /cache fills. As of Jellyfin 10.11 this
        # is fatal, not just slow: startup aborts with "path `/cache` has
        # insufficient free space (Required: 2GiB)" (seen 2026-07-26), and
        # because that check runs before the task scheduler, Jellyfin can never
        # run its own cleanup to recover — it crashloops. This sidecar is an
        # independent process that cleans even while Jellyfin is down, doing
        # the periodic reap Jellyfin has no scheduled task for. Two-stage:
        #   1. age sweep — reap transcodes older than 4h (routine housekeeping).
        #   2. free-space floor — if <4GiB free (comfortably above the 2GiB
        #      startup gate), delete oldest transcodes regardless of age until
        #      back over the line. This is what makes the sweep robust: age
        #      alone loses the race when a burst of concurrent 4K transcodes
        #      fills /cache faster than the 4h window. df -P prints 1K blocks;
        #      4194304 = 4GiB. No probe by design: the janitor's health must
        #      not gate Jellyfin's pod readiness.
        - name: transcode-janitor
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                find /cache/transcodes -mindepth 1 -type f -mmin +240 -exec rm -f {} + 2>/dev/null || true
                while [ "$(df -P /cache | awk 'NR==2{print $4}')" -lt 4194304 ]; do
                  oldest=$(ls -tr /cache/transcodes/* 2>/dev/null | head -1)
                  [ -z "$oldest" ] && break
                  rm -f "$oldest" 2>/dev/null || true
                done
                find /cache/transcodes -mindepth 1 -depth -type d -exec rmdir {} + 2>/dev/null || true
                sleep 1800
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: jellyfin-cache
              mountPath: /cache

      volumes:
        - name: jellyfin-config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
        - name: jellyfin-cache
          persistentVolumeClaim:
            claimName: jellyfin-cache-pvc
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: movies
          persistentVolumeClaim:
            claimName: jellyfin-movies-pvc
        - name: tvshows
          persistentVolumeClaim:
            claimName: jellyfin-tvshows-pvc
        - name: tvanime
          persistentVolumeClaim:
            claimName: jellyfin-tvanime-pvc
