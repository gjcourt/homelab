apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitals
  namespace: vitals
  labels:
    app: vitals
spec:
  replicas: 1
  # ReadWriteOnce: the default RollingUpdate would start the replacement before
  # terminating the old pod, and the new one cannot attach a volume the old one
  # still holds. Recreate terminates first. Same failure this repo documents in
  # AGENTS.md under "Deployments on RWO".
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: vitals
  template:
    metadata:
      labels:
        app: vitals
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vitals-data
        # Per-overlay: the replica URL differs between production and staging.
        - name: litestream-config
          configMap:
            name: vitals-litestream
        # readOnlyRootFilesystem: true, and an in-container `litestream restore`
        # or a large sqlite temp spills to /tmp.
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      # ⚠️ THIS IS WHAT ACTUALLY RECOVERS AN EMPTY VOLUME, not the sidecar's
      # -restore-if-db-not-exists flag. Rehearsed 2026-09-19 on staging: the
      # volume was wiped, the pod restarted, and litestream logged
      #   "database exists, skipping restore"
      # because the app container had already created an empty vitals.db. The
      # containers start in parallel and the app wins the race, so the flag is
      # unreachable in this arrangement. An initContainer cannot lose that race:
      # nothing else in the pod is running yet.
      #
      # BOTH guards are required; they cover different conditions, and the
      # flag help states them precisely:
      #   -if-replica-exists  "exit code 0 if no backups found"        -> first
      #                        deploy against an empty bucket
      #   -if-db-not-exists   "exit code 0 if the database already
      #                        exists"                                 -> every
      #                        restart where the file is on the PVC
      #
      # -if-replica-exists ALONE is not enough, and staging proved it: with only
      # that flag the initContainer crashlooped 58 times over 4h36m on
      #   Error: cannot restore, output path already exists and is not empty:
      #   /data/vitals.db. Use -force to overwrite
      # Reproduced locally against litestream 0.5.17 with a seeded database:
      # -if-replica-exists alone exits 1; adding -if-db-not-exists exits 0 with
      # "database already exists, skipping".
      #
      # Do NOT reach for -force here. It would overwrite a live database with
      # whatever is in the bucket, which is data loss, not recovery.
      initContainers:
        - name: litestream-restore
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          args:
            - restore
            - -config
            - /etc/litestream/litestream.yml
            - -if-replica-exists
            - -if-db-not-exists
            - /data/vitals.db
          env:
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vitals-aws-creds-secret
                  key: ACCESS_KEY_ID
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vitals-aws-creds-secret
                  key: ACCESS_SECRET_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      serviceAccountName: vitals
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vitals
          image: ghcr.io/gjcourt/vitals:2026-09-13-34ff344
          ports:
            - containerPort: 8080
          env:
            - name: SQLITE_PATH
              value: /data/vitals.db
          envFrom:
            - configMapRef:
                name: vitals-container-env
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        # Continuous replication of the SQLite file to S3. Replaces the WAL
        # archiving the retired CNPG cluster had (#1430 removed it); without
        # this the only copy of the data is one RWO iSCSI volume.
        #
        # A sidecar rather than a CronJob because the volume is ReadWriteOnce:
        # a separate pod cannot mount it while this one holds it. Sharing the
        # pod sidesteps that entirely.
        #
        # ⚠️ Coupling accepted deliberately: this container sits in the app's
        # pod, so if it crashloops (bad credentials, bucket unreachable) the
        # pod stops being Ready and the app goes down with the backup. The
        # ContainerRestartingSlowly alert (#1369) catches the slow-burn case.
        # Revisit as a native sidecar (initContainer + restartPolicy: Always)
        # if that coupling ever bites.
        - name: litestream
          image: litestream/litestream:0.5.17@sha256:4b02b9859a6b6b4087d8b8944e15f7e984bd7957cba322bbeee38b0e27b9656a
          args:
            - replicate
            # Kept as a backstop only. ⚠️ It does NOT fire in this pod: the app
            # container creates an empty vitals.db before this check runs, so
            # litestream logs "database exists, skipping restore" — measured
            # during the 2026-09-19 staging rehearsal. The initContainer above
            # is the real recovery path.
            - -restore-if-db-not-exists
            - -config
            - /etc/litestream/litestream.yml
          ports:
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 30
          env:
            # Litestream reads these two names natively — no config reference.
            # Keys are the ones the retired Barman ObjectStore secret already
            # used, so the same credentials carry over unchanged.
            - name: LITESTREAM_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vitals-aws-creds-secret
                  key: ACCESS_KEY_ID
            - name: LITESTREAM_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vitals-aws-creds-secret
                  key: ACCESS_SECRET_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: litestream-config
              mountPath: /etc/litestream
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
