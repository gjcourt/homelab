      heading: Hallway Lights
      heading_style: title
      icon: mdi:door-sliding
    - type: custom:mushroom-template-card
      primary: All Hallway Lights
      secondary: "{% set l = ['light.hallway_long', 'light.hallway_landing'] %}{% set u = l | select('is_state', 'unavailable') | list | count %}{{ l | select('is_state', 'on') | list | count }} on{{ ' · ' ~ u ~ ' offline' if u else '' }}"
      icon: mdi:lightbulb-group
      icon_color: "{% set l = ['light.hallway_long', 'light.hallway_landing'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: perform-action
        perform_action: script.smart_light_toggle
        data:
          entities:
          - light.hallway_long
          - light.hallway_landing
