# Deploy Vector as a DaemonSet so it runs on every Talos node and receives
# that node's Talos logs over TCP: service logs from
# machine.logging.destinations and kernel logs from a KmsgLogConfig document
# (see docs/reference/kernel-log-shipping.md).
#
# The chart's DaemonSet role is called "Agent". The valid roles are "Agent"
# (DaemonSet), "Aggregator" (StatefulSet) and "Stateless-Aggregator"
# (Deployment). Any other value renders NO workload at all, and the chart does
# not fail: from install (2026-03-05) until this was fixed, `role: DaemonSet`
# rendered only a ServiceAccount, a ConfigMap and two Services, the HelmRelease
# reported Ready, and no Talos log ever reached Loki. VectorAgentNotReady
# (infra/configs/alerts/loki-rules.yaml) and TalosLogsAbsent
# (infra/controllers/loki/alerting-rules.yaml) exist so that cannot recur
# silently.
role: Agent

# The Agent role is built for scraping container logs off the host. This
# pipeline only listens on a TCP socket, so turn off what that role adds by
# default and this config never uses:
#   - hostPath mounts of /var/log, /var/lib, /proc and /sys
#   - a ClusterRole/Binding to list+watch pods, nodes and namespaces (only the
#     kubernetes_logs source needs it)
#   - a hostPath data dir at /var/lib/vector (an emptyDir is enough: the
#     socket source keeps no checkpoints and the Loki sink buffers in memory)
defaultVolumes: []
defaultVolumeMounts: []
rbac:
  create: false
# With no RBAC there is nothing for an API token to do.
serviceAccount:
  automountToken: false
persistence:
  hostPath:
    enabled: false

# Without hostPath mounts the pod needs no privileges, so run it to the
# restricted Pod Security profile even though the namespace allows more.
# Checked 2026-11-14: the 0.53.0-distroless-libc image runs this config as
# uid 65534 with a read-only root, all capabilities dropped and
# no-new-privileges, writing only to the data dir.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Every node must run a receiver, including one with a NoSchedule taint.
# Same toleration as the prometheus-node-exporter chart default. A custom
# NoExecute taint would still evict it, and VectorAgentNotReady would fire.
tolerations:
  - operator: Exists
    effect: NoSchedule

# Ready once the socket source is listening, which is what the NodePort needs.
# No livenessProbe: it would have no signal distinct from this one.
readinessProbe:
  tcpSocket:
    port: 6000
  initialDelaySeconds: 5
  periodSeconds: 10

# Add a well-known label so the NodePort service can select the pods without
# depending on Vector's internal chart labels.
podLabels:
  talos-log-receiver: "true"

# Scrape Vector's own metrics (the prom_exporter sink below). The relabeling
# copies the pod's node onto every series, so TalosNodeLogsSilent
# (infra/configs/alerts/loki-rules.yaml) can name the node that stopped
# sending. The chart names the generated container port after the sink:
# prom_exporter -> prom-exporter, the PodMonitor default.
podMonitor:
  enabled: true
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# Full Vector configuration.
# Receives Talos json_lines logs over TCP, labels them, and ships to Loki.
customConfig:
  data_dir: /vector-data-dir

  sources:
    # Receive Talos service logs (machine.logging.destinations) and kernel logs
    # (KmsgLogConfig).
    # Format: newline-delimited JSON (Talos json_lines format, one event per line).
    talos_logs:
      type: socket
      address: "0.0.0.0:6000"
      mode: tcp
      framing:
        method: newline_delimited
      decoding:
        codec: json

    # Vector's own counters, for the per-node silence alert.
    vector_metrics:
      type: internal_metrics

  transforms:
    # Normalise Talos field names. Talos uses "talos-service" (hyphenated) which
    # is invalid in VRL without quoting; rename to talos_service. Kernel (kmsg)
    # events carry no talos-service, so they get "kernel". Talos puts the level
    # in "talos-level" (service and kmsg events alike), not "level"; reading
    # .level alone labelled every line "info". Also ensure msg is present.
    normalize_talos:
      type: remap
      inputs:
        - talos_logs
      source: |
        .talos_service = string(del(."talos-service")) ?? "kernel"
        .level = string(del(."talos-level")) ?? string(.level) ?? "info"
        .msg = string(.msg) ?? ""

        # Each node sends to its own IP, and the NodePort's
        # externalTrafficPolicy: Local only routes that to the Vector pod on
        # the same node. So this pod's node is the sender.
        .node = get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown"

        # Use the time Talos logged the line, not the time it arrived. When a
        # node first connects, Talos sends its in-memory buffer from boot, and
        # arrival time would make those old lines look new (on 2026-11-15 a
        # replay of old iscsid errors fired ISCSIKernelError). Lines more than
        # Loki's out-of-order window behind are rejected by Loki, which is
        # what we want for a replay; the rest of the batch is accepted.
        # Extension services (ext-iscsid) log plain stdout with no time of
        # their own, so Talos stamps those when it sends them and they keep
        # arrival time either way.
        ts, err = parse_timestamp(string(."talos-time") ?? "", "%+")
        if err == null {
          .timestamp = ts
          del(."talos-time")
        }

  sinks:
    # Forward all Talos log events to Loki with structured labels for querying.
    loki_output:
      type: loki
      inputs:
        - normalize_talos
      endpoint: http://loki.monitoring.svc.cluster.local:3100
      encoding:
        codec: json
      labels:
        job: talos-kernel
        # Use Helm tpl-safe escaping: {{ "{{" }} renders to {{ in the final config,
        # which is the Vector field-reference syntax for dynamic Loki labels.
        talos_service: '{{ "{{" }} talos_service {{ "}}" }}'
        level: '{{ "{{" }} level {{ "}}" }}'
        node: '{{ "{{" }} node {{ "}}" }}'
      batch:
        max_events: 500
        timeout_secs: 5

    # Vector's own metrics, scraped by the PodMonitor above.
    prom_exporter:
      type: prometheus_exporter
      inputs:
        - vector_metrics
      address: "0.0.0.0:9598"
