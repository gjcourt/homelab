apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:ead5b3714aa530f43cc521b0f027f1a1870a23e5
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
