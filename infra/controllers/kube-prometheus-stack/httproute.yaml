---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-https
  namespace: monitoring
spec:
  hostnames:
    - alerts.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: https
  rules:
    # Authelia gate (Gateway API ExternalAuth, Cilium 1.20). This host has no
    # login of its own; the one_factor rule is in
    # apps/production/authelia/configuration.yaml. Cilium plan step 5:
    # docs/plans/2026-11-04-cilium-1-20-external-auth-plan.md
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: authelia-prod
              port: 9091
            http:
              # Trailing slash matters: see apps/staging/navidrome/httproute.yaml.
              path: /api/authz/ext-authz/
              allowedHeaders:
                - cookie
                - x-forwarded-proto
                - x-forwarded-for
                - accept
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
---
