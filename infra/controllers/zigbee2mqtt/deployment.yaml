apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
  labels:
    app: zigbee2mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zigbee2mqtt
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      # zigbee2mqtt closes its SQLite database and writes coordinator_backup.json
      # on SIGTERM. The 30s default can clip that on a slow iSCSI volume, and a
      # half-written close is what the next attach has to recover from. Cheap
      # insurance on a single-replica workload that is never in a hurry to stop.
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: init-config
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          # Guard against a stale/read-only iSCSI data mount (issue #1080): a hestia
          # iSCSI target flap remounts the ext4 volume read-only, and z2m otherwise
          # starts and burns hundreds of restarts on a confusing `ENOENT mkdir` deep
          # in the app. Fail the init fast with a clear recovery hint instead.
          command:
            - sh
            - -c
            - |
              set -e
              SENTINEL=/app/data/.mount-writable
              # Write BYTES and read them back. `touch` alone succeeds on a
              # filesystem with no free space, so it passes a volume that is
              # full -- see AGENTS.md "Recovering read-only iSCSI volumes".
              if ! printf writable > "$SENTINEL" 2>/dev/null || [ ! -s "$SENTINEL" ]; then
                rm -f "$SENTINEL" 2>/dev/null || true
                echo "FATAL: /app/data is not writable." >&2
                echo "Most likely a read-only iSCSI remount (issue #1080), or the volume is full." >&2
                echo "Do NOT just scale to 0/1 -- Flux reverts a scale-to-0 within the reconcile" >&2
                echo "interval. Follow AGENTS.md 'Recovering read-only iSCSI volumes', which" >&2
                echo "suspends the Kustomization first and waits for volumeattachment to clear." >&2
                exit 1
              fi
              rm -f "$SENTINEL"
              if [ ! -s /app/data/configuration.yaml ]; then
                cp -L /tmp/config/configuration.yaml /app/data/configuration.yaml
              fi
          volumeMounts:
            - name: config
              mountPath: /tmp/config
            - name: data
              mountPath: /app/data
      containers:
        - name: zigbee2mqtt
          image: koenkk/zigbee2mqtt@sha256:4fb4db4d49a217bed6d0204f454ce809febc565bbe051b85c556ee2bcef73d8c
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: zigbee2mqtt-env
          env:
            - name: ZIGBEE2MQTT_DATA
              value: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness uses a TCP probe so a UI hiccup doesn't co-restart with
          # readiness. zigbee2mqtt has no documented /healthz endpoint — the
          # frontend serves the SPA on /, which is fine for readiness but
          # not a strong "process alive" signal on its own.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: config
          configMap:
            name: zigbee2mqtt-config
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data-pvc
