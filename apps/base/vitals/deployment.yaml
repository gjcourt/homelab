apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitals
  namespace: vitals
  labels:
    app: vitals
spec:
  replicas: 1
  # ReadWriteOnce: the default RollingUpdate would start the replacement before
  # terminating the old pod, and the new one cannot attach a volume the old one
  # still holds. Recreate terminates first. Same failure this repo documents in
  # AGENTS.md under "Deployments on RWO".
  strategy:
    type: Recreate
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: vitals
  template:
    metadata:
      labels:
        app: vitals
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vitals-data
      serviceAccountName: vitals
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vitals
          image: ghcr.io/gjcourt/vitals:2026-02-21
          ports:
            - containerPort: 8080
          env:
            - name: SQLITE_PATH
              value: /data/vitals.db
          envFrom:
            - configMapRef:
                name: vitals-container-env
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
