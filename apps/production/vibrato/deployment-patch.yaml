apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:5b02c7713bef8b91a4de0692465719e0bea8c745
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
