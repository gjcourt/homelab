apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - httproute.yaml
  - namespace.yaml
  - release.yaml
  - repository.yaml
  # SOPS-encrypted; operator-created from the matching .yaml.example.
  # kustomize build fails until they exist — intended gate (see the .example headers).
  - secret-alertmanager-smtp.yaml
  - secret-alertmanager-deadman.yaml

configMapGenerator:
  - name: kube-prometheus-stack-helm-values
    namespace: monitoring
    files:
      - values.yaml

configurations:
  - kustomizeconfig.yaml
