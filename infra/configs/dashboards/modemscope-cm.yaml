apiVersion: v1
kind: ConfigMap
metadata:
  name: modemscope-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  modemscope.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Is my internet connection healthy? Status tiles first, then errors, signal quality, uptime.",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Cluster net",
          "tooltip": "",
          "type": "link",
          "url": "/d/netscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Thermals",
          "tooltip": "",
          "type": "link",
          "url": "/d/34ae4f48-4436-408b-9721-bb5fd18c1a78"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Storage",
          "tooltip": "",
          "type": "link",
          "url": "/d/storage"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Bench fleet",
          "tooltip": "",
          "type": "link",
          "url": "/d/bench-fleet"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Jobs",
          "tooltip": "",
          "type": "link",
          "url": "/d/homelabscope"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "modemscope_up: 1 while the exporter can read the modem. DOWN = modem unreachable/wedged/mid-reboot.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                },
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "DOWN"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "Reachable"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "modemscope_up",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Modem reachable",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Number of times modem uptime dropped to zero in 24 h. 0 = stable.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 0
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(resets(modemscope_uptime_seconds[24h]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Reboots, last 24 h",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Uncorrectable codewords (real data loss) in the last hour, QAM + OFDM. Reset-safe: sums only forward deltas, because the modem's OFDM counter resets ~30x/day and rate()/increase() turn each reset into a phantom spike of billions. Thresholds (1k amber, 10k red per hour) are PROPOSED - tune against your normal.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1000
                  },
                  {
                    "color": "red",
                    "value": 10000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 0
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(sum_over_time(clamp_min(delta(modemscope_downstream_uncorrectables_total[5m]),0)[1h:5m])) + sum(sum_over_time(clamp_min(delta(modemscope_downstream_ofdm_uncorrectables_total[5m]),0)[1h:5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Link errors, 1 h",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Lowest signal-to-noise across bonded QAM channels, now. DOCSIS: below 30 dB is failing, 30-33 marginal, 33+ healthy.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 30
                  },
                  {
                    "color": "green",
                    "value": 33
                  }
                ]
              },
              "unit": "dB"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 0
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(modemscope_downstream_snr_db)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Worst SNR",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Largest distance from 0 dBmV across downstream channels. Spec window is +/-7 dBmV; amber from 5.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 7
                  }
                ]
              },
              "unit": "dBmV"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 0
          },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(abs(modemscope_downstream_power_dbmv))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Power offset",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "1 if the OFDM (DOCSIS 3.1) downstream receiver is locked.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                },
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "NOT LOCKED"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "Locked"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 0
          },
          "id": 6,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(modemscope_downstream_ofdm_locked)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "OFDM channel",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Time since last modem boot. Informational.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 0,
            "y": 5
          },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "modemscope_uptime_seconds",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Uptime",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Downstream / upstream channels bonded. Informational (expected counts not defined).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 6,
            "y": 5
          },
          "id": 8,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "modemscope_downstream_channels",
              "legendFormat": "down ",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "modemscope_upstream_channels",
              "legendFormat": "up ",
              "refId": "B"
            }
          ],
          "title": "Bonded channels",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Min across the DOCSIS init stages (bpi, dhcp, ranging, ...). 1 = all stages passed.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                },
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "INCOMPLETE"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "Registered"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "id": 9,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min(modemscope_docsis_init_state)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "DOCSIS registration",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Highest upstream transmit level. Typical window 35-51 dBmV; higher means a weak return path (modem shouts to be heard).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 49
                  },
                  {
                    "color": "red",
                    "value": 51
                  }
                ]
              },
              "unit": "dBmV"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "id": 10,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(modemscope_upstream_power_dbmv)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Upstream TX, max",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Forward deltas only (counter resets ignored). Spikes = genuine error bursts; zero between bursts = clean.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "drawStyle": "line",
                "fillOpacity": 40,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                }
              },
              "min": 0,
              "noValue": "No data",
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(clamp_min(delta(modemscope_downstream_uncorrectables_total[5m]),0))",
              "interval": "5m",
              "legendFormat": "QAM",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(clamp_min(delta(modemscope_downstream_ofdm_uncorrectables_total[5m]),0))",
              "interval": "5m",
              "legendFormat": "OFDM",
              "refId": "B"
            }
          ],
          "title": "Link errors over time (uncorrectable codewords per 5 min)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Lines at 30 dB (fail) and 33 dB (healthy). Axis starts at 25 dB, not 0, to make drift visible.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisLabel": "",
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": false,
                "thresholdsStyle": {
                  "mode": "line"
                }
