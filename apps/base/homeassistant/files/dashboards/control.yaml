- title: Lights
  theme: Tinted
  path: lights
  icon: mdi:lightbulb-group
  type: sections
  max_columns: 3
  sections:
  # One section per room. Every light is a mushroom-light-card with a
  # brightness slider (tap = toggle, hold = full more-info dialog). The
  # room heading's badge is a group toggle for all lights in that room.
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Kitchen
      heading_style: title
      icon: mdi:silverware-fork-knife
    - type: custom:mushroom-template-card
      primary: All lights
      secondary: "{% set l = ['light.kitchen_main_lights', 'light.kitchen_under_cabinet', 'light.kitchen_island_pendants'] %}{% set u = l | select('is_state', 'unavailable') | list | count %}{{ l | select('is_state', 'on') | list | count }} on{{ ' · ' ~ u ~ ' offline' if u else '' }}"
