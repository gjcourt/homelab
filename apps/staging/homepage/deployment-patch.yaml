apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  template:
    spec:
      # Staging-first DNS fix (prod follows once verified): with the default
      # ndots:5 and three search domains, every *.burntbytes.com siteMonitor
      # lookup is first tried against each search domain. About 4% of
      # lookups stall exactly 2.5 s (a resolver retry), and Node's libuv
      # threadpool (4 threads by default) serialises them: 24 parallel
      # lookups took 5.1 s, so later tile groups showed about 2 s latency.
      # ndots:2 sends external names straight to the resolver; in-cluster
      # names here are FQDNs (prometheus ...svc.cluster.local) or env IPs.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      containers:
        - name: homepage
          envFrom:
            - secretRef:
                name: homepage-synology
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.stage.burntbytes.com
            # More libuv threads so a stalled getaddrinfo doesn't queue the
            # other tiles' lookups behind it (see dnsConfig above).
            - name: UV_THREADPOOL_SIZE
              value: "16"
