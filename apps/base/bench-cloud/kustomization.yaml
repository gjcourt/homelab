apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# bench-cloud: Claude Code agents in the cluster.
# Plan: docs/plans/2026-09-25-bench-cloud-agent.md. Production-only — there is
# no staging variant (a second agent namespace would share the same GitHub App
