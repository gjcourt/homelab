apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: couchdb-stage
resources:
  - ../../base/couchdb/
  - httproute.yaml
  # Operator-encrypted (SOPS); template in secret-couchdb-admin.yaml.example.
  # Listed unconditionally: if the file is ever missing, kustomize build / CI
  # fails rather than deploying a pod with no credentials (same gate as
  # apps/staging/mealie).
  - secret-couchdb-admin.yaml

labels:
  - pairs:
      env: staging
      app.kubernetes.io/instance: staging
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: couchdb
    patch: |
      - op: replace
        path: /metadata/name
        value: couchdb-stage
