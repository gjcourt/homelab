apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-review
  namespace: renovate
spec:
  # Renovate itself runs @daily at 00:00 and takes ~5m. Start at 01:00 so the
  # day's PRs exist and their CI has settled before they are reviewed.
  schedule: "0 1 * * *"
  # Enabled 2026-09-24 alongside secret-renovate-review-env. The agent runs in
  # REVIEW_MODE=shadow (configmap.yaml): it calls the model and posts nothing, so
  # landing this changes no merge behaviour until the mode is advanced to live.
  # Required PAT scopes are documented in secret.yaml.example.
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      # Auto-delete finished jobs after 1h so a stray failure doesn't linger as
      # a persistent KubeJobFailed alert.
      # A hung model call must not wedge the CronJob: concurrencyPolicy is
      # Forbid, so one stuck Job would block every future run, silently.
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0 # never retry: a re-run would duplicate PR comments
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: review
              # The bench-cloud image, for its python3 and Claude Code: each
              # reviewer call is `claude -p`, billed to the subscription token
              # (CLAUDE_CODE_OAUTH_TOKEN) instead of an API key. `command:`
              # replaces the image's ENTRYPOINT (bench-entrypoint), so no GitHub
              # App config or workspace setup runs here. Tag matches the
              # bench-cloud console (apps/production/bench-cloud).
              image: ghcr.io/gjcourt/bench-cloud:2026-10-01-60e3604
              command: ["python3", "/scripts/review.py"]
              args: ["--mode", "$(REVIEW_MODE)"]
              env:
                # Claude Code writes ~/.claude* state; / is read-only.
                - name: HOME
                  value: /tmp
              envFrom:
                - configMapRef:
                    name: renovate-review-env
                - secretRef:
                    name: secret-renovate-review-env
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                # Claude Code is a Node process; 256Mi is not enough for it.
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: script
              configMap:
                name: renovate-review-script
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
