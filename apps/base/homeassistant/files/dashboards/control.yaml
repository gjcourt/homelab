  # Sub-Zero / Wolf / Cove appliances (orienw/ha-subzero, cloud push). Status
  # first; nothing here changes an appliance with one tap — every card opens
  # more-info, where the setpoint / mode controls live. Templates handle
  # unavailable themselves, so cards don't flash in and out when the cloud
  # connection drops. Fridge figures are SETPOINTS: the fridge reports no
  # measured temperature.
  - type: grid
    cards:
    - type: heading
      heading: Kitchen Appliances
      heading_style: title
      icon: mdi:fridge-outline
    - type: custom:mushroom-template-card
      primary: Fridge
      secondary: "{% set fd = is_state('binary_sensor.42_french_door_refrigerator_door', 'on') %}{% set zd = is_state('binary_sensor.42_french_door_freezer_door', 'on') %}{% set f = states('sensor.42_french_door_refrigerator_setpoint') %}{% set z = states('sensor.42_french_door_freezer_setpoint') %}{% if not f | is_number %}Status unavailable{% else %}{{ 'Fridge door open · ' if fd else '' }}{{ 'Freezer door open · ' if zd else '' }}Set {{ f }}°F · freezer {{ z ~ '°F' if z | is_number else '—' }}{% endif %}"
      icon: mdi:fridge
      icon_color: "{{ 'red' if is_state('binary_sensor.42_french_door_refrigerator_door', 'on') or is_state('binary_sensor.42_french_door_freezer_door', 'on') else ('blue' if states('sensor.42_french_door_refrigerator_setpoint') | is_number else 'disabled') }}"
      tap_action:
        action: more-info
        entity: climate.42_french_door_refrigerator
      hold_action:
        action: none
      double_tap_action:
        action: none
      grid_options:
        columns: full
    - type: custom:mushroom-template-card
      primary: Ovens
      secondary: >-
        {%- set ns = namespace(p=[], known=false) -%}
        {%- for name, m, t, s, pre in [
          ('Upper', 'sensor.30_double_wall_oven_cooking_mode', 'sensor.30_double_wall_oven_oven_temperature', 'sensor.30_double_wall_oven_oven_setpoint', 'binary_sensor.30_double_wall_oven_preheated'),
          ('Lower', 'sensor.30_double_wall_oven_lower_oven_cooking_mode', 'sensor.30_double_wall_oven_lower_oven_temperature', 'sensor.30_double_wall_oven_lower_oven_setpoint', 'binary_sensor.30_double_wall_oven_lower_oven_preheated')] -%}
        {%- set mode = states(m) -%}
        {%- if mode not in ['unavailable', 'unknown'] -%}{%- set ns.known = true -%}{%- endif -%}
        {%- if mode not in ['Off', 'unavailable', 'unknown'] -%}
        {%- set ns.p = ns.p + [name ~ ' ' ~ mode ~ ' ' ~ (states(t) ~ '°' if states(t) | is_number else '—') ~ ' → ' ~ (states(s) ~ '°F' if states(s) | is_number else '—') ~ (' · ready' if is_state(pre, 'on') else '')] -%}
        {%- endif -%}
        {%- endfor -%}
        {{ ns.p | join(' · ') if ns.p else ('Off' if ns.known else 'Status unavailable') }}
      icon: mdi:stove
      icon_color: "{{ 'deep-orange' if [states('sensor.30_double_wall_oven_cooking_mode'), states('sensor.30_double_wall_oven_lower_oven_cooking_mode')] | reject('in', ['Off', 'unavailable', 'unknown']) | list | count > 0 else 'disabled' }}"
      tap_action:
        action: more-info
        entity: climate.30_double_wall_oven_oven
      hold_action:
        action: none
      double_tap_action:
        action: none
      grid_options:
        columns: full
    # Probe readout only while a probe is plugged in.
    - type: custom:mushroom-template-card
      primary: Probe
      secondary: >-
        {%- set ns = namespace(p=[]) -%}
        {%- for name, use, t, s, done in [
          ('Upper', 'binary_sensor.30_double_wall_oven_probe_in_use', 'sensor.30_double_wall_oven_probe_temperature', 'sensor.30_double_wall_oven_probe_setpoint', 'binary_sensor.30_double_wall_oven_probe_target_reached'),
          ('Lower', 'binary_sensor.30_double_wall_oven_lower_oven_probe_in_use', 'sensor.30_double_wall_oven_lower_oven_probe_temperature', 'sensor.30_double_wall_oven_lower_oven_probe_setpoint', 'binary_sensor.30_double_wall_oven_lower_oven_probe_target_reached')] -%}
        {%- if is_state(use, 'on') -%}
        {%- set ns.p = ns.p + [name ~ ' ' ~ (states(t) ~ '°' if states(t) | is_number else '—') ~ ' → ' ~ (states(s) ~ '°F' if states(s) | is_number else '—') ~ (' · done' if is_state(done, 'on') else '')] -%}
        {%- endif -%}
        {%- endfor -%}
        {{ ns.p | join(' · ') }}
      icon: mdi:thermometer-probe
      icon_color: "{{ 'green' if is_state('binary_sensor.30_double_wall_oven_probe_target_reached', 'on') or is_state('binary_sensor.30_double_wall_oven_lower_oven_probe_target_reached', 'on') else 'deep-orange' }}"
      tap_action:
        action: more-info
        entity: sensor.30_double_wall_oven_probe_temperature
      hold_action:
        action: none
      grid_options:
        columns: full
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.30_double_wall_oven_probe_in_use
          state: "on"
        - condition: state
          entity: binary_sensor.30_double_wall_oven_lower_oven_probe_in_use
          state: "on"
    # Oven kitchen timers: a live countdown tile (timestamp sensor) while
    # running, a "done" line once finished. Tapping "done" opens the Dismiss
    # button's dialog (one step removed), never dismisses on the first tap.
    - type: tile
      entity: sensor.30_double_wall_oven_kitchen_timer_end
      name: Oven timer 1
      icon: mdi:timer-sand
      color: deep-orange
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: binary_sensor.30_double_wall_oven_kitchen_timer_active
        state: "on"
    - type: tile
      entity: sensor.30_double_wall_oven_kitchen_timer_2_end
      name: Oven timer 2
      icon: mdi:timer-sand
      color: deep-orange
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: binary_sensor.30_double_wall_oven_kitchen_timer_2_active
        state: "on"
    - type: custom:mushroom-template-card
      primary: Oven timer 1 done
      secondary: Tap to dismiss
      icon: mdi:timer-check
      icon_color: green
      tap_action:
        action: more-info
        entity: button.30_double_wall_oven_dismiss_kitchen_timer
      hold_action:
        action: none
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: binary_sensor.30_double_wall_oven_kitchen_timer_complete
        state: "on"
    - type: custom:mushroom-template-card
      primary: Oven timer 2 done
      secondary: Tap to dismiss
      icon: mdi:timer-check
      icon_color: green
      tap_action:
        action: more-info
        entity: button.30_double_wall_oven_dismiss_kitchen_timer_2
      hold_action:
        action: none
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: binary_sensor.30_double_wall_oven_kitchen_timer_2_complete
        state: "on"
    - type: custom:mushroom-template-card
      primary: Dishwasher
      secondary: "{% set s = states('sensor.24_dishwasher_wash_status') %}{% set e = states('sensor.24_dishwasher_wash_cycle_end') %}{% if s in ['unavailable', 'unknown'] %}Status unavailable{% else %}{{ s }}{% if s in ['Running', 'Drying'] and as_datetime(e, none) is not none %} · done about {{ as_timestamp(e) | timestamp_custom('%-I:%M %p') }}{% endif %}{% endif %}"
      icon: mdi:dishwasher
      icon_color: "{% set s = states('sensor.24_dishwasher_wash_status') %}{{ 'blue' if s in ['Running', 'Drying', 'Delayed', 'Start pending'] else ('green' if s == 'Complete' else ('red' if s == 'Error' else 'disabled')) }}"
      tap_action:
        action: more-info
        entity: sensor.24_dishwasher_wash_status
      hold_action:
        action: none
      double_tap_action:
        action: none
      grid_options:
        columns: full
    # Maintenance: only shows when something needs doing.
    - type: custom:mushroom-template-card
      primary: Needs attention
      secondary: >-
        {%- set ns = namespace(p=[]) -%}
        {%- for name, e in [('Fridge', 'binary_sensor.42_french_door_service_required'), ('Ovens', 'binary_sensor.30_double_wall_oven_service_required'), ('Dishwasher', 'binary_sensor.24_dishwasher_service_required')] -%}
        {%- if is_state(e, 'on') -%}{%- set ns.p = ns.p + [name ~ ' needs service'] -%}{%- endif -%}
        {%- endfor -%}
        {%- for name, e in [('Fridge', 'sensor.42_french_door_active_faults'), ('Ovens', 'sensor.30_double_wall_oven_active_faults'), ('Dishwasher', 'sensor.24_dishwasher_active_faults')] -%}
        {%- if states(e) | int(0) > 0 -%}{%- set ns.p = ns.p + [name ~ ': ' ~ states(e) ~ ' fault' ~ ('s' if states(e) | int(0) > 1 else '')] -%}{%- endif -%}
        {%- endfor -%}
        {%- for name, e in [('Water filter', 'sensor.42_french_door_water_filter_remaining'), ('Air filter', 'sensor.42_french_door_air_filter_remaining')] -%}
        {%- if states(e) | is_number and states(e) | float < 15 -%}{%- set ns.p = ns.p + [name ~ ' ' ~ states(e) ~ '% left'] -%}{%- endif -%}
        {%- endfor -%}
        {%- if is_state('binary_sensor.24_dishwasher_rinse_aid_low', 'on') -%}{%- set ns.p = ns.p + ['Rinse aid low'] -%}{%- endif -%}
        {{ ns.p | join(' · ') }}
      icon: mdi:alert-circle-outline
      icon_color: amber
      tap_action:
        action: none
      hold_action:
        action: none
      grid_options:
        columns: full
      visibility:
      - condition: or
        conditions:
        - condition: state
          entity: binary_sensor.42_french_door_service_required
          state: "on"
        - condition: state
          entity: binary_sensor.30_double_wall_oven_service_required
          state: "on"
        - condition: state
          entity: binary_sensor.24_dishwasher_service_required
          state: "on"
        - condition: numeric_state
          entity: sensor.42_french_door_active_faults
          above: 0
        - condition: numeric_state
          entity: sensor.30_double_wall_oven_active_faults
          above: 0
        - condition: numeric_state
          entity: sensor.24_dishwasher_active_faults
          above: 0
        - condition: numeric_state
          entity: sensor.42_french_door_water_filter_remaining
          below: 15
        - condition: numeric_state
          entity: sensor.42_french_door_air_filter_remaining
          below: 15
        - condition: state
          entity: binary_sensor.24_dishwasher_rinse_aid_low
          state: "on"
    - type: markdown
      content: Fridge and freezer show their **set** temperatures; the fridge doesn't report a measured one. Tap a card for its controls. The oven only starts remotely after **Remote Ready** is pressed on its panel.
