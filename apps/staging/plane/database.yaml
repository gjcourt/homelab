apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plane-db-staging-cnpg-v1
  namespace: plane-stage

spec:
  description: Postgres cluster for Plane
  # Postgres 15: what Plane ships and tests (its Compose file and chart bundle
  # 15.7). Plane documents no supported range, so moving to 17 like the other
  # apps is its own change after an upgrade test.
  imageName: ghcr.io/cloudnative-pg/postgresql:15.19

  instances: 1

  inheritedMetadata:
    labels:
      app: plane-database
      env: staging
      policy-type: "database"

  monitoring:
    enablePodMonitor: true

  # Cross-cluster spread: see apps/production/golinks/database.yaml.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          policy-type: database

  storage:
    storageClass: truenas-iscsi
    size: 2Gi

  postgresql:
    parameters:
      # Small DB on a small volume: right-size WAL as memos does.
      max_wal_size: "256MB"
      wal_keep_size: "128MB"
      max_slot_wal_keep_size: "256MB"

  # serverName versions (docs/operations/2026-05-02-cnpg-backup-recovery.md):
  #   v1 — first install, 2026-10-18. Holds the base backup and WAL up to the
  #        2026-10-19 05:54Z staging prune (fixed in #1597).
  #   v2 — used by a fresh-initdb cluster created mid-rebuild at 06:18Z, before
  #        the recovery bootstrap reached it. Empty data; don't restore from it.
  #   v3 — archive after restoring from v1. The archiver needs an empty path, so
  #        bump on every future restore or recreate.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: plane-db-staging-cnpg-v1-backup
        serverName: plane-db-staging-cnpg-v1-v3

  # Restored from v1 (plan step 6, the restore drill). No owner secret: CNPG
  # generates plane-db-staging-cnpg-v1-app, whose `uri` key becomes Plane's
  # DATABASE_URL (see release-patch.yaml).
  bootstrap:
    recovery:
      source: plane-db-backup
      database: app
      owner: app

  externalClusters:
    - name: plane-db-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: plane-db-staging-cnpg-v1-backup
          serverName: plane-db-staging-cnpg-v1-v1
