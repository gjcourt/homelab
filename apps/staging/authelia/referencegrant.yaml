# Lets HTTPRoutes in gated namespaces point their ExternalAuth filter at this
# namespace's Authelia Service (cross-namespace backendRef). Add a `from` entry
# per namespace that gets the filter. Cilium plan step 4:
# docs/plans/2026-11-04-cilium-1-20-external-auth-plan.md
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: authelia-extauth
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: navidrome-stage
  to:
    - group: ""
      kind: Service
      name: authelia
