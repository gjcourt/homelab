apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: domestique-stage
resources:
  - ../../base/domestique/
  - nfs-fitness.yaml

labels:
  - pairs:
      env: staging
      app.kubernetes.io/instance: staging
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: domestique
    patch: |
      - op: replace
        path: /metadata/name
        value: domestique-stage
