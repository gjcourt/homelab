apiVersion: v1
kind: Service
metadata:
  name: llmux
  namespace: llmux
  labels:
    app: llmux
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
    # Prometheus scrape only (ServiceMonitor). llmux serves /metrics on a
    # separate listener so the chat port can stay Open-WebUI-only.
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: 9090
  selector:
    app: llmux
