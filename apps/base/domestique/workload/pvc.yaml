# The derived-data store: SQLite at /data/domestique.sqlite (rides, routes,
# import ledger, and the bike/athlete settings George enters by hand). The
# rides are rebuildable from the read-only fitness folder by a fresh import;
# the hand-entered settings are not. No backup on staging (George,
# 2026-11-22). RWO, hence strategy: Recreate on the Deployment. 5Gi is the
# plan's unmeasured estimate (domestique staging plan §4.5).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: domestique-data
  namespace: domestique
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
