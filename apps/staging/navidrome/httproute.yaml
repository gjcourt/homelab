apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: navidrome-http
  namespace: navidrome-stage
spec:
  hostnames:
    - navidrome.stage.burntbytes.com
  parentRefs:
    - name: app-gateway-staging
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome-https
  namespace: navidrome-stage
spec:
  hostnames:
    - navidrome.stage.burntbytes.com
  parentRefs:
    - name: app-gateway-staging
      namespace: default
      sectionName: https
  rules:
    # Authelia gate via Gateway API ExternalAuth (Cilium 1.20, HTTPRoute from
    # the experimental CRD channel). Canary for the one_factor rule on this host
    # in apps/staging/authelia/configuration.yaml. Cilium plan step 4:
    # docs/plans/2026-11-04-cilium-1-20-external-auth-plan.md
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef:
              name: authelia
              namespace: authelia-stage
              port: 9091
            http:
              # Trailing slash matters: the gateway appends the original path
              # (which starts with "/") and Authelia strips exactly this prefix,
              # so without it "/favicon.ico" reaches Authelia as "favicon.ico".
              path: /api/authz/ext-authz/
              # Always sent: Host, Method, Path, Content-Length, Authorization.
              # Authelia also needs the session cookie and the original scheme.
              allowedHeaders:
                - cookie
                - x-forwarded-proto
                - x-forwarded-for
                - accept
              allowedResponseHeaders:
                - remote-user
                - remote-groups
                - remote-name
                - remote-email
      backendRefs:
        - name: navidrome
          port: 4533
    # Subsonic API: clients (and Music Assistant) authenticate with their own
    # Navidrome credentials in URL params and can't follow an Authelia login,
    # so /rest is not gated. Navidrome's Subsonic API also honours the ExtAuth
    # header (navidrome v0.61.2 server/subsonic/middlewares.go:61), so strip
    # any client-sent Remote-User here or it could be forged through this gap.
    - matches:
        - path:
            type: PathPrefix
            value: /rest
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Remote-User
      backendRefs:
        - name: navidrome
          port: 4533
