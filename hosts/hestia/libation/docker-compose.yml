# Libation — exports the owned Audible library to DRM-free M4B for Audiobookshelf.
#
# Purpose: own the content independently of Audible. Libation authenticates as
# the account owner, downloads purchased titles, and writes M4B with chapters,
# cover art and metadata already embedded — which is exactly the shape
# Audiobookshelf wants, so there is no post-processing step.
#
# Storage layout:
#   /mnt/main/apps/libation/config        — Libation settings AND the Audible
#                                           auth token. TREAT AS A SECRET: the
#                                           token is a live credential for the
#                                           Audible account. Not world-readable,
#                                           never copied into the repo.
#   /mnt/main/family/media/audiobooks     — output, and the same dataset the
#                                           Audiobookshelf PV exports over NFS.
#
# Why write here directly: the audiobookshelf PV is mounted ROX (read-only) into
# the cluster pod (audiobookshelf-audiobooks-pv-prod, 1Ti). ABS can never write
# to this share, so the producer has to run host-side. That is the correct shape
# — one writer (this container), one reader (ABS), no contention.
#
# Capacity: <100 titles, ~16T free on main as of 2026-08-16. Not a concern.
#
# ─── OPERATOR BOOTSTRAP REQUIRED BEFORE FIRST RUN ───────────────────────────
# Audible authentication is interactive: it needs the account password and an
# OTP, so it cannot be automated and is deliberately not scripted here. It is a
# ONE-TIME step, but it is NOT self-persisting: LibationCli writes
# AccountsSettings.json to /config-internal, which is ephemeral and regenerated
# from /config on every start. The login must be copied back to /config by hand
# or it is lost on the next container recreate. See README.md step 4 — do not
# improvise this command.
#
# ─── VERIFIED 2026-08-18 against the image's liberate.sh ────────────────────
# Read directly from rmcrackan/libation:13.7.8. Three things that were guessed
# at when this was written, now confirmed:
#
# 1. SLEEP_TIME semantics. The image default is -1, which means "run once, then
#    exit". Any other value loops in-container: `while true; do run; sleep
#    $SLEEP_TIME; done`. So SLEEP_TIME=86400 below is REQUIRED, not cosmetic —
#    with `restart: unless-stopped` and the default -1, the container would exit
#    after each pass, Docker would restart it, and it would immediately run
#    again. That is a hot loop against Audible's API.
#
# 2. The container's baked-in identity is 1001:1001 (image `User`), NOT the
#    APP_UID=1654 env var and NOT PUID/PGID. liberate.sh contains no
#    PUID/PGID/useradd/chown handling whatsoever — this is not a
#    linuxserver.io image, and those variables are silently ignored.
#
#    We deliberately override that with `user: "1028:100"` below. 1001 is
#    wrong for this deployment: /mnt/main/family/media/audiobooks is owned
#    1028:100 and is mode 755, so a 1001 process lands on the `other` bits —
#    it can read and traverse but cannot write, and would fail on the first
#    download after appearing to start correctly. Chowning that dataset to
#    1001 was rejected: it is shared with Audiobookshelf, and a dataset with
#    two owners is a slower problem than a one-line user override.
#
#    Running as the dataset's existing owner keeps every file under
#    audiobooks/ single-owner, and pins the identity against a future image
#    bump silently changing `User`. Audiobookshelf is unaffected either way —
#    its pod runs as 1000:1000 and reads through the `other` bits, which is
#    already how it reads the existing library.
#
# 3. LIBATION_DB_DIR=/db is deliberately left unmounted. liberate.sh checks
#    `is_mounted $LIBATION_DB_DIR` and falls back to $LIBATION_CONFIG_DIR, which
#    IS mounted — so the library database persists in /config. A separate /db
#    mount is optional tidiness, not a fix for data loss.

services:
  libation:
    # Pinned to the 13.7.8 release by INDEX digest (multi-arch safe) rather than
    # :latest — same discipline as every other workload here. Note `docker
    # manifest inspect` reports a per-platform manifest digest; the index digest
    # below came from `docker buildx imagetools inspect`, which is the one that
    # resolves correctly regardless of architecture.
    image: rmcrackan/libation:13.7.8@sha256:8a6cd5c3a532512f7871401c3c63110acf3115a3b19e744ccb118a4a99bef186
    container_name: libation
    # `unless-stopped`, deliberately, after trying `on-failure:5` and reverting.
    #
    # The failure path is real: liberate.sh `run()` does `LibationCli scan; if
    # scan fails -> exit $scan_exit`, so a failing scan (expired token, Audible
    # API change, network blip) exits without ever reaching the `sleep`. The
    # question is what should happen next.
    #
    # `on-failure:5` was wrong here. Docker's on-failure backoff is
    # 100/200/400/800/1600ms, so the entire retry budget is spent in about THREE
    # SECONDS. Any fault lasting longer than that stops the container
    # permanently, and nothing on this host alerts on container state — an
    # unattended archival job would die silently and stay dead until somebody
    # noticed missing books.
    #
    # The hot-loop fear that motivated the change does not apply. Docker resets
    # its backoff only after the container stays up ~10s; a scan that fails in
    # ~1s never earns that reset, so the interval grows to the 60s cap and stays
    # there. Observed live while unauthenticated: restarts spaced 13s, then 26s,
    # climbing. One attempt per minute against an account you own is not abuse.
    #
    # So: retry forever, bounded by backoff, and self-heal when the fault
    # clears. Check `docker ps -a --filter name=libation` if new purchases stop
    # appearing — there is still no alerting.
    restart: unless-stopped
    # Override the image's User=1001:1001 with the owner of the audiobooks
    # dataset. See note 2 in the header for why. /mnt/main/apps/libation must
    # be chown'd to match — 1001 there would break the database create.
    user: "1028:100"
    environment:
      # NOTE: PUID/PGID are deliberately absent. This is not a linuxserver.io
      # image — liberate.sh has no code that reads them, so setting them would
      # be inert and misleading. Identity is set by `user:` above, not here.
      # Host paths must be readable AND writable by 1028:100 (see README.md);
      # getting this wrong does not always fail loudly — a bad /data only
      # surfaces on the first download, long after the container looks healthy.
      - TZ=America/New_York
      # 1028 has no /etc/passwd entry in this image, so HOME resolves to `/`,
      # which it cannot write. Not currently load-bearing (the entrypoint forces
      # InProgress=/tmp) but cheap insurance against a .NET component wanting one.
      - HOME=/tmp
      # Interval between `liberate` passes. New Audible purchases are rare, so
      # this is deliberately slow — a daily sweep is plenty and keeps the
      # account's request pattern unremarkable.
      - SLEEP_TIME=86400
    volumes:
      - /mnt/main/apps/libation/config:/config
      - /mnt/main/family/media/audiobooks:/data
    # No ports: this is a headless producer with no web UI to expose. Everything
    # is driven through one-off `docker run` containers (the entrypoint execs any
    # command passed to it) or through the config directory. Note `docker exec`
    # is NOT usable before authentication — the container is not up long enough.
    network_mode: bridge
