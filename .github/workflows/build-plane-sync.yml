name: Build plane-sync

on:
  push:
    branches: [master]
    paths:
      - 'images/plane-sync/**'
      - '.github/workflows/build-plane-sync.yml'
  pull_request:
    paths:
      - 'images/plane-sync/**'
      - '.github/workflows/build-plane-sync.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gjcourt/plane-sync

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The real-repo tests (byte-identical round-trip, prettier-safe edits,
      # lab invariants after a simulated status change) run against gjcourt/lab.
      - name: Checkout gjcourt/lab
        uses: actions/checkout@v4
        with:
          repository: gjcourt/lab
          path: lab

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Test
        working-directory: images/plane-sync
        env:
          LAB_PATH: ${{ github.workspace }}/lab
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Immutable per-commit tag (date + short SHA).
      - name: Generate date-sha tag
        id: tag
        run: echo "tag=$(date -u +%Y-%m-%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/plane-sync
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### plane-sync published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pin this tag in the plane-sync CronJob (plan step 6) in a follow-up PR." >> $GITHUB_STEP_SUMMARY
