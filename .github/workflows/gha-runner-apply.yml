name: Apply gha-runner image pin

# Reconciles the hestia runner's image to the pin in
# hosts/hestia/actions-runner/docker-compose.yml (HOMELAB-106).
#
# WHY. deploy-hestia.yml excludes the runner's own compose: a job cannot
# recreate the container it is running in. Since HOMELAB-102 the runner runs
# with --disableupdate, so the Git pin is the only way it upgrades, and an
# unapplied Renovate bump ends with GitHub retiring the running version and the
# runner refusing work (the 2026-08-18 outage).
#
# HOW. This job only SCHEDULES the apply. scripts/gha-runner-apply/launch.sh
# starts a detached sibling container (through the runner's docker socket) that
# outlives the job. The sibling waits for this job to end and for the runner to
# be idle, then does app.stop -> app.update (image only) -> app.start through
# the TrueNAS middleware, verifies the runner is back online on GitHub, and
# writes homelabscope_job_*{job="gha-runner-image-apply"} to the node-exporter
# textfile. HomelabscopeGhaRunnerApplyFailed pages on a failed apply;
# HomelabscopeJobStale pages if it has not converged for 14h.
#
# It is level-triggered and idempotent: every run compares the stored config
# and the live container to the pin and does nothing when both match. The
# schedule is the retry loop, and it keeps the heartbeat fresh.
#
# Only the IMAGE is reconciled. Other edits to the runner compose are still a
# manual apply: docs/operations/apps/gha-runner.md section 6.

on:
  push:
    branches: [master]
    paths:
      - 'hosts/hestia/actions-runner/docker-compose.yml'
      - 'scripts/gha-runner-apply/**'
      - '.github/workflows/gha-runner-apply.yml'
  schedule:
    # Every 6h at :41, away from the canary (:17) and the top-of-hour spike.
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check drift and idle state, but do not stop or update the runner'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gha-runner-apply
  cancel-in-progress: false

jobs:
  schedule-apply:
    runs-on: [self-hosted, hestia]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Launch the applier
        env:
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          flag=""
          if [ "${DRY_RUN_INPUT}" = "true" ]; then flag="--dry-run"; fi
          scripts/gha-runner-apply/launch.sh hosts/hestia/actions-runner/docker-compose.yml $flag
