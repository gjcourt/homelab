views:
- title: Overview
  theme: Tinted
  path: overview
  icon: mdi:home
  type: sections
  max_columns: 3
  sections:
  # Controls-first landing (Option A): the things George touches most — room
  # volume + the lights killswitch — lead; weather sits beside the killswitch;
  # areas and a summary strip follow underneath.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Today
      heading_style: title
    # Weather + All Lights Off as SEPARATE section cards (not a horizontal-
    # stack, which forced side-by-side and clipped the wide weather card on
    # mobile). A section's grid is 12 columns per column_span, so this 3-wide
    # section has 36: 24/12 = 2/3 : 1/3 side by side on desktop. Columns are
    # capped at the grid width, so at 2 columns (24) the weather card is full
    # width, and on a phone (12) both are full width and stack.
    - type: custom:clock-weather-card
      entity: weather.forecast_home
      forecast_rows: 3
      hide_clock: false
      hide_date: false
      grid_options:
        columns: 24
    - type: custom:mushroom-template-card
      primary: All Lights Off
      secondary: "{{ states('sensor.lights_on') ~ ' on' if states('sensor.lights_on') | is_number else '— (count unavailable)' }}"
      icon: mdi:lightbulb-group-off
      icon_color: "{{ 'amber' if states('sensor.lights_on') | int(0) > 0 else 'disabled' }}"
      layout: vertical
      fill_container: true
      tap_action:
        action: perform-action
        perform_action: light.turn_off
        target:
          entity_id: all
      grid_options:
        columns: 12
      card_mod:
        style: |
          ha-card {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
          }
  # Volume ordered by how the rooms are used: Kitchen, Living Room, Office.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Music — Room Volume
      heading_style: title
    - type: tile
      entity: media_player.kitchen_snapcast_client
      name: Kitchen
      icon: mdi:silverware-fork-knife
      state_content:
      - state
      - volume_level
      features:
      - type: media-player-volume-slider
    - type: tile
      entity: media_player.living_room_snapcast_client
      name: Living Room
      icon: mdi:sofa
      state_content:
      - state
      - volume_level
      features:
      - type: media-player-volume-slider
    - type: tile
      entity: media_player.office_snapcast_client_2
      name: Office
      icon: mdi:desk
      state_content:
      - state
      - volume_level
      features:
      - type: media-player-volume-slider
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Areas
      heading_style: title
    # Mushroom template cards: clickable — tap navigates to the per-area
    # subview. Curated key rooms; full room-by-room light control (all lights
    # + dimming) lives on the Lights tab. icon_color uses a state template so
    # the icon lights up amber when any light in the room is on.
    - type: custom:mushroom-template-card
      primary: Kitchen
      # Appliance glance: the one thing worth knowing from across the house.
      secondary: "{% set off = ['Off', 'unavailable', 'unknown'] %}{% if is_state('binary_sensor.42_french_door_refrigerator_door', 'on') or is_state('binary_sensor.42_french_door_freezer_door', 'on') %}Fridge door open{% elif states('sensor.30_double_wall_oven_cooking_mode') not in off or states('sensor.30_double_wall_oven_lower_oven_cooking_mode') not in off %}Oven on{% elif states('sensor.24_dishwasher_wash_status') in ['Running', 'Drying'] %}Dishwasher running{% endif %}"
      icon: mdi:silverware-fork-knife
      icon_color: "{% set l = ['light.kitchen_main_lights', 'light.kitchen_under_cabinet', 'light.kitchen_island_pendants'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-kitchen
    - type: custom:mushroom-template-card
      primary: Front Foyer
      icon: mdi:door
      icon_color: "{% set l = ['light.front_foyer_chandelier', 'light.front_foyer_spot_lights', 'light.front_foyer_closet'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-front-foyer
    - type: custom:mushroom-template-card
      primary: Hallway
      icon: mdi:door-sliding
      icon_color: "{% set l = ['light.hallway_long', 'light.hallway_landing'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-hallway
    - type: custom:mushroom-template-card
      primary: Master Bedroom
      icon: mdi:bed
      icon_color: "{% set l = ['light.master_bedroom_main_lights', 'light.master_bedroom_entry', 'light.master_bedroom_sconce_north', 'light.master_bedroom_sconce_south', 'light.master_bedroom_closet_light'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-master-bedroom
    - type: custom:mushroom-template-card
      primary: Master Bathroom
      icon: mdi:shower
      icon_color: "{% set l = ['light.master_bathroom_vanity', 'light.master_bathroom_ceiling'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-master-bathroom
    # TODO: add `hallway_landing` area card once that Area is created in HA.
  # Summary strip — glanceable counts, tap to jump to the relevant tab.
  # Backed by template sensors in configuration.yaml (lights_on_count,
  # media_playing_count).
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Summaries
      heading_style: title
    - type: tile
      entity: sensor.lights_on
      name: Lights On
      icon: mdi:lightbulb-group
      color: amber
      tap_action:
        action: navigate
        navigation_path: lights
    - type: tile
      entity: sensor.media_playing
      name: Media Playing
      icon: mdi:play-circle
      tap_action:
        action: navigate
        navigation_path: av
- title: Control
  theme: Tinted
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Bathroom Fan Timers
      heading_style: title
    - type: markdown
      content: '**How it works:** when a bathroom exhaust fan switch turns on, a timer starts using the per-bathroom **Minutes** value. When the timer expires, the switch turns off automatically. Flipping the switch off manually cancels the timer.'
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Hall Bathroom
      heading_style: title
    - type: tile
      entity: switch.hall_bathroom_exhaust_fan
      name: Fan
      color: amber
      tap_action:
        action: toggle
    - type: tile
      entity: timer.hall_bathroom_fan_timer
      name: Timer
    - type: tile
      entity: input_number.hall_bathroom_fan_minutes
      name: Minutes
      features_position: bottom
      features:
      - type: numeric-input
    - type: custom:mushroom-template-card
      primary: Cancel timer
      icon: mdi:timer-off
      icon_color: red
      tap_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.hall_bathroom_fan_timer
      # Only while the timer is running or paused; idle has nothing to cancel.
      visibility:
      - condition: state
        entity: timer.hall_bathroom_fan_timer
        state_not: idle
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Master Bathroom
      heading_style: title
    - type: tile
      entity: switch.master_bathroom_exhaust_fan
      name: Fan
      color: amber
      tap_action:
        action: toggle
    - type: tile
      entity: timer.master_bathroom_fan_timer
      name: Timer
    - type: tile
      entity: input_number.master_bathroom_fan_minutes
      name: Minutes
      features_position: bottom
      features:
      - type: numeric-input
    - type: custom:mushroom-template-card
      primary: Cancel timer
      icon: mdi:timer-off
      icon_color: red
      tap_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.master_bathroom_fan_timer
      # Only while the timer is running or paused; idle has nothing to cancel.
      visibility:
      - condition: state
        entity: timer.master_bathroom_fan_timer
        state_not: idle
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Powder Bathroom
      heading_style: title
    - type: tile
      entity: switch.powder_bathroom_exhaust_fan
      name: Fan
      color: amber
      tap_action:
        action: toggle
    - type: tile
      entity: timer.powder_bathroom_fan_timer
      name: Timer
    - type: tile
      entity: input_number.powder_bathroom_fan_minutes
      name: Minutes
      features_position: bottom
      features:
      - type: numeric-input
    - type: custom:mushroom-template-card
      primary: Cancel timer
      icon: mdi:timer-off
      icon_color: red
      tap_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.powder_bathroom_fan_timer
      # Only while the timer is running or paused; idle has nothing to cancel.
      visibility:
      - condition: state
        entity: timer.powder_bathroom_fan_timer
        state_not: idle
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Laundry Room Lights
      heading_style: title
    - type: markdown
      content: '**How it works:** when either laundry room light turns on, a timer starts using the **Minutes** value. When the timer expires, both lights turn off. Turning both lights off manually before the timer expires cancels the timer.'
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Laundry Room
      heading_style: title
    - type: tile
      entity: light.laundry_room_main_lights
      name: Main Lights
      color: amber
      tap_action:
        action: toggle
    - type: tile
      entity: light.laundry_room_cove
      name: Cove
      color: amber
      tap_action:
        action: toggle
    - type: tile
      entity: timer.laundry_room_light_timer
      name: Timer
    - type: tile
      entity: input_number.laundry_room_light_minutes
      name: Minutes
      features_position: bottom
      features:
      - type: numeric-input
    - type: custom:mushroom-template-card
      primary: Cancel timer
      icon: mdi:timer-off
      icon_color: red
      tap_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.laundry_room_light_timer
      # Only while the timer is running or paused; idle has nothing to cancel.
      visibility:
      - condition: state
        entity: timer.laundry_room_light_timer
        state_not: idle
    - type: button
      name: Turn Off Both
      icon: mdi:lightbulb-off
      tap_action:
        action: call-service
        service: light.turn_off
        target:
          entity_id:
          - light.laundry_room_main_lights
          - light.laundry_room_cove
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Nightlight
      heading_style: title
    - type: markdown
      content: '**How it works:** at sundown, if the master Lutron switch is off, turn it on and set both chandelier LEDs to **Preset Brightness**. If the switch is already on, only LEDs that are currently off get bumped to preset; running LEDs are left alone. At the **Turn-Off Time + today''s jitter**, the master switch turns off.'
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Dining Room Chandelier
      heading_style: title
    - type: tile
      entity: switch.dining_room_chandelier
      name: Master Switch
      color: amber
      tap_action:
        action: toggle
    - type: tile
      entity: light.0xa4c138b55dac7973
      name: Central
      color: amber
    - type: tile
      entity: light.0xa4c138a9f6011cac
      name: Flowers
      color: amber
    - type: tile
      entity: sensor.nightlight_turn_off_time
      name: Off tonight
      color: blue
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Nightlight Settings
      heading_style: title
    - type: tile
      entity: input_number.nightlight_brightness
      name: Preset Brightness
      features_position: bottom
      features:
      - type: numeric-input
    - type: tile
      entity: input_datetime.nightlight_turnoff_time
      name: Turn-Off Time
    - type: tile
      entity: input_number.nightlight_random_offset
      name: Jitter (max)
      features_position: bottom
      features:
      - type: numeric-input
    - type: tile
      entity: input_number.nightlight_offset_today
      name: Jitter (today)
