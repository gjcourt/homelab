# The console's $HOME: Claude Code login (~/.claude, ~/.claude.json), tmux
# sessions' working trees, Go/npm caches. Retain: losing it means redoing the
# `claude auth login` and the Remote Control consent.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bench-console-home
  namespace: bench-cloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: truenas-iscsi
  resources:
    requests:
      storage: 30Gi
