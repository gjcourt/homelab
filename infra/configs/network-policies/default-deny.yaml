---
# Cluster-wide default-deny for Cilium, opt-in per namespace.
#
# Pods in a namespace labelled `network-policies: enforced` are put into
# default-deny for BOTH ingress and egress. Everything they need must then be
# allowed by their own per-app CiliumNetworkPolicy (DNS to kube-dns, Gateway
# ingress, backends, the API server, ...). Policies are additive, so this
# policy only switches default-deny on; it allows nothing and denies nothing
# on its own, and it never overrides a per-app allow (only explicit
# ingressDeny/egressDeny rules would).
#
# How: one empty rule per direction (`- {}`). Per the Cilium 1.19 docs, "if
# any rule selects an Endpoint and the rule has an ingress section, the
# endpoint goes into default deny-mode for ingress" (likewise egress), and an
# empty rule "put[s] an endpoint into default deny mode without whitelisting
# other peers" (docs.cilium.io/en/v1.19/security/policy/intro/ and
# .../policy/layer3/, "egress-default-deny" example). Contrast
# `fromEndpoints: [{}]`, an empty *selector*, which would allow everything.
#
# History: from 2026-05-03 until this fix the policy used `ingress: []` /
# `egress: []`. Cilium rejects that ("rule must have at least one of Ingress,
# IngressDeny, Egress, EgressDeny": an empty list has length 0, see
# pkg/policy/api/rule_validation.go), so every agent logged "Unable to add"
# and nothing was enforced, while the comment here called it "inert".
# scripts/check-cilium-policies.py (make check-cilium-policies) now catches
# that mistake.
#
# STAGED ROLLOUT: infra/configs is cluster-wide (one object for both
# environments), so staging-first comes from the selector. For now the
# policy also requires the pod's namespace to be one of the labelled STAGING
# namespaces below. The prod follow-up removes that second expression (or
# adds the -prod namespaces) once staging has soaked with
# `hubble observe --verdict DROPPED` clean. Keep the list in sync with the
# `network-policies: enforced` -stage namespaces until then.
#
# kube-system and flux-system are never labelled, so this never selects
# them; keep it that way (they would lose DNS/API traffic without their own
# allow policies).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/name: default-deny
    app.kubernetes.io/part-of: network-policies
    app.kubernetes.io/managed-by: flux
spec:
  description: >-
    Default-deny ingress and egress for pods in namespaces labelled
    `network-policies: enforced` (staging namespaces only, until the prod
    follow-up). Allows nothing itself; each app's own CiliumNetworkPolicy
    allows what it needs. See infra/configs/network-policies/README.md.
  endpointSelector:
    matchExpressions:
      # Opt-in gate: the namespace must carry `network-policies: enforced`.
      - key: k8s:io.cilium.k8s.namespace.labels.network-policies
        operator: In
        values:
          - enforced
      # Staging-first: only these namespaces until the prod follow-up.
      - key: k8s:io.kubernetes.pod.namespace
        operator: In
        values:
          - adguard-stage
          - excalidraw-stage
          - llmux-stage
          - openwebui-stage
  # One empty rule per direction: turns default-deny on, allows no peers.
  ingress:
    - {}
  egress:
    - {}
