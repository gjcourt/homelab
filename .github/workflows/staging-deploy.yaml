name: Deploy to Staging

# Rebuilds the staging branch by merging master + all passing PRs.
# Triggers:
#   - workflow_run — fires AFTER Lint / Flux-test / Bench gate finish, avoiding the
#     race where staging-deploy ran before CI completed and skipped the PR.
#   - pull_request:closed — immediately rebuild when a PR is merged/closed
#     (no pending-check race since we are removing, not adding).
#   - Every 5 minutes (cron) — safety net to catch anything missed.
#   - Manual dispatch — for ad-hoc rebuilds.
on:
  workflow_run:
    # Bench gate: a bench PR is held until bench-paths is posted, so rebuild
    # as soon as the gate has run rather than at the next 5-minute cron.
    workflows: ["Lint", "Test Flux Reconciliation", "Bench gate"]
    types: [completed]
  pull_request:
    types: [closed]
    branches: [master]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  sync-staging:
    runs-on: ubuntu-latest
    # For workflow_run events, only rebuild staging when the completed
    # workflow was triggered by a pull request (skip master-push CI runs and
    # the gate's hourly sweep). Bench gate runs on pull_request_target.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target'
    permissions:
      contents: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Checkout Master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      # For regenerating the plans index on a conflict (see Merge Passing PRs).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # For scripts/bench-gate/staging_ready.py (see Merge Passing PRs).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Staging Candidate
        run: |
          # Create a fresh branch off master
          git checkout -B staging origin/master

      - name: Merge Passing PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MERGED=0
          SKIPPED=0

          # HOMELAB-85: master's readiness check, copied out of the tree first.
          # Each PR merged below changes the working tree, so running the
          # script in place would run PR code for every PR after it.
          GATE_DIR=$(mktemp -d)
          cp scripts/bench-gate/*.py "$GATE_DIR/"

          # docs/plans/README.md holds an index generated from every plan's
          # frontmatter, so any two PRs that add or edit a plan conflict there.
          # When that file is the only conflict, regenerate the index from the
          # merged plans and complete the merge. Any other conflict, or a
          # conflict marker left outside the generated block, still fails.
          resolve_plans_index() {
            [ "$(git diff --name-only --diff-filter=U)" = "docs/plans/README.md" ] || return 1
            (cd scripts/plans-index && go run . -write) || return 1
            ! grep -qE '^(<<<<<<<|=======|>>>>>>>)' docs/plans/README.md || return 1
            git add docs/plans/README.md && git commit --no-edit
          }

          # Get every open PR targeting master. GitHub's mergeable field is not
          # used as a filter: right after master moves it reports UNKNOWN, and
          # it reports CONFLICTING for a clash in the generated plans index,
          # which the merge step below resolves. Either way, dropping the PR
          # makes Flux prune its staging namespace (2026-10-19: plane-stage was
          # deleted three times). The `git merge` below is the real conflict
          # check.
          PRS=$(gh pr list --state open --base master --json number --limit 50 \
            --jq '.[].number')

          if [ -z "$PRS" ]; then
            echo "No mergeable PRs found."
          fi

          for PR_NUM in $PRS; do
            echo "::group::PR #$PR_NUM"
            echo "Checking PR #$PR_NUM..."

            # Ready means: no check failing or pending (ignoring sync-staging,
            # this workflow's own job, and bench-approval: an unapproved bench
            # PR still previews, HOMELAB-85 decision 2). A bench-cloud PR
            # (opened or pushed to by the bot, gate.py's rule) must also HAVE a
            # bench-paths success from GitHub Actions on its head: until the
            # gate posts it, it is missing, not failing, and the PR used to go
            # in unchecked. PRs with no checks at all still preview. The script
            # prints the head SHA it judged; merge exactly that commit, so a
            # push landing mid-run can't bring in an unjudged one.
            if HEAD_SHA=$(python3 "$GATE_DIR/staging_ready.py" --pr "$PR_NUM"); then
              echo "  PR #$PR_NUM is ready at ${HEAD_SHA:0:7}. Attempting merge into staging..."

              git fetch origin "pull/$PR_NUM/head:pr-$PR_NUM"
              if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
                # Force-pushed while it was judged: the judged commit is gone.
                # The push re-runs Lint, and that run picks up the new head.
                echo "::warning::PR #$PR_NUM head ${HEAD_SHA:0:7} is no longer fetchable (force-push?); left out of this staging build."
                SKIPPED=$((SKIPPED + 1))
              elif git merge "$HEAD_SHA" --no-edit -m "Merge PR #$PR_NUM into staging"; then
                echo "  Successfully merged PR #$PR_NUM"
                MERGED=$((MERGED + 1))
              elif resolve_plans_index; then
                echo "  Merged PR #$PR_NUM (regenerated docs/plans/README.md index)"
                MERGED=$((MERGED + 1))
              else
                echo "::warning::PR #$PR_NUM conflicts with master and was left out of staging; Flux will prune anything only it adds."
                git merge --abort
                SKIPPED=$((SKIPPED + 1))
              fi
            else
              echo "  PR #$PR_NUM not ready — skipping."
              SKIPPED=$((SKIPPED + 1))
            fi
            echo "::endgroup::"
          done

          echo "### Staging build summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merged: $MERGED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skipped: $SKIPPED" >> "$GITHUB_STEP_SUMMARY"

      - name: Push to Staging
        run: |
          # Force push the new staging state
          git push origin staging --force
