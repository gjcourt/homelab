# Custom Piper voices for wyoming-piper (production): a read-only NFS mount of
# hestia's /mnt/main/voice/serve, which holds only the voice files meant to be
# served. Files are 0644, so no uid pinning is needed for the pod's UID 65534.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wyoming-piper-voices-pv-prod
  labels:
    app: wyoming-piper
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: wyoming-piper-voices
    namespace: wyoming-piper-prod
  mountOptions:
    - nfsvers=3
    - hard
    - timeo=600
    - retrans=2
    - nolock
  nfs:
    server: 10.42.2.10
    path: /mnt/main/voice/serve
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyoming-piper-voices
  namespace: wyoming-piper-prod
  labels:
    app: wyoming-piper
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
  volumeName: wyoming-piper-voices-pv-prod
  storageClassName: ""
