apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:44ee3c4e1c6d1535085e8d2b37bb345d21496a00
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
