apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # httproute.yaml is deliberately NOT deployed. The gateway's Authelia ext_authz
  # filter is not enforced (HOMELAB-90), and this site has no login of its own, so
  # the route served the full balance sheet to anyone on the LAN. Use the
  # port-forward in service.yaml until HOMELAB-90 is fixed, then restore this line.
  # - httproute.yaml
  # SOPS-encrypted, operator-created from the .example templates. CI / kustomize
  # build fails until both exist — the intended gate.
  - secret-finance-data.yaml
  - secret-ghcr.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: finance-dashboard
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: flux
