              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "thermalscope_cpu_temperature_celsius{sensor=\"Tctl\", instance=~\"$instance\"}",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "title": "CPU temperature by host (Tctl)",
          "type": "timeseries"
