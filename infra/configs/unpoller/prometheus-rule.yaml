apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: unpoller-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: unpoller
      rules:
        # Scraper liveness. The ServiceMonitor in this directory force-
        # labels its job as "unpoller" via relabelings.
        - alert: UnpollerScraperDown
          expr: up{job="unpoller"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "unpoller exporter is down"
            description: "Prometheus has not been able to scrape unpoller for 10 minutes — UniFi device metrics are stale."

        # PoE switch (USW) board temperature. unpoller exports
        # `unpoller_device_temperature_celsius` with labels:
        #   {type, site_name, name, source, temp_area, temp_type, tag}
        # For the USWED42 (rack switch) at firmware 7.4.1.16850, the
        # actual labels observed are:
        #   type="usw", temp_area="", temp_type="general", tag="board"
        # NOTE: "general" lives on `temp_type`, NOT `temp_area`. The
        # previous version of this rule filtered on temp_area="general"
        # and silently never matched. Filter on type="usw" only — the
        # switch emits exactly one temperature series, so additional
        # qualifiers aren't needed.
        # 65°C is conservative for unifi PoE switches (most are rated
        # for 0–45°C ambient).
        - alert: UniFiPoESwitchTempHigh
          expr: unpoller_device_temperature_celsius{type="usw"} > 65
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "UniFi switch {{ $labels.name }} is hot"
            description: "PoE switch {{ $labels.name }} temperature is {{ $value }}°C (threshold 65°C)."

        # Switch cooling escalation — fires when the switch's internal
        # fan controller has ramped fan_level to ≥80 (UniFi exposes a
        # 0–100 fan level; >=80 indicates sustained thermal stress
        # regardless of what the board sensor currently reads).
        - alert: UniFiSwitchFanHigh
          expr: unpoller_device_fan_level{type="usw"} >= 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "UniFi switch {{ $labels.name }} fan is ramped up"
            description: "Fan level for {{ $labels.name }} is {{ $value }} (threshold 80) — the switch is working hard to stay cool."

        # UCG-Fiber / UDM gateway temperature. Type-label coverage
        # widened to `udm|uxg|ucg|ugw` because unpoller's promunifi
        # source explicitly handles udm/usw/uap/usg but is ambiguous
        # about UCG-Fiber — it may emit as `udm` (UDM-style) or as one
        # of `ucg`/`ugw` depending on chart/exporter version. Broader
        # regex avoids silent alert failure if the actual label differs
        # from `udm`. Verify against live metrics on first scrape and
        # tighten if reality differs.
        - alert: UniFiGatewayTempHigh
          expr: unpoller_device_temperature_celsius{type=~"udm|uxg|ucg|ugw"} > 70
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "UniFi gateway {{ $labels.name }} is hot"
            description: "Gateway {{ $labels.name }} sensor {{ $labels.temp_area }} ({{ $labels.temp_type }}) is {{ $value }}°C (threshold 70°C)."

        # Synthetic "overheating" indicator — fires when any UniFi
        # device exceeds its type-specific hot threshold (PoE switch
        # 70°C / gateway 75°C). This is the rolled-up alert linked
        # from the dashboard's Overheating indicator panel.
        # NOTE: there is no native `unifi_device_overheating` metric
        # in promunifi — this is a derived signal.
        - alert: UniFiDeviceOverheating
          expr: |
            (unpoller_device_temperature_celsius{type="usw",temp_area="general"} > 70)
            or
            (unpoller_device_temperature_celsius{type=~"udm|uxg|ucg|ugw"} > 75)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "UniFi device {{ $labels.name }} is overheating"
            description: "{{ $labels.name }} ({{ $labels.type }}) at {{ $value }}°C exceeds the overheating threshold."

    # Update detection for the devices that update themselves unattended:
    # the Rack Switch (every iSCSI path to hestia crosses it) and the Home
    # gateway (UniFi OS console auto-update). Phase 2 of
    # docs/plans/2026-11-14-switch-update-observability-plan.md.
    #
    # RECORD-ONLY. `severity: info` matches neither the `critical` nor the
    # `warning` email route in infra/controllers/kube-prometheus-stack/values.yaml
    # and falls through to the default 'null' receiver. These show in Grafana and
    # in ALERTS{}, never in the inbox. Do not raise the severity here: the page
    # for a bad update is the phase 3 verifier's job, on a failed check, not on
    # the update itself.
    #
    # Known blind spot, measured 2026-11-14: Prometheus ingested nothing from
    # 03:09 to 20:55 local on 2026-11-13, right after the Rack Switch update
    # rebooted it. Both rules below need samples from inside their window, so
    # neither fired for that update — the first post-gap sample already had
    # uptime 63963s and only the new version in [2h]. A storage-path reboot
    # that blinds Prometheus is exactly what these rules cannot see.
    - name: unifi-updates
      rules:
        # unpoller exports `upgradable` 0/1 per device. Measured: the Rack
        # Switch read 1 from 00:27 to 03:09 local on 2026-11-13, ahead of the
        # 03:12 update. The Home gateway read 0 throughout its 2026-11-08
        # console OS update (5.1.34 -> 5.1.35), so do not expect this to warn
        # before gateway updates.
        - alert: UniFiUpdatePending
          expr: unpoller_device_upgradable{name=~"Rack Switch|Home"} == 1
          labels:
            severity: info
          annotations:
            summary: "UniFi device {{ $labels.name }} has a firmware update queued"
            description: "{{ $labels.name }} reports upgradable=1. If device auto-update is on, it will reboot at the next update window."

        # Opens a 30-minute window after any reboot (update, crash or power
        # loss). The phase 3 verifier keys off the same uptime signal.
        - alert: UniFiDeviceRebooted
          expr: unpoller_device_uptime_seconds{name=~"Rack Switch|Home"} < 1800
          labels:
            severity: info
          annotations:
            summary: "UniFi device {{ $labels.name }} rebooted"
            description: "{{ $labels.name }} uptime is {{ $value | humanizeDuration }}."

        # Classifies a reboot as a firmware update: more than one distinct
        # `version` in the last 2h. The `group by (name, version)` is
        # load-bearing — `unpoller_device_info` also carries `ip`, `pod` and
        # `instance`, and the Home gateway's `ip` flips between its WAN address
        # and "unknown" (4 raw series over 30d with only 2 versions). Counting
        # raw series would fire on every such flip or unpoller restart.
        - alert: UniFiFirmwareChanged
          expr: |
            count by (name) (
              group by (name, version) (
                count_over_time(unpoller_device_info{name=~"Rack Switch|Home"}[2h])
              )
            ) > 1
          labels:
            severity: info
          annotations:
            summary: "UniFi device {{ $labels.name }} changed firmware"
            description: "{{ $labels.name }} reported {{ $value }} firmware versions in the last 2h: the reboot was an update."
