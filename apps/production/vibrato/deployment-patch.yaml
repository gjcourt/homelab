apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:8716b107758bdd0e88ea6a0d0a097533c9d4017d
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
