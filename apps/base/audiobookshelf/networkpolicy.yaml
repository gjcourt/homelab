---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: network-policies
spec:
  description: Gateway ingress on pod port 13378 (service maps 3005→13378); egress DNS + Gateway VIP:443 + Authelia pods:9091 (OIDC via the Gateway; Envoy checks egress against the backend).
  endpointSelector:
    matchLabels:
      app: audiobookshelf
  ingress:
    # Gateway API. Cilium's Envoy proxy source IP is identity 8 ("ingress").
    # Same-node: "host", cross-node VXLAN: "remote-node". All three required.
    # toPorts uses the pod port (13378), not the service port (3005).
    - fromEntities:
        - host
        - remote-node
        - ingress
      toPorts:
        - ports:
            - port: "13378"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # OIDC back-channel: ABS calls the auth host for discovery, token and
    # userinfo. The overlays' hostAliases pin that hostname to a Gateway VIP
    # (prod 10.42.2.40, staging 10.42.2.42). With egress limited to DNS, the
    # browser login completed at Authelia and then failed in ABS with
    # "OPError: expected 200 OK, got: 403 Forbidden".
    # The 403 is Cilium, not Authelia: the Gateway's Envoy enforces this pod's
    # egress policy (cilium/proxy#1172, CVE-2025-30162 fix) and Hubble logs
    # `(ingress) -> cilium-gateway-...:443 http-request DROPPED`.
    # Allowing only the VIP (#1549) was NOT enough: still 403 on 2026-10-06,
    # and homepage (egress `world`:443) gets the same 403. Measured: Envoy's
    # NPDS policy for this pod allowed the VIP identity (cidr:10.42.2.40/32)
    # on 443, and Hubble logged that same identity and port on the DROPPED
    # request. So Envoy is not denying on the VIP. cilium/proxy resolves the
    # egress identity and port from the selected upstream host
    # (l7policy.cc / network_filter.cc: upstreamHost()->address()), i.e. the
    # Authelia pod on its endpoint port 9091 (cilium#47768, cilium#40538).
    # Keep both rules. Keep the CIDRs in sync with the overlays'
    # deployment-patch.yaml.
    - toCIDRSet:
        - cidr: 10.42.2.40/32
        - cidr: 10.42.2.42/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Authelia backend. The base names the plain `authelia` namespace; each
    # overlay patches it (authelia-prod / authelia-stage) so prod and stage
    # never cross. Overlays patch /spec/egress/2 — keep this rule third.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authelia
            app: authelia
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
