# Maintains the last-30-days slice of the prod photo tree for the Immich staging
# testbed. Immich's external library indexes EVERY file under its mounted path and has
# no built-in date window, so we bound the set at the filesystem: this CronJob keeps
# /mnt/main/family/media/photos-staging-30d equal to "files modified in the last 30
# days" from the full tree, and prunes anything older so the slice stays small.
#
# APPROACH — rsync-style COPY, not symlinks, not hardlinks:
#   * Symlinks are OUT: Immich explicitly does NOT follow symlinks (docs: "don't use
#     symlinks in your import libraries") — symlinked files/dirs are not scanned.
#   * Hardlinks are OUT here: a hardlink can't cross mount points (ln → EXDEV), so they
#     would only work if we mounted the REAL photos tree read-WRITE and linked within
#     it — unacceptable risk to irreplaceable originals. Rejected for safety.
#   * COPY (this job): source mounted READ-ONLY (can't harm originals), slice mounted
#     RW. Robust across any mount topology; data duplication is bounded to ~30 days,
#     which is fine for a small testbed. Copied files are indistinguishable from real
#     files to Immich. rsync -a preserves mtime so the age-based prune stays consistent.
#
# COPY MECHANISM — bulk incremental rsync, NOT a per-file shell loop:
#   The previous implementation forked `mkdir`+`cp` once PER FILE while walking the
#   multi-TB prod tree. That fork-storm never finished inside the deadline, so the job
#   was killed with DeadlineExceeded on every run and never recorded a success. We now
#   pipe the last-30-days file list into a SINGLE `rsync -a` (one process for the whole
#   slice): rsync recreates the tree, preserves mtime, and skips files already present
#   and up to date, so steady-state re-runs only transfer the day's new photos.
#   Image swapped busybox → the sibling rsync image (ghcr.io/gjcourt/immich-photos-backup,
#   Alpine + rsync 3.4.3 + bash) that immich-photos-backup / alcatraz-photos-pull use, so
#   all three photo-sync jobs share one copy mechanism. `find` (busybox applet in that
#   image) still does the date windowing at the filesystem, which Immich has no API for.
#
# After a sync, Immich must rescan the external library to index the delta. Immich's
# built-in scheduled library scan (daily, admin default) handles this; the schedule
# below runs BEFORE it. A manual/API rescan is documented in immich.md §10.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-photos-30d-sync
  namespace: immich-stage
  labels:
    app: immich
    component: photos-30d-sync
    env: staging
spec:
  # Daily at 03:00. Immich's default external-library scan runs daily; keep this
  # earlier so fresh files are present when Immich scans.
  schedule: "0 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Cap a hung NFS mount so the job can't run forever, but leave enough headroom for
      # the ONE-TIME initial seed: the first run copies the entire 30-day window into an
      # empty slice AND rsync must stat every candidate file across the multi-TB prod tree
      # over NFS. Steady-state runs are minutes (only the day's new photos transfer), but
      # the cold seed needs hours — the old 1h cap killed it as DeadlineExceeded before it
      # could ever record a success. 4h gives the seed room without letting a wedged mount
      # hang indefinitely.
      activeDeadlineSeconds: 14400
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: immich
            component: photos-30d-sync
            env: staging
        spec:
          restartPolicy: OnFailure
          # Run as root to write into the NFS slice. The slice dir must be writable by
          # this identity server-side — see the OPERATOR PREREQ in immich.md §10.
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
          containers:
            - name: sync
              # Sibling rsync image shared by immich-photos-backup / alcatraz-photos-pull
              # (Alpine 3.23 + rsync 3.4.3 + bash + busybox find). Pinned by digest to the
              # published 2026-07-04 build (public ghcr package — no pull secret needed).
              # We override the image's baked-in crond/backup entrypoint with our own
              # command; only its rsync + bash + find tooling is used here.
              image: ghcr.io/gjcourt/immich-photos-backup:2026-08-27-d482f8d@sha256:f3352d9834f993e6d4a7ee4a46dbb5bdaac9eb9709504a77fe369d74f06db480
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  SRC=/src   # full prod photo tree (read-only)
                  DST=/dst   # staging slice (read-write)

                  # KEEP is a COUNT, not a time window. The previous version took
                  # "everything modified in the last 30 days", which is unbounded:
                  # it grows with how many photos were taken, and on 2026-09-14 a
                  # genuine 30-day window was 8,049 files / 20 GB against a 20 GB
                  # quota. It could not fit, and no amount of pruning fixed that.
                  #
                  # 5000 was measured against the real tree: ~2.2 MB/file, so
                  # ~11 GB, ~55% of the 20 GB quota. The count is the setting;
                  # 50%-of-quota is only how it was chosen. Do not recompute it
                  # from the quota later — raise or lower KEEP deliberately.
                  KEEP=5000

                  echo "[30d-sync] $(date -u) start (KEEP=$KEEP newest files)"

                  # This image is Alpine/BusyBox: no GNU find -printf, no head -z,
                  # no cut -z, no comm -z. Everything below is BusyBox-native.
                  # Filenames may contain SPACES (they do), which is why the path
                  # is taken as "everything after the first space". Filenames
                  # containing NEWLINES would corrupt the list, so refuse rather
                  # than silently sync the wrong set.
                  if find "$SRC" -type f -print0 | tr -dc '\n' | grep -q .; then
                    echo "[30d-sync] ABORT: a filename contains a newline" >&2
                    exit 1
                  fi

                  cd "$SRC"
                  find . -type f -print0 \
                    | xargs -0 stat -c '%Y %n' \
                    | sort -rn \
                    | head -n "$KEEP" \
                    | cut -d' ' -f2- \
                    | sed 's|^\./||' > /tmp/keep.list
                  echo "[30d-sync] keep list: $(wc -l < /tmp/keep.list) files"

                  # PRUNE FIRST. The old script pruned AFTER rsync, so once the
                  # dataset filled, rsync exited non-zero and the prune became
                  # unreachable — a full slice stayed full forever. Pruning first
                  # frees space before anything tries to write, so a fill is
                  # self-correcting instead of permanent.
                  cd "$DST"
                  find . -type f | sed 's|^\./||' | sort > /tmp/have.list
                  sort /tmp/keep.list > /tmp/keep.sorted
                  comm -23 /tmp/have.list /tmp/keep.sorted > /tmp/delete.list
                  echo "[30d-sync] pruning $(wc -l < /tmp/delete.list) file(s) no longer in the slice"
                  while IFS= read -r f; do [ -n "$f" ] && rm -f "$DST/$f"; done < /tmp/delete.list
                  find "$DST" -depth -type d -exec rmdir {} + 2>/dev/null || true

                  # rsync exit 24 = "some files vanished before transfer" —
                  # expected and BENIGN against a live prod tree (phones add and
                  # remove photos mid-run). Anything else is fatal so backoffLimit
                  # retries and the failure stays visible.
                  rc=0
                  rsync -a --files-from=/tmp/keep.list "$SRC"/ "$DST"/ || rc=$?
                  if [ "$rc" -ne 0 ] && [ "$rc" -ne 24 ]; then
                    echo "[30d-sync] transfer failed rc=$rc" >&2
                    exit "$rc"
                  fi

                  echo "[30d-sync] $(date -u) done — slice: $(find "$DST" -type f | wc -l) files, $(du -sh "$DST" 2>/dev/null | cut -f1)"
              volumeMounts:
                - name: photos-src
                  mountPath: /src
                  readOnly: true
                - name: photos-30d
                  mountPath: /dst
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          volumes:
            - name: photos-src
              persistentVolumeClaim:
                claimName: immich-photos-src-pvc
                readOnly: true
            - name: photos-30d
              persistentVolumeClaim:
                claimName: immich-photos-pvc
