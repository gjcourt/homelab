apiVersion: v1
kind: Service
metadata:
  name: pvc-writeprobe
  namespace: monitoring
  labels: { app: pvc-writeprobe }
spec:
  selector: { app: pvc-writeprobe }
  ports:
    - { name: metrics, port: 9105, targetPort: metrics }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pvc-writeprobe
  namespace: monitoring
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app: pvc-writeprobe }
  endpoints:
    - port: metrics
      interval: 60s
