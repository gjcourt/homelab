      entity: input_number.nightlight_brightness
      primary: Preset Brightness
      icon: mdi:brightness-6
      icon_color: blue
      tap_action:
        action: more-info
      features_position: bottom
      features:
      - type: numeric-input
        style: buttons
    - type: custom:mushroom-template-card
      entity: input_datetime.nightlight_turnoff_time
      primary: Turn-Off Time
      secondary: >-
        {{ 'Not found' if expand(entity) | count == 0 else (states(entity)[:5] if states(entity) not in ['unavailable', 'unknown'] else states(entity) | capitalize) }}
      icon: mdi:clock-outline
      icon_color: blue
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: input_number.nightlight_random_offset
