apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  template:
    spec:
      # With the default ndots:5 and three search domains, every
      # *.burntbytes.com siteMonitor lookup is first tried against each
      # search domain, and a lookup that stalls on a resolver retry holds one
      # of Node's few libuv threads. ndots:2 sends external names straight to
      # the resolver; in-cluster names here are FQDNs (prometheus
      # ...svc.cluster.local) or env IPs.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      containers:
        - name: homepage
          envFrom:
            - secretRef:
                name: homepage-synology
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: home.stage.burntbytes.com
            # More libuv threads so a stalled getaddrinfo doesn't queue the
            # other tiles' lookups behind it (see dnsConfig above).
            - name: UV_THREADPOOL_SIZE
              value: "16"
