apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant-prod
resources:
  - ../../base/homeassistant/
  - httproute.yaml

labels:
  - pairs:
      env: production
      app.kubernetes.io/instance: production
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: homeassistant
    patch: |
      - op: replace
        path: /metadata/name
        value: homeassistant-prod
  # Wyoming TTS (wyoming-piper, lab brief 03-036) in this environment. Added per
  # overlay rather than in base so prod HA can only reach prod Piper and staging
  # HA only staging Piper.
  - target:
      kind: CiliumNetworkPolicy
      name: homeassistant
    patch: |
      - op: add
        path: /spec/egress/-
        value:
          toEndpoints:
            - matchLabels:
                app: wyoming-piper
                k8s:io.kubernetes.pod.namespace: wyoming-piper-prod
          toPorts:
            - ports:
                - port: "10200"
                  protocol: TCP
