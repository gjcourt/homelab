views:
- title: Overview
  theme: Tinted
  path: overview
  icon: mdi:home
  type: sections
  max_columns: 3
  sections:
  # Controls-first landing (Option A): the things George touches most — room
  # volume + the lights killswitch — lead; weather sits beside the killswitch;
  # areas and a summary strip follow underneath.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Today
      heading_style: title
    # Weather + All Lights Off as SEPARATE section cards (not a horizontal-
    # stack, which forced side-by-side and clipped the wide weather card on
    # mobile). A section's grid is 12 columns per column_span, so this 3-wide
    # section has 36: 24/12 = 2/3 : 1/3 side by side on desktop. Columns are
    # capped at the grid width, so at 2 columns (24) the weather card is full
    # width, and on a phone (12) both are full width and stack.
    - type: custom:clock-weather-card
      entity: weather.forecast_home
      forecast_rows: 3
      hide_clock: false
      hide_date: false
      grid_options:
        columns: 24
    - type: custom:mushroom-template-card
      primary: All Lights Off
      secondary: "{{ states('sensor.lights_on') ~ ' on' if states('sensor.lights_on') | is_number else '— (count unavailable)' }}"
      icon: mdi:lightbulb-group-off
      icon_color: "{{ 'amber' if states('sensor.lights_on') | int(0) > 0 else 'disabled' }}"
      layout: vertical
      fill_container: true
      tap_action:
        action: perform-action
        perform_action: light.turn_off
        target:
          entity_id: all
      grid_options:
        columns: 12
      card_mod:
        style: |
          ha-card {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
          }
  # Volume ordered by how the rooms are used: Kitchen, Living Room, Office.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Music — Room Volume
      heading_style: title
    - type: tile
      entity: media_player.kitchen_snapcast_client
      name: Kitchen
      icon: mdi:silverware-fork-knife
      state_content:
      - state
      - volume_level
      features:
      - type: media-player-volume-slider
    - type: tile
      entity: media_player.living_room_snapcast_client
      name: Living Room
      icon: mdi:sofa
      state_content:
      - state
      - volume_level
      features:
      - type: media-player-volume-slider
    - type: tile
      entity: media_player.office_snapcast_client
      name: Office
      icon: mdi:desk
      state_content:
      - state
      - volume_level
      features:
      - type: media-player-volume-slider
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Areas
      heading_style: title
    # Mushroom template cards: clickable — tap navigates to the per-area
    # subview. Curated key rooms; full room-by-room light control (all lights
    # + dimming) lives on the Lights tab. icon_color uses a state template so
    # the icon lights up amber when any light in the room is on.
    - type: custom:mushroom-template-card
      primary: Kitchen
      # Appliance glance: the one thing worth knowing from across the house.
      secondary: "{% set off = ['Off', 'unavailable', 'unknown'] %}{% if is_state('binary_sensor.42_french_door_refrigerator_door', 'on') or is_state('binary_sensor.42_french_door_freezer_door', 'on') %}Fridge door open{% elif states('sensor.30_double_wall_oven_cooking_mode') not in off or states('sensor.30_double_wall_oven_lower_oven_cooking_mode') not in off %}Oven on{% elif states('sensor.24_dishwasher_wash_status') in ['Running', 'Drying'] %}Dishwasher running{% endif %}"
      icon: mdi:silverware-fork-knife
      icon_color: "{% set l = ['light.kitchen_main_lights', 'light.kitchen_under_cabinet', 'light.kitchen_island_pendants'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-kitchen
    - type: custom:mushroom-template-card
      primary: Front Foyer
      icon: mdi:door
      icon_color: "{% set l = ['light.front_foyer_chandelier', 'light.front_foyer_spot_lights', 'light.front_foyer_closet'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-front-foyer
    - type: custom:mushroom-template-card
      primary: Hallway
      icon: mdi:door-sliding
      icon_color: "{% set l = ['light.hallway_long', 'light.hallway_landing'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-hallway
    - type: custom:mushroom-template-card
      primary: Master Bedroom
      icon: mdi:bed
      icon_color: "{% set l = ['light.master_bedroom_main_lights', 'light.master_bedroom_entry', 'light.master_bedroom_sconce_north', 'light.master_bedroom_sconce_south', 'light.master_bedroom_closet_light'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-master-bedroom
    - type: custom:mushroom-template-card
      primary: Master Bathroom
      icon: mdi:shower
      icon_color: "{% set l = ['light.master_bathroom_vanity', 'light.master_bathroom_ceiling'] %}{{ 'amber' if l | select('is_state', 'on') | list | count > 0 else ('red' if l | select('is_state', 'unavailable') | list | count > 0 else 'disabled') }}"
      tap_action:
        action: navigate
        navigation_path: area-master-bathroom
    # TODO: add `hallway_landing` area card once that Area is created in HA.
  # Summary strip — glanceable counts, tap to jump to the relevant tab.
  # Backed by template sensors in configuration.yaml (lights_on_count,
  # media_playing_count, maintenance_to_do_count, auto_shutoff_running_count).
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Summaries
      heading_style: title
    - type: tile
      entity: sensor.lights_on
      name: Lights On
      icon: mdi:lightbulb-group
      color: amber
      tap_action:
        action: navigate
        navigation_path: lights
    - type: tile
      entity: sensor.media_playing
      name: Media Playing
      icon: mdi:play-circle
      tap_action:
        action: navigate
        navigation_path: av
    # Due, overdue or never-recorded maintenance tasks (HASS-2).
    - type: tile
      entity: sensor.maintenance_to_do
      name: Maintenance
      icon: mdi:wrench-clock
      tap_action:
        action: navigate
        navigation_path: maintenance
    # Auto-shutoff timers counting down now (HASS-8).
    - type: tile
      entity: sensor.auto_shutoff_running
      name: Auto-shutoff
      icon: mdi:timer-outline
      tap_action:
        action: navigate
        navigation_path: auto-shutoff
  # Daily shot (HASS-11): today's status, the next side (pick it by hand to fix
  # a mistake) and Done, which asks first so a stray tap can't log a shot.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Daily shot
      heading_style: title
    - type: tile
      entity: sensor.daily_shot
      name: Today
      icon: mdi:needle
      state_content:
        - state
        - last_side
    - type: tile
      entity: input_select.daily_shot_next_side
      name: Next side
      features:
        - type: select-options
    - type: tile
      entity: input_button.daily_shot_done
      name: Done
      icon: mdi:check-circle
      hide_state: true
      tap_action:
        action: perform-action
        perform_action: input_button.press
        target:
          entity_id: input_button.daily_shot_done
        confirmation:
          text: Log today's shot and switch the next side?
- title: Auto-shutoff
  theme: Tinted
  path: auto-shutoff
  icon: mdi:timer-cog-outline
  type: sections
  max_columns: 3
  # HASS-7. Was the "Control" view of what is now the Config dashboard (no
  # path, so it was /home-control/1; nothing in this dashboard linked to
  # it). George, 2026-10-31: "the timers
  # all work the same way - it's just what they control is different",
  # "2 are lights, and 3 are bathrooms", "really it's like the
  # 'Auto-shutoff' page", "the nightlight is separate" (it moved to the
  # Light schedules view). Every device here turns itself off on a timer.
  # Mushroom template cards, matching the Maintenance view: icon, bold name,
  # one-line status. Status templates are YAML anchors defined on first use;
  # each names a missing or unavailable entity rather than showing a blank.
  # The set-once Auto-off after values and the "How it works" note are on
  # the "Auto-shutoff settings" subview below.
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: markdown
      content: Tap a card to switch it on or off. Hold a fan or light to cancel its timer and keep it on.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Bathrooms
      heading_style: title
    - type: custom:mushroom-template-card
      entity: switch.hall_bathroom_exhaust_fan
      primary: Hall bath fan
      secondary: &auto_off_status >-
        {#- device -> [its timer, its auto-off minutes]; the laundry lights share one -#}
        {%- set cfg = {
          'switch.hall_bathroom_exhaust_fan': ['timer.hall_bathroom_fan_timer', 'input_number.hall_bathroom_fan_minutes'],
          'switch.master_bathroom_exhaust_fan': ['timer.master_bathroom_fan_timer', 'input_number.master_bathroom_fan_minutes'],
          'switch.powder_bathroom_exhaust_fan': ['timer.powder_bathroom_fan_timer', 'input_number.powder_bathroom_fan_minutes'],
          'light.laundry_room_main_lights': ['timer.laundry_room_light_timer', 'input_number.laundry_room_light_minutes'],
          'light.laundry_room_cove': ['timer.laundry_room_light_timer', 'input_number.laundry_room_light_minutes']
        } -%}
        {%- set t = cfg.get(entity, ['', ''])[0] -%}
        {%- set mins = states(cfg.get(entity, ['', ''])[1]) | int(none) -%}
        {%- if expand(entity) | count == 0 -%}Not found
        {%- elif states(entity) in ['unavailable', 'unknown'] -%}{{ states(entity) | capitalize }}
        {%- elif is_state(entity, 'on') -%}On ·
        {%- if is_state(t, 'active') and state_attr(t, 'finishes_at') %} off in {{ ((as_datetime(state_attr(t, 'finishes_at')) - now()).total_seconds() / 60) | round(0, 'ceil') | int }} min
        {%- elif is_state(t, 'paused') %} timer paused
        {%- else %} no timer running
        {%- endif -%}
        {%- else -%}Off{{ ' · auto-off after ' ~ mins ~ ' min' if mins is not none }}
        {%- endif -%}
      icon: mdi:fan
      icon_color: &onoff_color >-
        {%- if expand(entity) | count == 0 or states(entity) in ['unavailable', 'unknown'] -%}red
        {%- elif is_state(entity, 'on') -%}amber
        {%- else -%}disabled
        {%- endif -%}
      tap_action:
        action: toggle
      icon_tap_action:
        action: more-info
      hold_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.hall_bathroom_fan_timer
    - type: custom:mushroom-template-card
      entity: switch.master_bathroom_exhaust_fan
      primary: Master bath fan
      secondary: *auto_off_status
      icon: mdi:fan
      icon_color: *onoff_color
      tap_action:
        action: toggle
      icon_tap_action:
        action: more-info
      hold_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.master_bathroom_fan_timer
    - type: custom:mushroom-template-card
      entity: switch.powder_bathroom_exhaust_fan
      primary: Powder bath fan
      secondary: *auto_off_status
      icon: mdi:fan
      icon_color: *onoff_color
      tap_action:
        action: toggle
      icon_tap_action:
        action: more-info
      hold_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.powder_bathroom_fan_timer
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Lights
      heading_style: title
    - type: custom:mushroom-template-card
      entity: light.laundry_room_main_lights
      primary: Laundry main lights
      secondary: *auto_off_status
      icon: mdi:ceiling-light
      icon_color: *onoff_color
      tap_action:
        action: toggle
      icon_tap_action:
        action: more-info
      hold_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.laundry_room_light_timer
    - type: custom:mushroom-template-card
      entity: light.laundry_room_cove
      primary: Laundry cove
      secondary: *auto_off_status
      icon: mdi:led-strip-variant
      icon_color: *onoff_color
      tap_action:
        action: toggle
      icon_tap_action:
        action: more-info
      hold_action:
        action: perform-action
        perform_action: timer.cancel
        target:
          entity_id: timer.laundry_room_light_timer
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Settings
      heading_style: title
    - type: custom:mushroom-template-card
      primary: Auto-shutoff settings
      secondary: Auto-off time for each fan and light
      icon: mdi:cog-outline
      icon_color: blue
      grid_options:
        columns: full
      tap_action:
        action: navigate
        navigation_path: auto-shutoff-settings
