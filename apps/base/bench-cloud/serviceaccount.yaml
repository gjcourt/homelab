# Identity for task Jobs. Its only cluster permission is the built-in
# read-only `view` role (rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-agent
  namespace: bench-cloud
---
# The console's identity: everything bench-agent has (read-only `view`) plus the
# right to start and stop task Jobs in THIS namespace (rbac.yaml). Kept separate
# from bench-agent on purpose — task pods run as bench-agent, so a task can
# never spawn more tasks (no chain reactions; only the console fans out).
# admission-policy.yaml enforces that: a Job here may only run as bench-agent.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bench-console
  namespace: bench-cloud
