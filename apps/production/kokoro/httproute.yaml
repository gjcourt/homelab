# LAN-only Kokoro web player: https://voice.burntbytes.com/web/ (the API is on the same host).
# Served off the *.burntbytes.com wildcard listener; not in the Cloudflare tunnel,
# so unreachable from the internet. No login yet — the gateway's Authelia
# ext_authz isn't enforcing; add a one_factor rule for this host once it is.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: kokoro-http
  namespace: kokoro-prod
spec:
  hostnames:
    - voice.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: kokoro-https
  namespace: kokoro-prod
spec:
  hostnames:
    - voice.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - name: kokoro
          port: 8880
