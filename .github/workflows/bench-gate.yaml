name: Bench gate

# HOMELAB-85. Posts two commit statuses on every open PR into master:
#   bench-paths     a bench-cloud PR stays inside scripts/bench-gate/rules.yaml
#   bench-approval  a bench-cloud PR is approved by gjcourt at its head SHA
# Both are success for any PR that is not a bench PR.
#
# Tamper-proofing (plan: docs/plans/2026-11-01-bench-homelab-paths-plan.md):
# - Every run checks out MASTER and runs master's scripts/bench-gate/. The PR
#   is read as data (API + `git fetch` / `git show`); nothing from it runs.
# - bench-cloud has no `workflows` permission, so it can't change this file,
#   and its token can't post statuses (statuses: read).
# - Only this workflow may hold `statuses: write` (lint: scripts/bench-gate/
#   lint_workflows.py, in the Lint workflow).
# - The job is named `evaluate` so no check run shares a status name.

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (empty: every open PR)"
        required: false
        default: ""
  schedule:
    - cron: "41 * * * *"

permissions:
  statuses: write
  pull-requests: read
  contents: read

concurrency:
  group: bench-gate-${{ github.event.pull_request.number || inputs.pr || 'all' }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master (never the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          if [ ! -f scripts/bench-gate/gate.py ]; then
            echo "::notice::scripts/bench-gate is not on master yet; nothing to do."
            exit 0
          fi
          if [ -n "$PR" ]; then
            python3 scripts/bench-gate/gate.py --pr "$PR"
          else
            python3 scripts/bench-gate/gate.py --all
          fi
