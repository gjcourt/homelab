apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - prometheus-rule.yaml
# The script is generated into a ConfigMap with a content-hash suffix, so any
# change to verifier.py renames the ConfigMap and rolls the Deployment onto the
# new code. No image build: it runs on the stock python image.
configMapGenerator:
  - name: update-verifier-script
    namespace: monitoring
    files:
      - verifier.py
