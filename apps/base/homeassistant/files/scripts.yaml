# Git-managed HA scripts (script: !include scripts.yaml in configuration.yaml).
# Mounted read-only from the homeassistant-config ConfigMap.

# Smart group toggle for a set of lights, used by the "All <Room> Lights" cards.
# Fixes the light.toggle-per-entity bug (mixed state scrambled instead of
# unifying) AND remembers the room's last brightness/colour.
#
# Logic:
#   - if ANY light is on  -> snapshot the current state into a per-room scene,
#                            then turn them ALL off
#   - if ALL are off      -> restore that scene (exact last brightness/colour);
#                            if none saved yet (e.g. after an HA restart) just
#                            turn them all on
#
# Lutron Caséta dimmers do NOT honour "restore last level" on a bare turn_on
# (they jump to full), so the scene snapshot is what makes "remember last
# state" work here. The scene id is derived from the entity list, so every
# group card works with no per-card config. Scenes created via scene.create
# are in-memory and reset on an HA restart (first turn-on then falls back to
# plain on).
smart_light_toggle:
  alias: Smart Light Group Toggle
  mode: parallel
  max: 25
  icon: mdi:lightbulb-group
  fields:
    entities:
      description: The light entities to toggle together (list).
      example: "[light.kitchen_main_lights, light.kitchen_island_pendants]"
  variables:
    scene_id: "restore_{{ entities[0].split('.')[1] }}"
  sequence:
    - if:
        - condition: template
          value_template: "{{ expand(entities) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
      then:
        # Some are on -> remember the current state, then turn everything off.
        - action: scene.create
          data:
            scene_id: "{{ scene_id }}"
            snapshot_entities: "{{ entities }}"
        - action: light.turn_off
          target:
            entity_id: "{{ entities }}"
      else:
        # All off -> restore the remembered state, or plain-on if none saved.
        - if:
            - condition: template
              value_template: "{{ states('scene.' ~ scene_id) not in ['unknown', 'unavailable'] }}"
          then:
            - action: scene.turn_on
              target:
                entity_id: "scene.{{ scene_id }}"
          else:
            - action: light.turn_on
              target:
                entity_id: "{{ entities }}"

# Maintenance reminders (HASS-2): set a task's last-done date by hand. Used to
# enter the first dates, and to recover from a mis-tapped Done (the replaced
# date is kept in the last-done sensor's `previous` attribute). Run it from the
# Maintenance view: it opens a form with the task and a date-time picker.
# Fires the event the task's last-done sensor listens for (configuration.yaml).
maintenance_correct_last_done:
  alias: Set a maintenance last-done date
  icon: mdi:calendar-edit
  mode: queued
  fields:
    task:
      name: Task
      description: The task's "last done" sensor.
      required: true
      selector:
        entity:
          filter:
            - integration: template
              domain: sensor
              device_class: timestamp
    when:
      name: Last done
      description: When the task was last done. Not in the future.
      required: true
      selector:
        datetime:
  sequence:
    # Only maintenance last-done sensors, and never a future date (it would
    # silently push the next reminder out).
    - if:
        - condition: template
          value_template: >
            {{ not (task | default('')).startswith('sensor.maintenance_')
               or not (task | default('')).endswith('_last_done') }}
      then:
        - stop: "Pick one of the maintenance tasks' \"last done\" sensors."
          error: true
    - if:
        - condition: template
          value_template: >
            {% set d = as_datetime(when | default(''), none) %}
            {{ d is none or (d if d.tzinfo else d.replace(tzinfo=now().tzinfo)) > now() }}
      then:
        - stop: "The last-done date must be a valid date that isn't in the future."
          error: true
    - event: maintenance_correct_last_done
      event_data:
        entity_id: "{{ task }}"
        when: "{{ when }}"

# Maintenance reminders (HASS-2): mark a task done now. The Maintenance view's
# cards are generated by auto-entities from the status sensors, and a card's
# action can only name its own entity (`this.entity_id`), so this maps
# sensor.<key> to the task's button, input_button.<key>_done.
maintenance_done:
  alias: Mark a maintenance task done
  icon: mdi:check
  mode: queued
  fields:
    task:
      name: Task
      description: The task's status sensor (sensor.maintenance_<task>).
      required: true
      selector:
        entity:
          filter:
            - integration: template
              domain: sensor
  sequence:
    - variables:
        button: "input_button.{{ (task | default('')).split('.')[-1] }}_done"
    - if:
        - condition: template
          value_template: "{{ button not in states.input_button | map(attribute='entity_id') | list }}"
      then:
        - stop: "That isn't a maintenance task."
          error: true
    - service: input_button.press
      target:
        entity_id: "{{ button }}"
