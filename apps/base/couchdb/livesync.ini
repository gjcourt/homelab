; Settings the Obsidian Self-hosted LiveSync plugin needs, from its setup guide
; (docs/setup_own_server.md in vrtmrz/obsidian-livesync). Loaded from local.d,
; ahead of the docker.ini the image's entrypoint writes for the admin user.

[couchdb]
single_node = true
max_document_size = 50000000
; Fixed server UUID. Otherwise CouchDB generates one and persists it to the
; last ini file (local.d/docker.ini, an emptyDir), so it would change on every
; restart.
uuid = a9f1496c56794636adbe5959fbf57d99

[chttpd]
require_valid_user = true
; Keep /_up open for the kubelet's readiness probe; every other path still
; requires a login (chttpd_auth.erl party_mode_handler, CouchDB 3.5).
require_valid_user_except_for_up = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
bind_address = 0.0.0.0

[cors]
; Obsidian desktop, Obsidian mobile, and LiveSync's localhost origin (from the
; plugin's setup guide). LAN-only server, so the localhost origin is low risk.
origins = app://obsidian.md, capacitor://localhost, http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET,PUT,POST,HEAD,DELETE
max_age = 3600
