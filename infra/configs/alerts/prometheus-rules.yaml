# Custom PrometheusRule alerts for homelab infrastructure.
#
# These rules address alert gaps identified in the 2026-02-28 iSCSI mass
# read-only incident where failures accumulated silently for 8–12 days:
#
#   - CNPG replica pods crashing left clusters degraded without alerting.
#   - iSCSI volumes going read-only on block-device filesystems went undetected.
#   - Loki WAL becoming read-only caused the entire log ingestion pipeline to
#     fail silently (promtail was retrying against a Loki returning HTTP 500).
#
# Prometheus discovers this rule via ruleSelector: {} (select all) and
# ruleNamespaceSelector: {} in the kube-prometheus-stack values.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-infrastructure-alerts
  namespace: monitoring
  labels:
    # Matched by kube-prometheus-stack's ruleSelector label filter (if any).
    release: kube-prometheus-stack
spec:
  groups:
    # -------------------------------------------------------------------------
    # CNPG cluster health
    #
    # Fires when a CloudNative-PG primary pod reports fewer than 2 streaming
    # replicas, indicating at least one replica is down or failing to stream.
    # cnpg_collector_replica_mode == 0 identifies the primary; replicas have
    # mode == 1 and always report 0 streaming replicas (they are the receiver).
    # -------------------------------------------------------------------------
    - name: cnpg
      rules:
        - alert: CNPGClusterDegraded
          # Fires when a cluster's primary has fewer streaming replicas than it
          # should. The expected count is derived per-cluster ((instances − 1) via
          # count of in_recovery series), so single-instance clusters (expected 0)
          # never trip. max() picks the primary's value (replicas always report 0).
          # NB: the previous expr used cnpg_collector_replica_mode==0 to try to
          # select the primary, but replica_mode is the cross-cluster replica-CLUSTER
          # flag (0 on every normal pod), so it fired on every replica and every
          # single-instance cluster — 19 false positives once metrics began flowing.
          expr: >
            max by (namespace) (cnpg_pg_replication_streaming_replicas)
            < (count by (namespace) (cnpg_pg_replication_in_recovery) - 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CNPG cluster in {{ $labels.namespace }} is missing streaming replicas"
            description: >
              The primary in namespace {{ $labels.namespace }} reports {{ $value }} streaming replica(s), fewer than the (instances − 1) expected for this cluster. A replica may be down, in CrashLoopBackOff, lagging, or hitting iSCSI I/O errors. Check: kubectl get cluster -n {{ $labels.namespace }} #magic___^_^___line
    # -------------------------------------------------------------------------
    # Node filesystem read-only
    #
    # Fires when a block-device filesystem (xfs, ext4) on the node goes
    # read-only. This is the primary signal for Synology iSCSI volumes reverting
    # to read-only mode after a session disruption.
    #
    # Filtered to real block-device fstypes only — rootfs, tmpfs, squashfs, and
    # overlay are intentionally read-only in Talos and would produce false
    # positives.
    # -------------------------------------------------------------------------
    - name: node
      rules:
        - alert: NodeFilesystemReadOnly
          expr: node_filesystem_readonly{fstype=~"xfs|ext4|ext3|ext2|btrfs"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Read-only filesystem on {{ $labels.instance }}: {{ $labels.mountpoint }}"
            description: >
              Filesystem {{ $labels.mountpoint }} (device {{ $labels.device }}, fstype {{ $labels.fstype }}) on {{ $labels.instance }} is read-only. This is the iSCSI volume read-only failure pattern. Fix: delete the pod whose PVC is backed by this device to force a CSI detach/reattach. #magic___^_^___line
    # -------------------------------------------------------------------------
    # DaemonSet pod readiness
    #
    # The built-in KubeDaemonSetRolloutStuck alert only fires on
    # scheduling/update divergence. It does NOT fire when pods are scheduled
    # and running but fail their readiness probe (0/1 Ready). This gap allowed
    # promtail to be 0/1 for 8+ days without any alert firing.
    #
    # This rule fires when the number of ready pods is less than the desired
    # scheduled count — i.e. at least one pod is running but not passing its
    # readiness probe.
    # -------------------------------------------------------------------------
    - name: daemonset
      rules:
        - alert: DaemonSetPodNotReady
          expr: >
            kube_daemonset_status_number_ready < kube_daemonset_status_desired_number_scheduled
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has pods not ready"
            description: >
              DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has only {{ $value }} ready pod(s) out of the desired scheduled count. At least one pod is running but failing its readiness probe. Check: kubectl get pods -n {{ $labels.namespace }} -l app.kubernetes.io/name={{ $labels.daemonset }} #magic___^_^___line
    # -------------------------------------------------------------------------
    # Loki push errors
    #
    # Fires when Loki returns HTTP 5xx responses to push requests. Loki returns
    # 5xx when the WAL or storage is unavailable (e.g. iSCSI read-only).
    # Promtail will silently retry, masking the failure — this alert surfaces it.
    # -------------------------------------------------------------------------
    - name: loki
      rules:
        # Recalibrated 2026-08-08. This rule was added 2026-02-27 and has been
        # DEAD CODE ever since: loki_request_duration_seconds_count was never
        # scraped (no ServiceMonitor), so it never had data to evaluate — it did
        # not fire during the 2026-02-28 incident it was written for. #1279
        # enables the scrape and brings it to life, so the threshold gets a real
        # test for the first time. `> 0` with for:5m would page critical on a
        # single transient 5xx (rate[5m] stays above zero for ~5m, marginally
        # satisfying the `for`); with 31,518 historical 500s on record, the
        # first Loki bounce would plausibly page and get silenced. Require a
        # sustained error rate instead: this is the promtail-retry-forever
        # failure mode, which is continuous, not a blip.
        - alert: LokiPushErrors
          expr: >
            rate(loki_request_duration_seconds_count{
              route="loki_api_v1_push",
              status_code=~"5.."
            }[5m]) > 0.01
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Loki is returning 5xx errors on the push endpoint"
            description: >
              Loki pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is returning HTTP {{ $labels.status_code }} errors for log push requests at a rate of {{ $value | humanize }}/s. Log ingestion is degraded. Common cause: iSCSI WAL volume is read-only. Check: kubectl logs -n monitoring loki-0 | grep -i 'read-only\|wal' #magic___^_^___line
    # -------------------------------------------------------------------------
    # Application: CrashLoopBackOff
    #
    # Fires when any container has been in CrashLoopBackOff for more than 5
    # minutes. This catches pods that restart repeatedly due to misconfiguration,
    # missing secrets, or application panics.
    # -------------------------------------------------------------------------
    - name: application
      rules:
        - alert: ContainerCrashLoopBackOff
          expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is CrashLoopBackOff"
            description: >
              Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) has been in CrashLoopBackOff for more than 5 minutes. Check logs: kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c {{ $labels.container }} --previous #magic___^_^___line
        # Fires when a container's most recent exit was an OOM kill. Combined
        # with a restart counter increase to avoid re-alerting indefinitely on
        # pods that have stabilised but whose last_terminated_reason is stale.
        - alert: ContainerOOMKilled
          expr: >
            (
              increase(kube_pod_container_status_restarts_total[1h]) > 0
            ) * on(namespace, pod, container) (
              kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            )
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOM killed"
            description: >
              Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) was killed by the OOM killer in the last hour. Increase the container's memory limit or investigate a memory leak. Check: kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }} #magic___^_^___line
        # Fires when a container sustains CPU usage above 90% of its configured
        # limit for 10+ minutes. Only matches containers with limits set.
        - alert: ContainerHighCPU
          expr: >
            (
              sum(rate(container_cpu_usage_seconds_total{image!="",container!="POD"}[5m])) by (namespace, pod, container)
              /
              sum(kube_pod_container_resource_limits{resource="cpu"}) by (namespace, pod, container)
            ) > 0.9
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} CPU > 90% of limit"
            description: >
              Container {{ $labels.container }} in pod {{ $labels.pod }} (namespace {{ $labels.namespace }}) has been using more than 90% of its CPU limit for 10+ minutes (current: {{ $value | humanizePercentage }}). Consider increasing the CPU limit or investigating a busy loop.

    # -------------------------------------------------------------------------
    # Cilium BGP session health
    #
    # LoadBalancer IPs are advertised to the UCGF via BGP from each worker
    # (Phase 4 of docs/plans/2026-03-08-bgp-rollout.md). With ECMP across 3
    # worker peers, a single peer down still serves traffic via the other 2 —
    # but two down means traffic capacity is halved and a third loss is total
    # outage.
    #
    # Cilium 1.19 exports a binary up/down gauge:
    #   cilium_bgp_control_plane_session_state{neighbor=...,vrouter=...}
    #     1 = session is Established (up)
    #     0 = anything else (idle/connect/active/etc.)
    # -------------------------------------------------------------------------
    - name: cilium-bgp
      rules:
        - alert: CiliumBGPSessionDown
          expr: cilium_bgp_control_plane_session_state == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Cilium BGP peer down to {{ $labels.neighbor }}"
            description: >
              BGP peer {{ $labels.neighbor }} (AS {{ $labels.neighbor_asn }}, vrouter {{ $labels.vrouter }}) on pod {{ $labels.pod }} is not Established for ≥2m. LB IPs advertised by this node are no longer reaching the UCGF; ECMP path count drops by one. Check the agent log: kubectl logs -n kube-system {{ $labels.pod }} #magic___^_^___line
        - alert: CiliumBGPNoPeers
          expr: absent(cilium_bgp_control_plane_session_state) or sum(cilium_bgp_control_plane_session_state == 1) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cilium has zero BGP peers Established cluster-wide"
            description: >
              No Cilium worker has a BGP session in Established state with the UCGF for ≥5m. All LoadBalancer IPs are unreachable from outside the node hosting their backing pod. This is a total LB IP outage. Check UCGF: ssh root@10.42.2.1 'vtysh -c "show bgp summary"' #magic___^_^___line
        - alert: CiliumBGPMultipleSessionsDown
          expr: sum(cilium_bgp_control_plane_session_state == 0) >= 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Cilium has {{ $value }} BGP peers down — ECMP halved or worse"
            description: >
              {{ $value }} BGP peers are not Established. ECMP path count per LB IP has dropped from 3 to ≤1; one more failure is a total outage. Investigate before traffic is affected.
    # -------------------------------------------------------------------------
    # Backups: alcatraz → hestia immich photos
    #
    # RETIRED 2026-07-04 — superseded by homelabscope. The old
    # ImmichPhotoBackupStale alert keyed off immich_photos_backup_last_success_
    # seconds, but NOTHING scraped hestia's node-exporter textfile collector
    # (:9100), so the metric was orphaned and this alert could never fire. The
    # homelabscope project (infra/configs/homelabscope/) stands up that scraper
    # and generalizes staleness across every scheduled job: immich-photos-backup
    # now writes homelabscope_job_last_success_seconds{job="immich-photos-backup"}
    # and is covered by the generic HomelabscopeJobStale (30h budget) +
    # HomelabscopeJobMetricAbsent alerts. See
    # docs/plans/2026-07-04-homelabscope.md.
    # -------------------------------------------------------------------------
    # Litestream — SQLite replication to S3 (vitals)
    #
    # The vitals CNPG cluster was retired in #1430; #1449 replaced its WAL
    # archiving with a litestream sidecar replicating /data/vitals.db to S3.
    # THE POD BEING READY SAYS NOTHING ABOUT THE BACKUP: litestream retries S3
    # errors instead of exiting, and /metrics answers 200 regardless, so a
    # revoked key or a bucket 403 leaves everything green while nothing lands
    # in S3.
    #
    # ⚠️ Litestream exposes NO "last successful sync" timestamp — checked
    # against the live 0.5.17 endpoint. The metrics available are
    # litestream_sync_count, litestream_sync_error_count, litestream_txid,
    # litestream_replica_operation_total{operation}, litestream_db_size and
    # litestream_disk_full. Everything below is built from those.
    #
    # ⚠️ TWO TRAPS THIS GROUP HAD TO DESIGN AROUND, both found in review:
    #
    #   1. `increase(...{operation="PUT"}[...]) == 0` CANNOT MATCH A MISSING
    #      SERIES. litestream creates the PUT child counter on first use, so if
    #      credentials are revoked before the container's first successful PUT
    #      the series never exists, `== 0` matches nothing, and the rule is
    #      silent in exactly the scenario it was written for. Hence `unless`,
    #      which fires when the healthy-evidence series is absent OR flat.
    #
    #   2. A COMPARISON AGAINST LOCAL WRITES CANNOT FIRE ON AN IDLE DATABASE,
    #      and this one is nearly idle. The 30m rule is therefore paired with a
    #      24h one so a database written to once a day is still covered.
    #      ⚠️ CORRECTED 2026-09-19. #1450 removed an absolute "nothing
    #      uploaded in 26h" floor on the grounds that an idle replica never
    #      uploads. That was generalised from a TWO-HOUR observation and is
    #      wrong: litestream takes its scheduled snapshot regardless of write
    #      activity — observed in staging at 00:00:01Z with no writes since
    #      21:48Z the previous evening. snapshot.interval is 24h, so a healthy
    #      replica uploads at least daily no matter how idle the database is.
    #      The floor is therefore back as LitestreamNoRecentUpload, and it is
    #      the ONLY rule that catches a broken replica on an idle database —
    #      the gap #1450 documented as unavoidable.
    #
    # Severity: prod replication failures are `critical` and reach
    # gjcourt+critical@. `warning` routes to gjcourt+alerts@, which is filtered
    # out of the inbox — the pvc-writeprobe rules record that lesson twice ("the
    # operator found the outage first, twice"). An off-site copy that stopped
    # being written is data at risk, so it pages.
    #
    # ⚠️ STAGING IS DELIBERATELY QUIETER. Alertmanager routes
    # namespace =~ ".+-stage" + severity = warning to the null receiver, so the
    # staging rule below is visible in the Prometheus/Alertmanager UI and sends
    # no mail. That is the right trade for a preview environment rebuilt from
    # master + open PRs — but it means a broken staging replica is only ever
    # found by looking, which matters because staging is where the restore is
    # meant to be rehearsed.
    # -------------------------------------------------------------------------
    - name: litestream
      rules:
        # The slow-write path. The 30m rule below cannot fire if writes arrive
        # less often than its window — and this database is nearly idle (the
        # PostgreSQL cluster it replaced held zero rows for seven months). Same
        # comparison over 24h: if ANY local write landed in a day and NOTHING
        # was uploaded in that day, replication is broken and the only copy of
        # those writes is the RWO volume.
        #
        # ⚠️ Deliberately NOT an absolute "no upload in 26h" floor. That was
        # tried TWICE and measured false both times.
        #
        # The second attempt shipped as LitestreamNoRecentUpload and was removed
        # on 2026-09-22 after paging for three days on a healthy replica. Its
        # premise — "snapshot.interval is 24h, so a healthy replica uploads at
        # least once a day even with nobody touching the database" — is not how
        # litestream 0.5.x behaves. Measured on 2026-09-22 with v0.5.17:
        #
        #   delta(litestream_txid[24h])             prod 0    stage 0
        #   increase(...operation="PUT"[24h])        stage 0
        #   litestream_replica_operation_total      prod: series absent entirely
        #
        # 66h of uptime, sidecar Ready, zero errors in the log, snapshot.interval
        # set to 24h, and no upload. An idle database produces no LTX frames, so
        # there is nothing to snapshot and no PUT ever increments. On prod the
        # counter never existed, so `unless` could not suppress anything and the
        # rule fired permanently.
        #
        # If an absolute floor is ever wanted again, it needs a synthetic write
        # (a daily heartbeat row) to make idle indistinguishable from broken —
        # not a time-only comparison against a counter that idle never moves.
        # Both rules therefore key off local writes, which means a broken
        # replica on a TRULY idle database is not detected until the next
        # write. That is a real gap, and it is bounded by the thing that
        # matters: detection is tied to data actually being at risk.
        - alert: LitestreamReplicationStalledDaily
          expr: >
            (delta(litestream_txid{namespace="vitals-prod"}[24h]) > 0)
            unless on (namespace, pod)
            (increase(litestream_replica_operation_total{namespace="vitals-prod", operation="PUT"}[24h]) > 0)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "litestream uploaded nothing in 24h despite local writes ({{ $labels.namespace }}/{{ $labels.pod }})"
            description: >
              The local SQLite database took at least one write in the last 24h and litestream has uploaded nothing to S3 in that time. Those writes exist only on the vitals-data PVC. Check `kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} -c litestream` for credential or bucket errors, then docs/operations/apps/vitals.md.
        # Sustained sync failures. A rate threshold rather than `> 0`, for the
        # reason LokiPushErrors documents: increase(...[15m]) stays above zero
        # for a full 15m after ONE transient 5xx, so `> 0` with a short `for`
        # pages on a blip and teaches the operator to ignore the alert.
        - alert: LitestreamSyncErrors
          expr: >
            rate(litestream_sync_error_count[15m]) > 0.01
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "litestream is failing to sync {{ $labels.namespace }}/{{ $labels.pod }} to S3"
            description: >
              litestream has been erroring on sync for {{ $labels.db }} in {{ $labels.namespace }} at a sustained rate for 15m. It retries rather than exiting, so the pod stays Ready and the app keeps serving while the backup falls behind. Warning rather than critical because LitestreamReplicationStalled and LitestreamReplicationStalledDaily catch the consequence; this one is the early signal.
        # Writes are landing locally but not reaching S3. `unless` (not `== 0`)
        # so that a missing PUT counter — the never-succeeded case — fires too.
        - alert: LitestreamReplicationStalled
          expr: >
            (delta(litestream_txid{namespace="vitals-prod"}[30m]) > 0)
            unless on (namespace, pod)
            (increase(litestream_replica_operation_total{namespace="vitals-prod", operation="PUT"}[30m]) > 0)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "litestream is not replicating {{ $labels.namespace }}/{{ $labels.pod }} despite local writes"
            description: >
              The local SQLite transaction id advanced in the last 30m but litestream made no PUT to S3 in the same window — the database is taking writes that are not reaching the replica, so a restore would lose them. ⚠️ This rule cannot fire on an idle database; LitestreamNoRecentUpload is the backstop for that case.
        # Silence is not health. Asserts on every metric the rules above key
        # off, NOT just one: if a litestream upgrade renames one of them, the
        # rule that depends on it goes permanently dead while a single-metric
        # guard stays quiet. litestream_replica_operation_total is deliberately
        # excluded — it legitimately does not exist until the first PUT.
        - alert: LitestreamMetricsAbsent
          expr: >
            absent(litestream_sync_count{namespace="vitals-prod"})
            or absent(litestream_txid{namespace="vitals-prod"})
            or absent(litestream_sync_error_count{namespace="vitals-prod"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "litestream metrics have disappeared for vitals-prod"
            description: >
              A metric the litestream alerts depend on has been missing for 15m. Either the sidecar is gone, the PodMonitor stopped matching, the CNP is dropping the scrape (check `up` and the :9090 ingress rule in apps/base/vitals/networkpolicy.yaml), or a litestream upgrade renamed it. While this fires, the rules that use the missing metric cannot fire at all.
        - alert: LitestreamDiskFull
          expr: >
            litestream_disk_full > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "litestream reports a full volume for {{ $labels.namespace }}/{{ $labels.pod }}"
            description: >
              litestream cannot write because a volume it uses is full, and SQLite writes will fail next. Check which one before acting — the database lives on the 1Gi vitals-data PVC, but the sidecar also writes to a 32Mi emptyDir at /tmp, and expanding the PVC does not help if /tmp is the full one.
        # Staging: same 24h comparison, warning severity. Alertmanager routes
        # staging warnings to the null receiver, so this never mails — it exists
        # so "is the rehearsal environment's replica alive?" is answerable from
        # Alertmanager instead of by exec'ing into a pod.
        - alert: LitestreamReplicationStalledStaging
          expr: >
            (delta(litestream_txid{namespace="vitals-stage"}[24h]) > 0)
            unless on (namespace, pod)
            (increase(litestream_replica_operation_total{namespace="vitals-stage", operation="PUT"}[24h]) > 0)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "staging litestream took writes but uploaded nothing in 24h"
            description: >
              The staging replica took local writes and uploaded nothing in 24h. Nothing important is lost — staging is disposable — but the restore rehearsal in docs/operations/apps/vitals.md would be rehearsing against a stale prefix.
    # -------------------------------------------------------------------------
    # Flux reconciliation health
    #
    # gotk_resource_info is an Info gauge (always 1) emitted by kube-state-metrics
    # for each Flux object, carrying a `ready` label sourced from the object's
    # Ready condition. A series with ready="False" that persists means GitOps has
    # stopped converging that object: a Kustomization stuck on a build error, a
    # HelmRelease failing to upgrade, or a GitRepository that can't fetch. Left
    # silent, the cluster drifts from Git until something else breaks loudly.
    #
    # NOTE: GA Flux controllers (helm/kustomize-controller v1) no longer expose
    # the old gotk_reconcile_condition gauge — readiness now comes from the
    # kube-state-metrics customResourceState config in
    # infra/controllers/kube-prometheus-stack/values.yaml. The namespace label is
    # `exported_namespace` (the object's namespace); `customresource_kind`
    # distinguishes the Flux kind. `for: 15m` rides out normal in-flight
    # reconciles (a HelmRelease upgrade, a transient source fetch) so only a
    # genuinely stuck object fires.
    # -------------------------------------------------------------------------
    - name: flux-reconciliation
      rules:
        - alert: FluxKustomizationNotReady
          expr: max by (name, exported_namespace) (gotk_resource_info{customresource_kind="Kustomization", ready="False"}) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Flux Kustomization {{ $labels.exported_namespace }}/{{ $labels.name }} not ready"
            description: >
              Kustomization {{ $labels.exported_namespace }}/{{ $labels.name }} has been Ready=False for >15m — Flux is no longer converging it to Git. Run `flux get kustomization {{ $labels.name }} -n {{ $labels.exported_namespace }}` and check the status message for the build/apply error.
        - alert: FluxHelmReleaseNotReady
          expr: max by (name, exported_namespace) (gotk_resource_info{customresource_kind="HelmRelease", ready="False"}) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Flux HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} not ready"
            description: >
              HelmRelease {{ $labels.exported_namespace }}/{{ $labels.name }} has been Ready=False for >15m. Run `kubectl describe helmrelease {{ $labels.name }} -n {{ $labels.exported_namespace }}`; a `flux reconcile helmrelease … --reset` clears a stalled upgrade.
        - alert: FluxGitRepositoryNotReady
          expr: max by (name, exported_namespace) (gotk_resource_info{customresource_kind="GitRepository", ready="False"}) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Flux GitRepository {{ $labels.exported_namespace }}/{{ $labels.name }} not ready"
            description: >
              GitRepository {{ $labels.exported_namespace }}/{{ $labels.name }} has been Ready=False for >15m — Flux can't fetch the source, so every Kustomization downstream is frozen at its last-applied revision. Check credentials and connectivity to the Git remote.
    # -------------------------------------------------------------------------
    # Slow-burn container restarts
    #
    # The gap this closes: kube-prometheus-stack's ContainerCrashLoopBackOff
    # keys off kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"},
    # which only becomes true once kubelet has entered *backoff* — i.e. a
    # container failing fast and repeatedly. A container that runs happily for
    # hours and then dies once is restarted immediately, never enters
    # CrashLoopBackOff, and reports Ready=True the whole time in between. That
    # class of failure was structurally invisible.
    #
    # Two live examples, both running for months with zero alerts:
    #   - democratic-csi csi-driver: 550 restarts since 2026-07-03, killed by a
    #     failing liveness probe every few hours (fixed in #1367).
    #   - truenas-iscsi-exporter: SIGSEGV roughly every 9.6h since 2026-08-17,
    #     each time after ~8h of clean operation (instrumented in #1368).
    #
    # Threshold rationale: restarts_total is per-POD, and an evicted/drained pod
    # is *replaced* (new pod, counter resets to 0) rather than restarted — so
    # node drains and rollouts do not trip this. A healthy container restarts
    # zero times. Evaluated against live cluster data at 2026-08-29, `>= 2 in
    # 24h` matched exactly the two containers above and nothing else, so this
    # ships with a measured false-positive rate of zero rather than a guess.
    #
    # `for: 1h` is deliberate dampening — this is a chronic-condition alert, not
    # a page. Severity warning routes to gjcourt+alerts@.
    # -------------------------------------------------------------------------
    - name: container-restarts
      rules:
        - alert: ContainerRestartingSlowly
          expr: >
            sum by (namespace, pod, container) (
              increase(kube_pod_container_status_restarts_total[24h])
            ) >= 2
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Container {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is restarting repeatedly"
            description: >
              {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has restarted {{ $value | printf "%.0f" }} times in 24h without ever entering CrashLoopBackOff, so ContainerCrashLoopBackOff cannot see it. The pod may be reporting Ready between restarts. Check `kubectl logs {{ $labels.pod }} -n {{ $labels.namespace }} -c {{ $labels.container }} --previous` and the container's lastState.terminated exitCode/reason.
