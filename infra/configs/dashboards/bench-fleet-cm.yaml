              "expr": "count by (playbook, outcome) (bench:job_outcome:info{playbook=~\"$playbook\", project=~\"$project\"} and on (namespace, job_name) (bench:job_created_time{playbook=~\"$playbook\", project=~\"$project\"} > time() - ${__range_s}))",
              "format": "table",
              "instant": true,
              "legendFormat": "",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Outcomes by playbook",
          "transformations": [
            {
              "id": "groupingToMatrix",
              "options": {
                "columnField": "outcome",
                "emptyValue": "zero",
                "rowField": "playbook",
                "valueField": "Value"
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 13,
          "panels": [],
