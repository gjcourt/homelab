# The concurrency cap, enforced by the API server rather than by convention:
# at most 10 task pods exist at once (plan decision 4 — 10 is the agreed
# ceiling; it started at 5). An 11th Job's pod is rejected at creation and the
# Job controller retries it with backoff, so it waits.
# Scoped to the bench-cloud-task PriorityClass so the console doesn't count.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bench-cloud-tasks
  namespace: bench-cloud
spec:
  hard:
    pods: "10"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: ["bench-cloud-task"]
