apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openwebui-stage
resources:
  - ../../base/openwebui/
  - httproute.yaml

labels:
  - pairs:
      env: staging
      app.kubernetes.io/instance: staging
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: openwebui
    patch: |
      - op: replace
        path: /metadata/name
        value: openwebui-stage
  # Chat backend: this environment's llmux only.
  - target:
      kind: ConfigMap
      name: openwebui-env
    patch: |
      - op: test
        path: /data/OPENAI_API_BASE_URL
        value: http://llmux.llmux.svc.cluster.local:8080/v1
      - op: replace
        path: /data/OPENAI_API_BASE_URL
        value: http://llmux.llmux-stage.svc.cluster.local:8080/v1
  - target:
      kind: CiliumNetworkPolicy
      name: openwebui
    patch: |
      - op: test
        path: /spec/egress/0/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: llmux
      - op: replace
        path: /spec/egress/0/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: llmux-stage
