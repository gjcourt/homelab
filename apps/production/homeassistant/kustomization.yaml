apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeassistant-prod
resources:
  - ../../base/homeassistant/
  - httproute.yaml

labels:
  - pairs:
      env: production
      app.kubernetes.io/instance: production
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: homeassistant
    patch: |
      - op: replace
        path: /metadata/name
        value: homeassistant-prod
  # Kokoro TTS (lab brief 03-036) in this environment, for the openai_tts
  # integration. Per overlay so each Home Assistant reaches only its own.
  - target:
      kind: CiliumNetworkPolicy
      name: homeassistant
    patch: |
      - op: add
        path: /spec/egress/-
        value:
          toEndpoints:
            - matchLabels:
                app: kokoro
                k8s:io.kubernetes.pod.namespace: kokoro-prod
          toPorts:
            - ports:
                - port: "8880"
                  protocol: TCP
