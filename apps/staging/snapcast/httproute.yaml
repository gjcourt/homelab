apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: snapcast-http
  namespace: snapcast-stage
spec:
  hostnames:
    - snapcast.stage.burntbytes.com
  parentRefs:
    - name: app-gateway-staging
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: snapcast-https
  namespace: snapcast-stage
spec:
  hostnames:
    - snapcast.stage.burntbytes.com
  parentRefs:
    - name: app-gateway-staging
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - name: snapcast
          port: 1780
---
# Music Assistant at music.stage (MA plan; was ma.stage until 2026-11-03).
# LAN only, not on the Cloudflare tunnel, and no Authelia rule: MA has its own
# login.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: music-assistant-http
  namespace: snapcast-stage
spec:
  hostnames:
    - music.stage.burntbytes.com
  parentRefs:
    - name: app-gateway-staging
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: music-assistant-https
  namespace: snapcast-stage
spec:
  hostnames:
    - music.stage.burntbytes.com
  parentRefs:
    - name: app-gateway-staging
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - name: snapcast
          port: 8095
