views:
- title: Overview
  theme: Tinted
  path: overview
  icon: mdi:home
  type: sections
  max_columns: 3
  sections:
  # Controls-first landing (Option A): the things George touches most — room
  # volume + the lights killswitch — lead; weather sits beside the killswitch;
  # areas and a summary strip follow underneath.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Today
      heading_style: title
    # horizontal-stack forces a true 50/50 fill (grid_options columns won't
    # stretch cards in a sections grid). Weather left, a big All Lights Off
    # killswitch right that fills its half to match the weather height.
    - type: horizontal-stack
      grid_options:
        columns: full
      # Weather ~2/3, All Lights Off ~1/3 (horizontal-stack is 50/50 by default).
      card_mod:
        style: |
          #root > *:first-child { flex-grow: 2 !important; flex-basis: 60% !important; }
      cards:
      - type: weather-forecast
        entity: weather.forecast_home
        forecast_type: daily
        show_current: true
        show_forecast: true
      - type: custom:mushroom-template-card
        primary: All Lights Off
        secondary: "{{ states('sensor.lights_on') }} on"
        icon: mdi:lightbulb-group-off
        icon_color: "{{ 'amber' if states('sensor.lights_on') | int(0) > 0 else 'disabled' }}"
        layout: vertical
        fill_container: true
        tap_action:
          action: perform-action
          perform_action: light.turn_off
          target:
            entity_id: all
        card_mod:
          style: |
            ha-card {
              height: 100%;
              display: flex;
              align-items: center;
              justify-content: center;
            }
  # Volume ordered by how the rooms are used: Kitchen, Living Room, Office.
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Music — Room Volume
      heading_style: title
    - type: tile
      entity: media_player.kitchen_snapcast_client
      name: Kitchen
      icon: mdi:silverware-fork-knife
      features:
      - type: media-player-volume-slider
    - type: tile
      entity: media_player.living_room_snapcast_client
      name: Living Room
      icon: mdi:sofa
      features:
      - type: media-player-volume-slider
    - type: tile
      entity: media_player.office_snapcast_client
      name: Office
      icon: mdi:desk
      features:
      - type: media-player-volume-slider
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Areas
      heading_style: title
    # Mushroom template cards: clickable — tap navigates to the per-area
    # subview. Curated key rooms; full room-by-room light control (all lights
    # + dimming) lives on the Lights tab. icon_color uses a state template so
    # the icon lights up amber when any light in the room is on.
    - type: custom:mushroom-template-card
      primary: Kitchen
      icon: mdi:silverware-fork-knife
      icon_color: "{{ 'amber' if ['light.kitchen_main_lights', 'light.kitchen_under_cabinet', 'light.kitchen_island_pendants'] | select('is_state', 'on') | list | count > 0 else 'disabled' }}"
      tap_action:
        action: navigate
        navigation_path: area-kitchen
    - type: custom:mushroom-template-card
      primary: Front Foyer
      icon: mdi:door
      icon_color: "{{ 'amber' if ['light.front_foyer_chandelier', 'light.front_foyer_spot_lights'] | select('is_state', 'on') | list | count > 0 else 'disabled' }}"
      tap_action:
        action: navigate
        navigation_path: area-front-foyer
    - type: custom:mushroom-template-card
      primary: Hallway
      icon: mdi:door-sliding
      icon_color: "{{ 'amber' if ['light.hallway_long', 'light.hallway_landing'] | select('is_state', 'on') | list | count > 0 else 'disabled' }}"
      tap_action:
        action: navigate
        navigation_path: area-hallway
    - type: custom:mushroom-template-card
      primary: Master Bedroom
      icon: mdi:bed
      icon_color: "{{ 'amber' if ['light.master_bedroom_main_lights', 'light.master_bedroom_entry', 'light.master_bedroom_sconce_north', 'light.master_bedroom_sconce_south'] | select('is_state', 'on') | list | count > 0 else 'disabled' }}"
      tap_action:
        action: navigate
        navigation_path: area-master-bedroom
    - type: custom:mushroom-template-card
      primary: Master Bathroom
      icon: mdi:shower
      icon_color: "{{ 'amber' if ['light.master_bathroom_vanity', 'light.master_bathroom_ceiling'] | select('is_state', 'on') | list | count > 0 else 'disabled' }}"
      tap_action:
        action: navigate
        navigation_path: area-master-bathroom
    # TODO: add `hallway_landing` area card once that Area is created in HA.
  # Summary strip — glanceable counts, tap to jump to the relevant tab.
  # Backed by template sensors in configuration.yaml (lights_on_count,
  # media_playing_count).
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Summaries
      heading_style: title
    - type: tile
      entity: sensor.lights_on
      name: Lights On
      icon: mdi:lightbulb-group
      color: amber
      tap_action:
        action: navigate
        navigation_path: lights
    - type: tile
      entity: sensor.media_playing
      name: Media Playing
      icon: mdi:play-circle
      tap_action:
        action: navigate
        navigation_path: av
- title: Control
  theme: Tinted
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Bathroom Fan Timers
      heading_style: title
    - type: markdown
      content: '**How it works:** when a bathroom exhaust fan switch turns on, a timer starts using the per-bathroom **Minutes** value. When the timer expires, the switch turns off automatically. Flipping the switch off manually cancels the timer.'
  - type: grid
    column_span: 1
    cards:
    - type: heading
      heading: Hall Bathroom
      heading_style: title
    - type: tile
      entity: switch.hall_bathroom_exhaust_fan
      name: Fan
      color: amber
      tap_action:
        action: toggle
    - type: tile
      entity: timer.hall_bathroom_fan_timer
      name: Timer
    - type: tile
      entity: input_number.hall_bathroom_fan_minutes
      name: Minutes
      features_position: bottom
      features:
      - type: numeric-input
    - type: button
      name: Cancel Timer
      icon: mdi:timer-off
      tap_action:
        action: call-service
        service: timer.cancel
        data:
          entity_id: timer.hall_bathroom_fan_timer
