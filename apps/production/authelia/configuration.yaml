theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml
    watch: true

access_control:
  default_policy: bypass
  rules:
    # Health endpoints probed by Homepage's siteMonitor (no browser, no session).
    # They must stay reachable through the gateway's ExternalAuth gate, and expose
    # nothing beyond up/down. Listed first: Authelia applies the first match.
    - domain: "prometheus.burntbytes.com"
      policy: bypass
      resources:
        - "^/-/healthy$"
    - domain: "alerts.burntbytes.com"
      policy: bypass
      resources:
        - "^/-/healthy$"
    - domain: "ladder.burntbytes.com"
      policy: bypass
      resources:
        - "^/api/edgar/health$"
    # Every hostname that routes to Navidrome gets a one_factor rule. The gated
    # route sets Remote-User for Navidrome's SSO; /rest and /auth are ungated
    # (apps/production/navidrome/httproute.yaml).
    - domain: "navidrome.burntbytes.com"
      policy: one_factor
    - domain: "alerts.burntbytes.com"
      policy: one_factor
    - domain: "prometheus.burntbytes.com"
      policy: one_factor
    - domain: "ladder.burntbytes.com"
      policy: one_factor
    - domain: "finance.burntbytes.com"
      policy: one_factor
    # Open WebUI (chat.burntbytes.com) fronts a funded Anthropic API key, so the
    # gateway must authenticate every request before it reaches the pod.
    - domain: "chat.burntbytes.com"
      policy: one_factor
    # plane-mobile does its own OIDC sign-in (client plane-mobile below) and
    # enforces it on /api/*; the static shell (/, manifest.webmanifest,
    # sw.js, /static/) is public by design (George, 2026-10-26). Explicit
    # bypass so a later default_policy change can't put forward-auth in
    # front of the app's own sign-in flow. LAN and WireGuard only.
    - domain: "desk.burntbytes.com"
      policy: bypass
    - domain: "auth.burntbytes.com"
      policy: bypass
      resources:
        - "^/api/oidc/.*$"
    - domain: "auth.burntbytes.com"
      policy: one_factor

session:
  name: authelia_session
  same_site: lax
  # Multi-domain form (replaces the deprecated top-level `domain`). authelia_url
  # lets the authz endpoints answer an unauthenticated request with a 302 to the
  # portal instead of a bare 401; the gateway's ExternalAuth filter relies on it.
  # Same cookie name and domain as before, so existing sessions stay valid.
  # Same change as staging (#1826).
  cookies:
    - domain: burntbytes.com
      authelia_url: https://auth.burntbytes.com
  expiration: 1h
  inactivity: 15m
  remember_me: 30d

storage:
  local:
    path: /config/db.sqlite3

notifier:
  smtp:
    address: submissions://smtp.gmail.com:465
    username: gjcourt@gmail.com
    sender: "Authelia <gjcourt@gmail.com>"
    subject: "[Authelia] {title}"
    disable_require_tls: false

telemetry:
  metrics:
    enabled: true
    address: tcp://0.0.0.0:9959

identity_providers:
  oidc:
    jwks:
      - key: |
          {{ env "OIDC_JWKS_KEY" | nindent 14 }}
        algorithm: RS256
    lifespans:
      access_token: 1h
      id_token: 1h
      refresh_token: 720h
    clients:
      - client_id: immich
        client_name: Immich
        client_secret: '$pbkdf2-sha512$310000$gLTQr4wXrVsILURMfIYP.w$31SWWVagnN5T8vomT8saWHSfGpuXRgqy.PGU0e9Fr/kREgGaUrKUivliJJ/P8UCkzcgWoRU.0WKhQBdXmLY.zQ'
        public: false
        authorization_policy: two_factor
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - app.immich:///oauth-callback
          - https://photos.burntbytes.com/auth/login
          - https://photos.burntbytes.com/user-settings
        scopes:
          - email
          - openid
          - profile
        userinfo_signed_response_alg: none
      - client_id: mealie
        client_name: Mealie
        client_secret: '$pbkdf2-sha512$310000$12BKlQUaHPemvEEJvSwUcg$zkxW/lBSAq9qOUFRmJtj5/biYyKLTMDrCLR/lVcJU7keEhyN.JK1wGY/00QHO2n/rcmP8NT9mR1TA8a9n48v8g'
        public: false
        authorization_policy: two_factor
        token_endpoint_auth_method: client_secret_basic
        redirect_uris:
          # New primary hostname (food.burntbytes.com). The mealie.burntbytes.com
          # entries are kept during the 301-redirect transition and removed in cleanup.
          - https://food.burntbytes.com/login
          - https://food.burntbytes.com/login?direct=1
          - https://mealie.burntbytes.com/login
          - https://mealie.burntbytes.com/login?direct=1
        scopes:
          - email
          - groups
          - openid
          - profile
        userinfo_signed_response_alg: none
      - client_id: memos
        client_name: Memos
        client_secret: '$pbkdf2-sha512$310000$g9/0sjF27Sl/aIUTbJdq3w$h4cvRLnPPJQBS8UhE17k8fQBgnWQTPi2wz9sHbEVQ29VK2sQ7Ubon8ihcyL8DMtUj2T6yVgFWNBNbqFr/Q/6sw'
        public: false
        authorization_policy: two_factor
        # Memos uses client_secret_post (credentials in POST body)
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - https://memos.burntbytes.com/auth/callback
        scopes:
          - email
          - openid
          - profile
        userinfo_signed_response_alg: none
      - client_id: audiobookshelf
        client_name: Audiobookshelf
        client_secret: '$pbkdf2-sha512$310000$.M5Nzj9KEhlNtcApIFTeuA$pnPEvrYyNhzYtuthY/4auPmz7KiyuUkXr/8Ipomc19AGHZxcDs4yMKY7uVZYmgeBzS6WVj3N8gxKZMFjNkhaCg'
        public: false
        authorization_policy: two_factor
        token_endpoint_auth_method: client_secret_basic
        redirect_uris:
          - https://audiobooks.burntbytes.com/auth/openid/callback
          - https://audiobooks.burntbytes.com/audiobookshelf/auth/openid/callback
        scopes:
          - email
          - openid
          - profile
        userinfo_signed_response_alg: none
      - client_id: linkding
        client_name: Linkding
        client_secret: '$pbkdf2-sha512$310000$Hq0OAAyA19598ZQx8/4SWA$Ndwbf3BIVY7S8xyGK6VoEKyR1R2WMqkL8.rEidHXsZWZMsb2KETR7d3LZHNZH1miH2/eS/oDIGNbGu414xW0BQ'
        public: false
        authorization_policy: two_factor
        token_endpoint_auth_method: client_secret_post
        redirect_uris:
          - https://links.burntbytes.com/oidc/callback/
        scopes:
          - email
          - openid
          - profile
        userinfo_signed_response_alg: none
      # plane-mobile (desk.burntbytes.com), as on staging. The app sends PKCE
      # S256 and authenticates with HTTP Basic; scopes are openid + profile
      # (preferred_username). PLACEHOLDER client_secret: George replaces it
      # with the pbkdf2 digest whose plaintext goes in the plane-mobile Secret
      # (apps/production/plane-mobile/secret-plane-mobile.yaml.example), in the
      # same commit as that Secret. The placeholder is not a valid digest and
      # must not reach a running Authelia; the missing Secret file keeps
      # `kustomize build apps/production` failing until then.
      - client_id: plane-mobile
        client_name: plane-mobile
        client_secret: '$pbkdf2-sha512$310000$REPLACE-ME$REPLACE-ME'
        public: false
        authorization_policy: two_factor
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: client_secret_basic
        redirect_uris:
          - https://desk.burntbytes.com/auth/callback
        scopes:
          - openid
          - profile
        userinfo_signed_response_alg: none
