apiVersion: v1
kind: ConfigMap
metadata:
  name: thermalscope-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  thermalscope.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Is anything in the rack too hot, worn out, or not reporting?",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Modem",
          "tooltip": "",
          "type": "link",
          "url": "/d/modemscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Cluster net",
          "tooltip": "",
          "type": "link",
          "url": "/d/netscope-overview"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Storage",
          "tooltip": "",
          "type": "link",
          "url": "/d/storage"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Bench fleet",
          "tooltip": "",
          "type": "link",
          "url": "/d/bench-fleet"
        },
        {
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Jobs",
          "tooltip": "",
          "type": "link",
          "url": "/d/homelabscope"
        }
      ],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Worst of: CPU Tctl (warm 75, hot 85), NVMe composite (55/65), PoE switch (70/75), gateway (70/75). No data if every source is missing.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                },
                {
                  "options": {
                    "0": {
                      "color": "green",
                      "index": 0,
                      "text": "All OK"
                    },
                    "1": {
                      "color": "orange",
                      "index": 1,
                      "text": "WARM"
                    },
                    "2": {
                      "color": "red",
                      "index": 2,
                      "text": "HOT"
                    }
                  },
                  "type": "value"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 0
          },
          "id": 901,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(label_replace(max(((thermalscope_cpu_temperature_celsius{sensor=\"Tctl\"}) >= bool 75) + ((thermalscope_cpu_temperature_celsius{sensor=\"Tctl\"}) >= bool 85)),\"k\",\"cpu\",\"\",\"\") or label_replace(max(((thermalscope_nvme_temperature_celsius{sensor=\"Composite\"}) >= bool 55) + ((thermalscope_nvme_temperature_celsius{sensor=\"Composite\"}) >= bool 65)),\"k\",\"nvme\",\"\",\"\") or label_replace(max(((unpoller_device_temperature_celsius{type=\"usw\"}) >= bool 70) + ((unpoller_device_temperature_celsius{type=\"usw\"}) >= bool 75)),\"k\",\"sw\",\"\",\"\") or label_replace(max(((unpoller_device_temperature_celsius{type=~\"udm|uxg|ucg|ugw\"}) >= bool 70) + ((unpoller_device_temperature_celsius{type=~\"udm|uxg|ucg|ugw\"}) >= bool 75)),\"k\",\"gw\",\"\",\"\"))",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Thermal status",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Hottest CPU control temperature across hosts. Warm 75, hot 85 (Tjmax advisory 95).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": -1000000000
                  },
                  {
                    "color": "orange",
                    "value": 75
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              },
              "unit": "celsius"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 4,
            "y": 0
          },
          "id": 902,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(1, thermalscope_cpu_temperature_celsius{sensor=\"Tctl\"})",
              "instant": true,
              "legendFormat": "{{instance}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Hottest CPU (Tctl)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Hottest NVMe composite temperature. Warm 55, hot 65 (drive crit thresholds are 82-88 C).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": -1000000000
                  },
                  {
                    "color": "orange",
                    "value": 55
                  },
                  {
                    "color": "red",
                    "value": 65
                  }
                ]
              },
              "unit": "celsius"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 9,
            "y": 0
          },
          "id": 903,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(1, thermalscope_nvme_temperature_celsius{sensor=\"Composite\"})",
              "instant": true,
              "legendFormat": "{{instance}} {{device}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Hottest NVMe drive",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Hottest UniFi gateway or switch. Warm 70, hot 75 (the old dashboard coloured 60 C orange).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": -1000000000
                  },
                  {
                    "color": "orange",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 75
                  }
                ]
              },
              "unit": "celsius"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 14,
            "y": 0
          },
          "id": 904,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(1, unpoller_device_temperature_celsius{type=~\"udm|uxg|ucg|ugw|usw\"})",
              "instant": true,
              "legendFormat": "{{name}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Hottest network gear",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Highest NVMe endurance used. Amber 70%, red 85%. Critical-warning flags and media errors are in the NVMe row below.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": -1000000000
                  },
                  {
                    "color": "orange",
                    "value": 0.7
                  },
                  {
                    "color": "red",
                    "value": 0.85
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 19,
            "y": 0
          },
          "id": 905,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "topk(1, thermalscope_nvme_percentage_used_ratio)",
              "instant": true,
              "legendFormat": "{{instance}} {{device}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Worst NVMe wear",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "thermalscope hwmon collectors that are down. 0 = every host reports.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 0,
            "y": 5
          },
          "id": 906,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "count(thermalscope_hwmon_up) - sum(thermalscope_hwmon_up)",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Collectors not reporting",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Smallest margin to the advisory Tjmax ($cpu_tjmax C). Amber below 20, red below 10.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": -1000000000
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "green",
                    "value": 20
                  }
                ]
              },
              "unit": "celsius"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 6,
            "y": 5
          },
          "id": 907,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "min($cpu_tjmax - thermalscope_cpu_temperature_celsius{sensor=\"Tctl\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "CPU headroom to Tjmax (min)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Measured draw of everything on the USP PDU Pro. Informational.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "watt"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 12,
            "y": 5
          },
          "id": 908,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(unpoller_device_outlet_ac_power_consumption{name=\"USP PDU Pro\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Wall power now (PDU)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "description": "Now-watts x 720 h x $cost_per_kwh. An estimate, not a bill.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "match": "null+nan",
                    "result": {
                      "color": "#6c7480",
                      "index": 99,
                      "text": "No data"
                    }
                  },
                  "type": "special"
                }
              ],
              "noValue": "No data",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#6c7480",
                    "value": null
                  },
                  {
                    "color": "text",
                    "value": -1000000000
                  }
                ]
              },
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 3,
            "w": 6,
            "x": 18,
            "y": 5
          },
          "id": 909,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
