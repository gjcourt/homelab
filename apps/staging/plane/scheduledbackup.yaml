# Daily base backup, plus one at creation so step 6's restore drill has a
# base backup to restore from without waiting for 02:30.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: plane-db-staging-cnpg-v1-backup
  namespace: plane-stage
spec:
  cluster:
    name: plane-db-staging-cnpg-v1
  # 6-field cron: seconds minutes hours dom month dow
  schedule: "0 30 2 * * *"
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
