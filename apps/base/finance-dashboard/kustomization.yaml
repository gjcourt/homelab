apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # Gated by Authelia via the route's ExternalAuth filter (HOMELAB-90). This site
  # has no login of its own: never deploy the route without that filter.
  - httproute.yaml
  # SOPS-encrypted, operator-created from the .example templates. CI / kustomize
  # build fails until both exist — the intended gate.
  - secret-finance-data.yaml
  - secret-ghcr.yaml
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: finance-dashboard
      app.kubernetes.io/component: web
      app.kubernetes.io/part-of: homelab
      app.kubernetes.io/managed-by: flux
