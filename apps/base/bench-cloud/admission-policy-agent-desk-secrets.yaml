# What agent-desk may do to Secrets in bench-cloud (agent sessions plan,
# step 2). Its RBAC (rbac.yaml, agent-sessions-token-writer) is create and
# delete on any Secret there, the tightest RBAC allows. This narrows it to the
# per-Job session tokens. George, 2026-11-22, on homelab#2006: "Add the
# restriction (Recommended)": an admission policy refuses any agent-desk
# delete of a bench-cloud Secret that isn't a session token.
#
# For requests from either agent-desk service account:
# - CREATE: only an Opaque Secret labelled agent-sessions/token=true and
#   named *-session;
# - UPDATE: never (agent-desk has no update right either; this holds if one
#   is ever added);
# - DELETE: only a Secret already labelled agent-sessions/token.
# Everyone else is untouched by this policy.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bench-cloud-agent-desk-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: bench-cloud
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: agent-desk
      expression: >-
        request.userInfo.username in ['system:serviceaccount:agent-desk:agent-desk', 'system:serviceaccount:agent-desk-stage:agent-desk']
  validations:
    - expression: >-
        request.operation == 'CREATE' && object.type == 'Opaque' && has(object.metadata.labels) && 'agent-sessions/token' in object.metadata.labels && object.metadata.labels['agent-sessions/token'] == 'true' && object.metadata.name.endsWith('-session') || request.operation == 'DELETE' && has(oldObject.metadata.labels) && 'agent-sessions/token' in oldObject.metadata.labels
      message: "agent-desk may only create and delete agent-sessions token Secrets in bench-cloud (George, 2026-11-22)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bench-cloud-agent-desk-secrets
spec:
  policyName: bench-cloud-agent-desk-secrets
  validationActions: ["Deny"]
