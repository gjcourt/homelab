# ⚠️ PLAINTEXT UNTIL ENCRYPTED. Run before staging this file:
#     sops -e -i apps/production/openwebui/secret-anthropic.yaml
#
# Production only — deliberately NOT in apps/base/, because apps/staging/openwebui
# builds from the same base and must not hold a funded API key. The deployment's
# envFrom marks this secretRef `optional: true`, so openwebui-stage starts without
# it and simply cannot reach a paid API.
#
# OPENAI_API_KEY   the Anthropic key. Open WebUI has no native Anthropic connector;
#                  it reaches Anthropic through the OpenAI-SDK compatibility layer
#                  at https://api.anthropic.com/v1, so the key travels in the
#                  OpenAI-named variable as a bearer token.
# WEBUI_SECRET_KEY signs session JWTs. If unset, Open WebUI generates one at boot
#                  into /app/backend/.webui_secret_key — the container's ephemeral
#                  layer, NOT the PVC — so every restart logs all users out.
#                  Regenerate with: python3 -c "import secrets;print(secrets.token_urlsafe(48))"
