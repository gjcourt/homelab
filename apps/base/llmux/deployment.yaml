apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmux
  namespace: llmux
  labels:
    app: llmux
spec:
  # Stateless proxy; one replica is enough for household chat traffic.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: llmux
  template:
    metadata:
      labels:
        app: llmux
    spec:
      serviceAccountName: llmux
      automountServiceAccountToken: false
      # No imagePullSecrets: the ghcr.io/gjcourt/llmux package is public
      # (verified 2026-09-25 with an anonymous pull).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llmux
          # Date-sha tag from llmux's image workflow (master 17d57a1: Anthropic
          # provider, web search (streamed requests only), citations,
          # Prometheus metrics on :9090).
          image: ghcr.io/gjcourt/llmux:2026-09-25-17d57a1
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: llmux-env
            # SOPS-encrypted in the production overlay only
            # (apps/production/llmux/secret-anthropic.yaml). optional: staging
            # has no key yet — whether it gets a low-spend one is an open
            # decision — and must still start. With no key, llmux disables the
            # Anthropic port rather than failing.
            - secretRef:
                name: llmux-anthropic
                optional: true
          # Readiness: HTTP /healthz, tight — gates traffic.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: a distinct signal (TCP accept, not the HTTP handler) with
          # the repo's loose locked timings, so only a process that stops
          # accepting connections for ~2 minutes is restarted
          # (docs/operations/2026-05-02-adding-an-app.md#health-probes).
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # Writable scratch in case the Go runtime or a dependency needs
            # os.TempDir(); the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
