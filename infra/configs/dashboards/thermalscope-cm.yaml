            "y": 8
          },
          "id": 911,
          "options": {
            "legend": {
              "calcs": [],
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max by (instance) (thermalscope_nvme_temperature_celsius{sensor=\"Composite\", instance=~\"$instance\"})",
              "legendFormat": "{{instance}}",
              "refId": "A"
