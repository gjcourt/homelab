apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: navidrome-http
  namespace: navidrome-prod
spec:
  hostnames:
    # navidrome. is the new name. music. stays until Music Assistant takes it
    # in MA plan step 2 (docs/plans/2026-10-12-music-assistant.md).
    - navidrome.burntbytes.com
    - music.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: navidrome-https
  namespace: navidrome-prod
spec:
  hostnames:
    # navidrome. is the new name. music. stays until Music Assistant takes it
    # in MA plan step 2 (docs/plans/2026-10-12-music-assistant.md).
    - navidrome.burntbytes.com
    - music.burntbytes.com
  parentRefs:
    - name: app-gateway-production
      namespace: default
      sectionName: https
  rules:
    - backendRefs:
        - name: navidrome
          port: 4533
