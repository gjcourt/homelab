apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibrato
  namespace: vibrato
spec:
  template:
    spec:
      containers:
        - name: vibrato
          image: ghcr.io/gjcourt/vibrato:661e496e2230edb7519ccb0c3516e85642d3bac5
          env:
            - name: LEVA_NODE_ID
              value: "espresso"
