apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openwebui-prod
resources:
  - ../../base/openwebui/
  # SOPS-encrypted; operator-created from secret-anthropic.yaml.example.
  # Production ONLY — staging builds from the same base and must not hold a
  # funded API key (the deployment marks this secretRef optional).
  - secret-anthropic.yaml
  - httproute.yaml

labels:
  - pairs:
      env: production
      app.kubernetes.io/instance: production
    includeSelectors: false

patches:
  - target:
      kind: Namespace
      name: openwebui
    patch: |
      - op: replace
        path: /metadata/name
        value: openwebui-prod
  # Chat backend: this environment's llmux only.
  - target:
      kind: ConfigMap
      name: openwebui-env
    patch: |
      - op: test
        path: /data/OPENAI_API_BASE_URL
        value: http://llmux.llmux.svc.cluster.local:8080/v1
      - op: replace
        path: /data/OPENAI_API_BASE_URL
        value: http://llmux.llmux-prod.svc.cluster.local:8080/v1
  - target:
      kind: CiliumNetworkPolicy
      name: openwebui
    patch: |
      - op: test
        path: /spec/egress/0/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: llmux
      - op: replace
        path: /spec/egress/0/toEndpoints/0/matchLabels/k8s:io.kubernetes.pod.namespace
        value: llmux-prod
